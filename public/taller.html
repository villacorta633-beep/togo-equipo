<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOGO · Mi taller</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D;--bg2:#141414;--bg3:#1A1A1A;--bg4:#222;--border:#2A2A2A;--border2:#333;
  --amber:#F5A623;--amber-dim:#F5A6231a;--text:#E8E8E8;--text2:#A3A3A3;--text3:#6b6b6b;
  --red:#FF5A4E;--green:#3fb68b;--blue:#5b8def;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px;}
button,select,input{font-family:inherit;}
a{color:inherit;}
.header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 24px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
.logo{background:var(--amber);color:#000;font-weight:700;font-size:13px;padding:4px 10px;border-radius:4px;letter-spacing:1px;font-family:var(--mono);text-decoration:none;}
.titulo{display:flex;flex-direction:column;line-height:1.2;}
.titulo b{font-size:15px;}
.titulo span{font-size:11px;color:var(--text3);font-family:var(--mono);letter-spacing:.5px;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tab{padding:7px 12px;border-radius:6px;font-size:13px;color:var(--text2);text-decoration:none;border:1px solid transparent;}
.tab:hover{color:var(--text);background:var(--bg3);}
.tab.on{color:var(--amber);background:var(--amber-dim);border-color:#F5A62355;}
.sep{flex:1;}
.btn{padding:6px 12px;font-size:11px;font-family:var(--mono);font-weight:500;border:1px solid var(--border2);background:transparent;color:var(--text2);border-radius:4px;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;text-decoration:none;white-space:nowrap;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px;}
.estado{display:flex;align-items:center;justify-content:center;min-height:60vh;text-align:center;color:var(--text2);line-height:1.7;padding:24px;}
h2{font-size:20px;font-weight:700;letter-spacing:-.2px;}
.sub{color:var(--text2);font-size:13px;margin-top:4px;line-height:1.5;}
.h3{font-size:11px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--text3);font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
.h3 .n{color:var(--text2);}
.resumen{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.res{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:150px;}
.res b{font-size:22px;font-family:var(--mono);display:block;}
.res span{font-size:12px;color:var(--text2);}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.item{display:block;text-decoration:none;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--c,var(--border2));border-radius:6px;padding:11px 14px;margin-bottom:8px;transition:border-color .15s,background .15s;}
a.item:hover{border-color:var(--amber);background:var(--bg3);}
.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.placa{font-family:var(--mono);font-weight:700;font-size:13px;}
.causa{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;color:var(--c);margin-left:auto;}
.item-t{font-weight:600;margin-top:4px;font-size:13.5px;}
.item-d{color:var(--text2);font-size:12.5px;margin-top:3px;line-height:1.5;}
.vacio{color:var(--text3);font-size:13px;padding:10px 0;}
.grid-veh{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.veh{display:block;text-decoration:none;background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--c);border-radius:8px;padding:14px 16px;transition:border-color .15s,transform .15s;}
.veh:hover{border-color:var(--amber);}
.veh .m{font-size:12px;color:var(--text2);}
.veh .v{font-weight:600;margin-top:10px;font-size:13px;}
.veh .x{font-size:12px;color:var(--text2);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;}
.semaforo{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;}
.veredicto{border-left:4px solid var(--c);background:var(--bg2);border-radius:0 8px 8px 0;padding:14px 18px;margin-top:16px;}
.veredicto b{font-size:16px;}
.veredicto p{color:var(--text2);margin-top:6px;line-height:1.55;font-size:13.5px;}
.diag{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:6px;margin-bottom:10px;}
.diag summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;flex-direction:column;gap:3px;}
.diag summary::-webkit-details-marker{display:none;}
.diag summary .item-top::after{content:'Ver diagnóstico ▾';font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:12px;}
.diag[open] summary .item-top::after{content:'Ocultar ▴';}
.diag .cuerpo{padding:0 16px 16px;border-top:1px solid var(--border);}
.bloques{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:12px;}
.bloque h5{font-size:10.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.7px;color:var(--amber);margin-bottom:6px;font-weight:600;}
.bloque ul{padding-left:16px;}
.bloque li{font-size:12.5px;color:var(--text);line-height:1.5;margin-bottom:5px;}
.bloque li span{color:var(--text2);}
.bloque.full{grid-column:1/-1;}
.evid{font-family:var(--mono);font-size:11px;color:var(--text2);margin-top:10px;line-height:1.6;}
.evid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.que{color:var(--text2);font-size:12.5px;margin-top:10px;line-height:1.55;}
table.plan{width:100%;border-collapse:collapse;font-size:12.5px;}
table.plan th{text-align:left;font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.6px;color:var(--text3);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.plan td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;}
.tabla-scroll{overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:8px;}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;font-family:var(--mono);}
.chip.ok{background:#3fb68b22;color:var(--green);}
.chip.pronto{background:#F5A62322;color:var(--amber);}
.chip.toca{background:#FF5A4E22;color:var(--red);}
.chip.sin{background:#8a8a8a22;color:#b5b5b5;}
.chip.verificar{background:#5b8def22;color:var(--blue);}
.ley{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 12px;font-size:12px;color:var(--text2);align-items:center;}
.ficha{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;}
.ficha li{font-size:13px;line-height:1.55;margin:0 0 6px 16px;color:var(--text);}
.notas{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;white-space:pre-wrap;font-size:13.5px;line-height:1.55;}
.notas.vacia{color:var(--text3);font-style:italic;}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;}
.fbtn{padding:6px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;}
.fbtn.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.buscar{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;color:var(--text);padding:7px 14px;font-size:13px;min-width:220px;flex:1;max-width:340px;}
.lib-sis{font-size:10px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.6px;}
.sel{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:4px;padding:6px 10px;font-size:13px;font-family:var(--mono);}
.cab-veh{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.cab-veh .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.pie{margin-top:40px;font-size:11.5px;color:var(--text3);line-height:1.6;border-top:1px solid var(--border);padding-top:14px;}
/* ── Interfaz más visual ── */
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;}
#app.entra>*{animation:entra .28s ease both;}
@keyframes entra{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.info{position:relative;display:inline-flex;color:var(--text3);cursor:help;vertical-align:-2px;}
.info:hover,.info:focus{color:var(--amber);outline:none;}
.info .tip{display:none;position:absolute;z-index:20;left:50%;top:22px;transform:translateX(-50%);width:min(280px,80vw);background:var(--bg4);border:1px solid var(--border2);color:var(--text);font-size:12px;line-height:1.5;padding:10px 12px;border-radius:8px;box-shadow:0 8px 24px #000a;font-weight:400;text-transform:none;letter-spacing:0;font-family:var(--font);white-space:normal;}
.info:hover .tip,.info:focus .tip{display:block;}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px;}
.seg button{background:none;border:none;color:var(--text2);font-size:12px;padding:6px 14px;border-radius:16px;cursor:pointer;transition:all .15s;}
.seg button.on{background:var(--amber);color:#000;font-weight:600;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 6px;}
.kpis-4{grid-template-columns:repeat(4,1fr);}
.kpi{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);}
a.kpi:hover{border-color:var(--c);transform:translateY(-1px);}
.kpi .ico{color:var(--c);width:18px;height:18px;}
.kpi b{font-size:26px;font-family:var(--mono);line-height:1.2;margin-top:4px;}
.kpi b.txt{font-size:14.5px;font-family:var(--font);font-weight:700;line-height:1.3;}
.kpi span{font-size:12px;color:var(--text2);}
.h3 .ico{color:var(--text2);}
.lista-v{display:flex;flex-direction:column;gap:8px;}
.card-v{display:block;text-decoration:none;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:8px;padding:10px 14px;transition:border-color .15s,background .15s;}
.card-v:hover{border-color:var(--amber);background:var(--bg3);}
.cv-top{display:flex;align-items:center;gap:8px;}
.cv-top .ico{color:var(--text2);}
.cv-sub{font-size:11.5px;color:var(--text3);margin-left:auto;}
.cv-top .cv-sub{margin-left:auto;}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--bg4);color:var(--text);}
.tchip b{font-family:var(--mono);font-weight:500;font-size:10.5px;color:var(--text2);}
.tchip .ico{width:13px;height:13px;}
.tchip.rojo{background:#FF5A4E1f;color:#ff8a80;}
.tchip.ambar{background:#F5A6231c;color:#ffc864;}
.tchip.azul{background:#5b8def1f;color:#93b4ff;}
.fila{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;transition:border-color .15s;}
.fila[open],.fila:hover{border-color:var(--border2);}
.fila summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;}
.fila summary::-webkit-details-marker{display:none;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;}
.fila-t{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fila[open] .fila-t{white-space:normal;}
.fila-e{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;color:var(--c);white-space:nowrap;}
.fila-d{padding:0 14px 12px 32px;font-size:12.5px;color:var(--text2);line-height:1.55;}
.fila-d a{color:var(--amber);text-decoration:none;white-space:nowrap;}
.vacio .ico{color:var(--green);}
.banner{display:flex;gap:12px;align-items:center;text-decoration:none;background:#5b8def14;border:1px solid #5b8def44;border-radius:10px;padding:12px 16px;margin-top:16px;}
.banner .ico{color:var(--blue);width:22px;height:22px;}
.banner b{display:block;font-size:13.5px;}
.banner span{font-size:12px;color:var(--text2);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;align-items:start;}
.ag-col{background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--c);border-radius:10px;min-height:120px;}
.ag-col.c-rojo{--c:var(--red);} .ag-col.c-ambar{--c:var(--amber);} .ag-col.c-azul{--c:var(--blue);} .ag-col.c-gris{--c:#8a8a8a;}
.ag-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.7px;color:var(--text2);}
.ag-h b{background:var(--c);color:#000;border-radius:10px;padding:1px 8px;font-size:11px;}
.ag-body{display:flex;flex-direction:column;gap:6px;padding:0 8px 10px;}
.ag-vacio{color:var(--green);text-align:center;padding:16px 0;}
.ag-chip,.ag-veh{display:block;text-decoration:none;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;transition:border-color .15s,transform .15s;}
.ag-chip:hover,.ag-veh:hover{border-color:var(--c);transform:translateY(-1px);}
.ag-f{font-family:var(--mono);font-size:11px;color:var(--c);font-weight:700;margin-right:6px;}
.ag-t{font-size:12.5px;font-weight:600;}
.ag-p{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--text2);margin-top:3px;}
.ag-p .ico{width:13px;height:13px;}
.ag-n{margin-left:auto;background:#FF5A4E26;color:#ff8a80;border-radius:10px;padding:0 7px;font-size:11px;font-family:var(--mono);}
.ag-mini{font-size:11.5px;color:var(--text2);margin-top:4px;line-height:1.4;}
.ag-sin{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px;}
.ag-sin .ag-chip{--c:#8a8a8a;}
.ley-dots{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);}
.ley-dots span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;}
.veh .cv-top .placa{font-size:15px;}
.veh .semaforo{margin-left:auto;width:10px;height:10px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent);}
.mini-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.mini-stats span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-family:var(--mono);background:var(--bg3);border-radius:6px;padding:3px 8px;color:var(--text);}
.mini-stats i{font-style:normal;color:var(--text3);}
.mini-stats .alto{color:#ff8a80;} .mini-stats .medio{color:#ffc864;}
.mini-stats .ico{width:13px;height:13px;}
.cv-id{display:flex;align-items:center;gap:12px;}
.cv-id>.ico{width:30px;height:30px;color:var(--amber);}
.btn-i{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border2);border-radius:8px;color:var(--text2);transition:all .15s;}
.btn-i:hover{border-color:var(--amber);color:var(--amber);}
.btn-i .ico{width:18px;height:18px;}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:20px 0 16px;overflow-x:auto;scrollbar-width:none;}
.subtabs a{padding:9px 14px;font-size:13px;color:var(--text2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.subtabs a:hover{color:var(--text);}
.subtabs a.on{color:var(--amber);border-bottom-color:var(--amber);}
.subtabs i{font-style:normal;font-size:10.5px;font-family:var(--mono);background:var(--bg4);color:var(--text);border-radius:10px;padding:0 7px;}
.sub-cuerpo{min-height:200px;}
.barra-c{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;background:var(--bg3);}
.veredicto .ley-dots{margin-top:8px;font-size:11.5px;}
.accion{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:8px;padding:11px 14px;margin-bottom:8px;transition:border-color .15s,background .15s;}
a.accion:hover{border-color:var(--c);background:var(--bg3);}
.accion>.ico{color:var(--c);width:18px;height:18px;}
.accion div{flex:1;min-width:0;}
.accion b{display:block;font-size:13.5px;}
.accion span{font-size:12px;color:var(--text2);}
.accion>i{font-style:normal;color:var(--text3);}
.tareas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.tarea{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.tarea-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;}
.tarea-top b{font-size:13.5px;}
.tarea-f{font-size:11.5px;font-family:var(--mono);color:var(--c);}
.prog{height:6px;border-radius:4px;background:var(--bg4);margin:9px 0 7px;overflow:hidden;}
.prog div{height:100%;background:var(--c);border-radius:4px;transform-origin:left;animation:crece .6s ease both;}
@keyframes crece{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.tarea-s{font-size:11.5px;color:var(--text3);}
a.rev-box{text-decoration:none;border-top:3px solid var(--c);transition:border-color .15s,transform .15s;}
a.rev-box:hover{border-color:var(--c);transform:translateY(-1px);}
.rev-estado{font-size:14px;font-weight:700;color:var(--c);}
.rev-btn{align-self:flex-start;margin-top:auto;font-size:11.5px;font-family:var(--mono);color:var(--c);border:1px solid var(--c);border-radius:6px;padding:4px 10px;}
.hist-lista{display:flex;flex-direction:column;gap:4px;}
.hist{display:grid;grid-template-columns:auto 90px 70px 90px 1fr auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;}
.hist-f,.hist-km{font-family:var(--mono);font-size:11.5px;color:var(--text2);}
.hist-t{color:var(--text2);text-transform:capitalize;}
.hist-r{color:var(--text);}
.diag summary{flex-direction:row;align-items:center;gap:10px;}
.diag summary .item-top::after{content:none;}
.diag-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.diag-t b{font-size:13.5px;}
.diag-t span{font-size:11.5px;color:var(--text3);}
.abre{font-style:normal;color:var(--text3);transition:transform .2s;}
.diag[open] .abre{transform:rotate(180deg);}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:8px;background:var(--bg4);border:1px solid var(--green);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px #000a;transition:all .25s;z-index:50;}
.toast.on{opacity:1;transform:translate(-50%,0);}
.toast .ico{color:var(--green);}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(3,1fr);gap:8px;}
  .kpis-4{grid-template-columns:repeat(2,1fr);}
  .kpi{padding:10px 12px;} .kpi b{font-size:21px;} .kpi b.txt{font-size:13px;}
  .board{grid-template-columns:1fr;}
  .tareas{grid-template-columns:1fr;}
  .hist{grid-template-columns:auto 1fr auto;}
  .hist-t,.hist-km{display:none;}
  .hist-r{grid-column:2/3;}
}

/* Las columnas no se estiran más que la pantalla por un contenido largo */
.cols>*,.board>*{min-width:0;}
/* Mi gestión */
.filtros-d{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sel-per{border-radius:20px;padding:6px 12px;}
.cmp{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;}
.cmp s{color:var(--text3);text-decoration:none;}
.cmp b{color:var(--text);}
.cmp em{font-style:normal;font-size:11px;color:var(--text3);}
.cmp em.bien{color:var(--green);} .cmp em.mal{color:var(--red);}
.kpi .cmp{font-size:17px;margin-top:6px;}
.kpi .cmp b{font-size:20px;}
.tchip.verde{background:#3fb68b22;color:#7fd7ae;}
.ini-g{display:inline-flex;align-items:center;gap:5px;color:var(--text);}
.ini-g input{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:3px 8px;font-size:12.5px;font-family:var(--mono);color-scheme:dark;}
/* Agenda y revisiones */
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.rev-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.rev-box .btn{align-self:flex-start;margin-top:auto;}
.link-x{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;text-decoration:underline;}
.link-x:hover{color:var(--red);}
.btn-ok{background:var(--amber);border-color:var(--amber);color:#000;font-weight:700;}
.btn-ok:hover{color:#000;filter:brightness(1.08);}
.form-rev{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0 12px;}
.form-rev label,.form-nota{display:flex;flex-direction:column;gap:5px;font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.6px;}
.form-rev input,.form-nota textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:9px 12px;font-size:14px;font-family:var(--font);text-transform:none;letter-spacing:0;}
.form-rev input{width:200px;}
.form-nota{margin-top:14px;}
.form-nota textarea{min-height:90px;resize:vertical;}
.rev-items{display:flex;flex-direction:column;gap:8px;}
.rev-item{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;}
.tri{display:flex;flex:none;border:1px solid var(--border2);border-radius:6px;overflow:hidden;}
.tri button{background:transparent;border:none;color:var(--text2);padding:8px 12px;font-size:12px;cursor:pointer;border-right:1px solid var(--border2);}
.tri button:last-child{border-right:none;}
.tri button.on[data-e="ok"]{background:#3fb68b26;color:var(--green);font-weight:600;}
.tri button.on[data-e="atencion"]{background:#FF5A4E26;color:var(--red);font-weight:600;}
.tri button.on[data-e="na"]{background:var(--bg4);color:var(--text);font-weight:600;}
.form-acc{display:flex;gap:12px;align-items:center;margin-top:16px;}
.form-acc .btn{padding:10px 18px;font-size:12px;}
/* Hoja para imprimir: papel blanco */
.hoja-acc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.hoja-imp{background:#fff;color:#1b1b1b;border-radius:6px;padding:32px 36px;max-width:860px;margin:0 auto;font-size:12px;}
.hj-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid #1b1b1b;padding-bottom:12px;}
.hj-logo{background:var(--amber);color:#000;font-weight:700;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:3px;letter-spacing:1px;}
.hj-tit{font-size:20px;font-weight:700;margin-top:8px;}
.hj-sub{color:#555;margin-top:2px;}
.hj-campos{font-size:12px;line-height:2.2;text-align:right;color:#333;}
.hj-sec{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin:16px 0 6px;color:#1b1b1b;}
table.hj{width:100%;border-collapse:collapse;}
table.hj th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#555;text-align:left;padding:4px 6px;border-bottom:1px solid #999;}
table.hj th.c{text-align:center;width:48px;}
table.hj td{border-bottom:1px solid #ddd;padding:5px 6px;vertical-align:top;}
table.hj td.box{border:1px solid #999;width:48px;}
.hj .por{color:#777;font-size:10.5px;margin-top:1px;}
.hj-lineas div{border-bottom:1px solid #bbb;height:26px;}
.hj-firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;}
.hj-firmas div{border-top:1px solid #1b1b1b;padding-top:5px;text-align:center;color:#555;font-size:11px;}
@media print{
  @page{size:A4;margin:10mm;}
  body{background:#fff;}
  .header,.no-print,.pie{display:none !important;}
  .wrap{padding:0;max-width:none;}
  .hoja-imp{padding:0;border-radius:0;max-width:none;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  table.hj tr{break-inside:avoid;}
}
@media (max-width:820px){
  .rev-grid{grid-template-columns:1fr;}
  .rev-item{flex-direction:column;align-items:stretch;}
  .tri button{flex:1;}
  .hoja-imp{padding:18px;}
  .hj-top{flex-direction:column;} .hj-campos{text-align:left;}
  .cols,.bloques{grid-template-columns:1fr;}
  .wrap{padding:16px 16px 48px;}
  .header{padding:10px 16px;}
  .cab-veh .acc{margin-left:0;}
}

<body>
<div class="header">
  <a class="logo" href="/">TOGO</a>
  <div class="titulo"><b>Mi taller</b><span>MECÁNICO VIRTUAL</span></div>
  <nav class="tabs" id="tabs">
    <a class="tab" href="#hoy" data-v="hoy">Hoy</a>
    <a class="tab" href="#agenda" data-v="agenda">Agenda</a>
    <a class="tab" href="#vehiculos" data-v="vehiculos">Vehículos</a>
    <a class="tab" href="#plan" data-v="plan">Plan</a>
    <a class="tab" href="#gestion" data-v="gestion">Mi gestión</a>
    <a class="tab" href="#biblioteca" data-v="biblioteca">Biblioteca</a>
  </nav>
  <span class="sep"></span>
  <a class="btn" href="/">← Gastos</a>
</div>
<div class="wrap" id="app"><div class="estado">Cargando gastos…</div></div>

<script src="/taller.js"></script>
<script src="/mecanico.js"></script>
<script>
const T = window.Taller, M = window.Mecanico;
const fmt0 = new Intl.NumberFormat('es-BO', { maximumFractionDigits: 0 });
const bs = v => 'Bs ' + fmt0.format(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = () => localStorage.getItem('togo_token');
const goLogin = () => { ['togo_token', 'togo_user', 'togo_role'].forEach(k => localStorage.removeItem(k)); location.href = '/login.html?volver=' + encodeURIComponent(location.pathname + location.search + location.hash); };
const ROJO = 'var(--red)', AMBAR = 'var(--amber)', VERDE = 'var(--green)';
const ESTADO = { ok: 'Al día', pronto: 'Pronto', toca: 'Pasó el plazo', sin: 'Sin registro', verificar: 'Verificar' };

let CTX = null, NOTAS = new Map(), ACTIVAS = [], DIAG = new Map(), REVS = [];
const LIB = { tipo: '', q: '' };

async function api(path) {
  const r = await fetch(path, { headers: { 'x-auth-token': token() } });
  if (r.status === 401) { goLogin(); throw new Error('Sesión vencida'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
  return d;
}

async function cargar() {
  if (!token()) return goLogin();
  // Mi taller está en preparación: por ahora solo lo ve el admin (el rol lo confirma el servidor)
  const yo = await api('/api/me').catch(() => null);
  if (!yo) { document.getElementById('app').innerHTML = '<div class="estado">No se pudo verificar el usuario. Intenta de nuevo en un momento.</div>'; return; }
  if (yo.role !== 'admin') {
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('app').innerHTML = '<div class="estado">Mi taller todavía está en preparación.<br>Por ahora solo lo ve el administrador.</div>';
    return;
  }
  const t0 = Date.now();
  const aviso = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000), el = document.querySelector('#app .estado');
    if (s >= 5 && el) el.innerHTML = `Iniciando el servidor…<br><span style="font-size:12px">Se apaga cuando nadie lo usa y tarda hasta un minuto en arrancar. Espera un momento (${s} s).</span>`;
  }, 1000);
  let d;
  try {
    [d] = await Promise.all([api('/api/gastos'), api('/api/notas').then(n => n.notas.forEach(x => NOTAS.set(x.placa, x))).catch(() => {}),
      api('/api/revisiones').then(r => REVS = r.revisiones || []).catch(() => {})]);
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="estado">No se pudieron cargar los gastos.<br>${esc(e.message)}</div>`;
    return;
  } finally { clearInterval(aviso); }
  CTX = T.preparar(d.rows, d.flota?.placas || []);
  // Vehículos que están trabajando: la flota actual, o los que tuvieron gastos en los últimos 90 días
  ACTIVAS = M.activas(CTX);
  ACTIVAS.forEach(v => DIAG.set(v.placa, diagnostico(v.placa)));
  ACTIVAS.sort((a, b) => peso(DIAG.get(b.placa)) - peso(DIAG.get(a.placa)));
  window.addEventListener('hashchange', mostrar);
  mostrar();
}

// Todo lo que el taller sabe de una placa
function diagnostico(placa) {
  const inf = T.informe(CTX, placa);
  const anio = T.informe(CTX, placa, { desde: CTX.ref - 365 });
  const cruces = M.cruzar(CTX, placa);
  const plan = M.plan(CTX, placa);
  const agenda = M.agenda(CTX, placa, REVS);
  const altos = inf.hallazgos.filter(h => h.nivel === 'alto' && (h.ultimo || 0) >= CTX.ref - 365 && h.causa !== 'desgaste').length;
  const medios = inf.hallazgos.filter(h => h.nivel === 'medio' && (h.ultimo || 0) >= CTX.ref - 365 && h.causa !== 'desgaste').length + cruces.filter(c => c.ultimo >= CTX.ref - 365).length;
  const toca = plan.filter(p => p.estado === 'toca').length;
  // Un punto marcado "con atención" en la última revisión pone el vehículo en rojo hasta la siguiente
  const color = altos || agenda.abiertos.length ? ROJO : (medios || toca) ? AMBAR : VERDE;
  return { inf, anio, cruces, plan, agenda, altos: altos + agenda.abiertos.length, medios, toca, color };
}
const peso = d => (d.color === ROJO ? 100 : d.color === AMBAR ? 50 : 0) + d.altos * 5 + d.medios;

function mostrar(quieto) {
  const h = decodeURIComponent(location.hash.slice(1) || 'hoy');
  const [vista, arg, arg2] = h.split('/');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === (['vehiculo', 'revision', 'hoja'].includes(vista) ? 'vehiculos' : vista)));
  document.body.classList.toggle('modo-hoja', vista === 'hoja');
  const app = document.getElementById('app');
  if (vista === 'vehiculo' && CTX.veh.has(arg)) app.innerHTML = vVehiculo(arg, arg2);
  else if (vista === 'revision' && CTX.veh.has(arg) && M.CADA_REVISION[arg2]) { app.innerHTML = vRevision(arg, arg2); armarRevision(arg, arg2); }
  else if (vista === 'hoja' && CTX.veh.has(arg)) app.innerHTML = vHoja(arg);
  else if (vista === 'agenda') app.innerHTML = vAgenda();
  else if (vista === 'gestion') app.innerHTML = vGestion();
  else if (vista === 'vehiculos') app.innerHTML = vVehiculos();
  else if (vista === 'plan') app.innerHTML = vPlan();
  else if (vista === 'biblioteca') { app.innerHTML = vBiblioteca(); armarBiblioteca(); }
  else app.innerHTML = vHoy();
  const sel = document.getElementById('selVeh');
  if (sel) sel.onchange = () => location.hash = 'vehiculo/' + sel.value;
  document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = () => borrarRevision(b.dataset.borrar));
  despues();
  app.classList.remove('entra'); void app.offsetWidth; app.classList.add('entra');
  // Las pestañas internas de un vehículo no vuelven arriba del todo
  if (!quieto && !(vista === 'vehiculo' && arg2)) window.scrollTo(0, 0);
}

// ── AYUDANTES ─────────────────────────────────────────────────────────────────
const CUANDO = { atrasada: ['toca', 'Atrasada'], semana: ['pronto', 'Esta semana'], mes: ['pronto', 'Este mes'], luego: ['ok', 'Más adelante'], sin: ['sin', 'Sin registro'], averiguar: ['sin', 'Averiguar'] };
const enDias = f => f == null ? '' : f < 0 ? `hace ${fmt0.format(-f)} ${f === -1 ? 'día' : 'días'}` : f === 0 ? 'hoy' : `en ${fmt0.format(f)} ${f === 1 ? 'día' : 'días'}`;
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const nombreItem = (tipoVeh, tipoRev, id) => ((M.REVISION[tipoVeh][tipoRev] || []).find(i => i.id === id) || { t: id }).t.split(' (')[0];

// ── PIEZAS DE INTERFAZ ───────────────────────────────────────────────────────
// Íconos de línea (24×24) para que la pantalla se lea de un vistazo
const ICONOS = {
  aceite: '<path d="M12 3c-3 4-6 7-6 10.5A6 6 0 0 0 18 13.5C18 10 15 7 12 3z"/>',
  llave: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-2.5z"/>',
  alerta: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/>',
  calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  check: '<path d="M4 12l5 5L20 6"/>',
  km: '<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>',
  moto: '<circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 10 10h5l3.5 6.5M14 6h3l1.5 4"/>',
  furgon: '<path d="M2 16V7h12v9M14 10h4l3 3v3h-7"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/>',
  lista: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.5M4 12h.5M4 18h.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
  pregunta: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17v.5"/>',
  imprimir: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  cubo: '<path d="M12 3 3 8l9 5 9-5-9-5zM3 8v8l9 5 9-5V8"/>',
};
const ico = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n] || ''}</svg>`;
// Explicación larga escondida en un ⓘ: aparece al pasar el mouse o al tocar
const info = t => `<span class="info" tabindex="0" role="button" aria-label="Más información">${ico('info')}<span class="tip">${esc(t)}</span></span>`;
const icoVeh = tipo => ico(tipo === 'moto' ? 'moto' : 'furgon');
// Filtro por tipo de vehículo que comparten Hoy, Agenda y Vehículos
const FILTRO = { tipo: '' };
const pasaFiltro = placa => !FILTRO.tipo || CTX.veh.get(placa)?.tipo === FILTRO.tipo;
const segmento = () => `<div class="seg" id="seg">${[['', 'Todos'], ['moto', 'Motos'], ['furgon', 'Furgones']].map(([k, t]) => `<button data-t="${k}" class="${FILTRO.tipo === k ? 'on' : ''}">${t}</button>`).join('')}</div>`;
function aviso(texto) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `${ico('check')}<span>${esc(texto)}</span>`;
  document.body.appendChild(t); requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 300); }, 2400);
}

// ── HOY ──────────────────────────────────────────────────────────────────────
function vHoy() {
  const todo = M.hoy(CTX, ACTIVAS.map(v => v.placa), REVS);
  const ahora = todo.ahora.filter(x => pasaFiltro(x.placa)), revisar = todo.revisar.filter(x => pasaFiltro(x.placa));
  const activas = ACTIVAS.filter(v => pasaFiltro(v.placa));
  const rojos = activas.filter(v => DIAG.get(v.placa).color === ROJO).length;
  const chipsTareas = x => [
    ...x.tareas.map(t => `<span class="tchip ${t.id === 'aceite' ? 'rojo' : 'ambar'}" title="Último cargado hace ${fmt0.format(t.dias)} días">${t.id === 'aceite' ? ico('aceite') : ''}${esc(t.nombre)} <b>${fmt0.format(t.dias)} d</b></span>`),
    ...x.averiguar.map(n => `<span class="tchip azul" title="No hay ningún registro: averiguar">${ico('pregunta')}${esc(n)}</span>`),
    ...x.verificar.map(n => `<span class="tchip azul" title="Faltan registros de casi toda la flota en esos meses">${ico('pregunta')}${esc(n)}</span>`),
  ].join('');
  const tarjeta = x => {
    const v = CTX.veh.get(x.placa);
    return `<a class="card-v" style="--c:${x.color}" href="#vehiculo/${encodeURIComponent(x.placa)}/agenda">
      <div class="cv-top">${icoVeh(v.tipo)}<span class="placa">${esc(x.placa)}</span><span class="cv-sub">${esc(v.proxi)}</span></div>
      <div class="tchips">${chipsTareas(x)}</div></a>`;
  };
  const fila = x => `<details class="fila" style="--c:${x.color}">
      <summary><span class="dot"></span><span class="placa">${esc(x.placa)}</span><span class="fila-t">${esc(x.t)}</span><span class="fila-e">${esc(x.etiqueta)}</span></summary>
      <div class="fila-d">${esc(x.d)} <a href="#vehiculo/${encodeURIComponent(x.placa)}/diagnostico">Ver vehículo →</a></div></details>`;
  return `<div class="cab"><div><h2>Hoy en el taller</h2><div class="sub">${activas.length} vehículos trabajando · datos hasta ${T.fechaCorta(CTX.ref)} ${info('Todo sale de lo cargado en el Excel y de las revisiones registradas. Un trabajo que se hizo y no se cargó aparece como pendiente: si es así, cárgalo en el Excel. Se actualiza solo con cada carga de gastos.')}</div></div>${segmento()}</div>
    <div class="kpis">
      <a class="kpi" href="#hoy" data-ir="pend" style="--c:var(--red)">${ico('llave')}<b data-n="${ahora.filter(x => x.orden < 2).length}">0</b><span>por confirmar o hacer</span></a>
      <a class="kpi" href="#hoy" data-ir="rev" style="--c:var(--amber)">${ico('alerta')}<b data-n="${revisar.length}">0</b><span>para revisar</span></a>
      <a class="kpi" href="#vehiculos" style="--c:var(--text2)">${icoVeh('furgon')}<b data-n="${rojos}">0</b><span>vehículos en rojo</span></a>
    </div>
    <div class="cols">
      <section id="pend"><div class="h3">${ico('llave')} Para confirmar o hacer ${info('Tareas sin registro dentro de su plazo. El número es cuántos días pasaron desde el último registro.')}</div>
        ${ahora.length ? `<div class="lista-v">${ahora.map(tarjeta).join('')}</div>` : `<div class="vacio">${ico('check')} Todo al día.</div>`}</section>
      <section id="rev"><div class="h3">${ico('alerta')} Para revisar ${info('Toca una fila para ver el detalle.')}</div>
        ${revisar.length ? revisar.map(fila).join('') : `<div class="vacio">${ico('check')} Nada para revisar.</div>`}</section>
    </div>`;
}

// ── AGENDA (toda la flota) ───────────────────────────────────────────────────
function vAgenda() {
  const col = { atrasada: [], semana: [], proxima: [], mes: [], sin: [] };
  let sinRevisiones = 0;
  ACTIVAS.filter(v => pasaFiltro(v.placa)).forEach(v => {
    const a = DIAG.get(v.placa).agenda;
    // Tensar la cadena va en la revisión semanal del conductor
    a.tareas.filter(t => t.id !== 'cadena').forEach(t => {
      const k = t.proxima == null ? 'sin' : t.falta < 0 ? 'atrasada' : t.falta <= 7 ? 'semana' : t.falta <= 14 ? 'proxima' : t.falta <= 31 ? 'mes' : null;
      if (k) col[k].push({ placa: v.placa, tipo: v.tipo, t: t.nombre.split(' (')[0], fecha: t.proxima, falta: t.falta, km: t.fuente === 'km', critico: t.critico });
    });
    if (a.revisiones.every(r => r.cuando === 'nunca')) sinRevisiones++;
    a.revisiones.filter(r => r.proxima != null && r.falta <= 14).forEach(r => {
      const k = r.falta < 0 ? 'atrasada' : r.falta <= 7 ? 'semana' : 'proxima';
      col[k].push({ placa: v.placa, tipo: v.tipo, t: `Revisión ${r.tipo}`, fecha: r.proxima, falta: r.falta, rev: r.tipo });
    });
  });
  Object.values(col).forEach(l => l.sort((a, b) => (a.fecha ?? 0) - (b.fecha ?? 0)));
  const chip = x => `<a class="ag-chip" href="#${x.rev ? `revision/${encodeURIComponent(x.placa)}/${x.rev}` : `vehiculo/${encodeURIComponent(x.placa)}/agenda`}" title="${esc(x.t)} · ${x.fecha != null ? T.fechaCorta(x.fecha) : ''}">
      <span class="ag-f">${x.fecha != null ? T.fechaCorta(x.fecha).slice(0, 5) : '—'}</span><span class="ag-t">${esc(x.t)}</span><span class="ag-p">${icoVeh(x.tipo)}${esc(x.placa)}</span></a>`;
  // Lo atrasado se agrupa por vehículo: suele ser mucho y casi siempre por falta de registros
  const porPlaca = new Map();
  col.atrasada.forEach(x => { if (!porPlaca.has(x.placa)) porPlaca.set(x.placa, []); porPlaca.get(x.placa).push(x); });
  const atrasado = [...porPlaca.entries()].sort((a, b) => b[1].length - a[1].length).map(([placa, l]) => `<a class="ag-veh" href="#vehiculo/${encodeURIComponent(placa)}/agenda">
      <div class="cv-top">${icoVeh(l[0].tipo)}<span class="placa">${esc(placa)}</span><span class="ag-n">${l.length}</span></div>
      <div class="ag-mini">${l.slice(0, 3).map(x => esc(x.t)).join(' · ')}${l.length > 3 ? ` · +${l.length - 3}` : ''}</div></a>`).join('');
  const columna = (titulo, cls, cuerpo, n) => `<div class="ag-col ${cls}"><div class="ag-h"><span>${titulo}</span><b>${n}</b></div><div class="ag-body">${cuerpo || `<div class="ag-vacio">${ico('check')}</div>`}</div></div>`;
  return `<div class="cab"><div><h2>Agenda</h2><div class="sub">Lo que viene en las próximas semanas ${info('La fecha sale del último trabajo cargado en el Excel: por días o, si se conoce el kilometraje, por km (lo que llegue antes). Si algo aparece atrasado y ya se hizo, falta cargarlo en el Excel con el kilometraje.')}</div></div>${segmento()}</div>
    ${sinRevisiones ? `<a class="banner" href="#vehiculos">${ico('lista')}<div><b>${sinRevisiones === ACTIVAS.length ? 'Todavía no hay revisiones registradas' : `${sinRevisiones} vehículos sin revisiones`}</b><span>Imprime la hoja de cada vehículo y registra la revisión semanal con el kilometraje.</span></div></a>` : ''}
    <div class="board">
      ${columna('Atrasado', 'c-rojo', atrasado, porPlaca.size)}
      ${columna('Esta semana', 'c-ambar', col.semana.map(chip).join(''), col.semana.length)}
      ${columna('Próxima semana', 'c-azul', col.proxima.map(chip).join(''), col.proxima.length)}
      ${columna('Resto del mes', 'c-gris', col.mes.map(chip).join(''), col.mes.length)}
    </div>
    <details class="fila" style="--c:#8a8a8a;margin-top:16px"><summary><span class="dot"></span><span class="fila-t">Sin ningún registro: averiguar o programar</span><span class="fila-e">${col.sin.length}</span></summary>
      <div class="ag-sin">${col.sin.map(chip).join('')}</div></details>`;
}

// ── PERÍODO Y GESTIÓN ────────────────────────────────────────────────────────
// Inicio de la gestión del responsable (se puede cambiar en la pestaña Mi gestión)
const gestionIni = () => { try { return localStorage.getItem('togo_gestion') || '2026-02-01'; } catch { return '2026-02-01'; } };
// Período para el diagnóstico: '' todo, 'gestion', 'antes' o un año
const PER = { id: '' };
function rangoPer() {
  const ini = T.dia(gestionIni());
  if (PER.id === 'gestion') return { desde: ini, hasta: Infinity };
  if (PER.id === 'antes') return { desde: -Infinity, hasta: ini - 1 };
  if (/^\d{4}$/.test(PER.id)) return { desde: T.dia(`${PER.id}-01-01`), hasta: T.dia(`${PER.id}-12-31`) };
  return { desde: -Infinity, hasta: Infinity };
}
const periodoTxt = () => PER.id === 'gestion' ? `mi gestión (desde ${T.fechaCorta(T.dia(gestionIni()))})` : PER.id === 'antes' ? `antes de mi gestión` : PER.id ? `año ${PER.id}` : 'todo el historial';
const CACHE_INF = new Map();
// Informe de una placa en el período elegido (se guarda para no recalcular)
function infDe(placa) {
  if (!PER.id) return DIAG.get(placa)?.inf || T.informe(CTX, placa);
  const k = `${placa}|${PER.id}|${gestionIni()}`;
  if (!CACHE_INF.has(k)) CACHE_INF.set(k, T.informe(CTX, placa, rangoPer()));
  return CACHE_INF.get(k);
}
function selPeriodo() {
  const anios = [...new Set([...CTX.veh.values()].flatMap(v => v.filas.map(r => r.anio)))].sort((a, b) => b - a);
  const op = [['', 'Todo el historial'], ['gestion', 'Mi gestión'], ['antes', 'Antes de mi gestión'], ...anios.map(a => [String(a), String(a)])];
  return `<select class="sel sel-per" id="selPer" title="Período del diagnóstico">${op.map(([k, t]) => `<option value="${k}" ${PER.id === k ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
}

// ── MI GESTIÓN: antes y durante ──────────────────────────────────────────────
function vGestion() {
  const iniTxt = gestionIni(), ini = T.dia(iniTxt);
  const vs = ACTIVAS.filter(v => pasaFiltro(v.placa));
  const G = vs.map(v => ({ v, g: M.gestion(CTX, v.placa, ini) })).filter(x => x.g);
  // Totales de la flota: gasto por mes, parte evitable, preventivos por vehículo y mes
  const suma = (k, campo) => G.reduce((s, x) => s + (x.g[k][campo] || 0), 0);
  // Gasto mensual de la flota: suma de lo que gasta por mes cada vehículo en su propio tramo
  const porMes = k => G.filter(x => k === 'antes' ? x.g.hayAntes : x.g.hayAhora).reduce((s, x) => s + x.g[k].porMes, 0);
  const evit = k => { const t = suma(k, 'total'); return t ? G.reduce((s, x) => s + M.EVITABLES.reduce((y, c) => y + x.g[k].causas[c], 0), 0) / t : 0; };
  const prev = k => { const l = G.map(x => x.g[k === 'antes' ? 'prevAntes' : 'prevAhora']).filter(x => x != null); return l.length ? l.reduce((s, x) => s + x, 0) / l.length : null; };
  // puntos: para porcentajes se muestra la diferencia en puntos (16% → 22% = +6 pts), no el cambio relativo
  const comp = (antes, ahora, fmt, mejorSiBaja, puntos) => {
    if (antes == null || ahora == null) return `<span class="cmp">${ahora == null ? '—' : fmt(ahora)}</span>`;
    const dif = puntos ? ahora - antes : antes ? (ahora - antes) / antes : 0, mejor = mejorSiBaja ? ahora <= antes : ahora >= antes;
    const igual = Math.abs(dif) < (puntos ? 0.02 : 0.05);
    const txt = igual ? '=' : (dif > 0 ? '▲' : '▼') + (puntos ? Math.round(Math.abs(dif) * 100) + ' pts' : Math.round(Math.abs(dif) * 100) + '%');
    return `<span class="cmp"><s>${fmt(antes)}</s> → <b>${fmt(ahora)}</b> <em class="${igual ? '' : mejor ? 'bien' : 'mal'}">${txt}</em></span>`;
  };
  const pct = x => Math.round(x * 100) + '%';
  const meses = Math.max(...G.map(x => x.g.ahora.meses), 0);
  // ¿Los registros de la gestión están completos? Si faltan, la comparación de preventivos no es confiable
  const completo = ['moto', 'furgon'].filter(t => vs.some(v => v.tipo === t)).map(t => CTX.parteCompleta(t, ini, CTX.ref));
  const incompleto = completo.some(x => x < 0.6);

  const heredadas = G.flatMap(x => x.g.heredadas.map(h => ({ ...h, placa: x.v.placa, tipo: x.v.tipo })));
  const resueltas = heredadas.filter(h => h.resuelta).length;
  const vienen = G.flatMap(x => x.g.vienen.map(h => ({ h, placa: x.v.placa })));
  const propios = G.flatMap(x => x.g.propios.map(h => ({ h, placa: x.v.placa })));
  const C = T.CAUSAS;

  const porPlaca = new Map();
  heredadas.forEach(h => { if (!porPlaca.has(h.placa)) porPlaca.set(h.placa, []); porPlaca.get(h.placa).push(h); });
  const tarjetasHer = [...porPlaca.entries()].map(([placa, l]) => `<a class="card-v" style="--c:${l.every(h => h.resuelta) ? 'var(--green)' : 'var(--amber)'}" href="#vehiculo/${encodeURIComponent(placa)}/agenda">
      <div class="cv-top">${icoVeh(l[0].tipo)}<span class="placa">${esc(placa)}</span><span class="cv-sub">${l.filter(h => h.resuelta).length} de ${l.length} resueltas</span></div>
      <div class="tchips">${l.map(h => `<span class="tchip ${h.resuelta ? 'verde' : h.critico ? 'azul' : ''}" title="${h.ultimoAntes ? `Último antes: ${T.fechaCorta(h.ultimoAntes.dia)}` : 'Sin ningún registro antes'}${h.resuelta ? ` · hecho el ${T.fechaCorta(h.resuelta.dia)}` : ''}">${h.resuelta ? ico('check') : ''}${esc(h.nombre.split(' (')[0])}${h.ultimoAntes ? ` <b>${T.fechaCorta(h.ultimoAntes.dia).slice(3)}</b>` : ' <b>nunca</b>'}</span>`).join('')}</div></a>`).join('');
  const filaH = ({ h, placa }, previo) => `<details class="fila" style="--c:${previo ? 'var(--blue)' : C[h.causa].color}">
      <summary><span class="dot"></span><span class="placa">${esc(placa)}</span><span class="fila-t">${esc(h.titulo)}</span><span class="fila-e">${previo ? 'desde ' + T.fechaCorta(h.causaDesde) : esc(C[h.causa].nombre)}</span></summary>
      <div class="fila-d">${previo ? `<b>La causa empezó el ${T.fechaCorta(h.causaDesde)}, antes de tu gestión.</b> ` : ''}${esc(h.detalle)} <a href="#vehiculo/${encodeURIComponent(placa)}/diagnostico">Ver vehículo →</a></div></details>`;
  const tabla = G.map(({ v, g }) => `<tr><td><a class="placa" href="#vehiculo/${encodeURIComponent(v.placa)}" style="text-decoration:none">${esc(v.placa)}</a><div class="item-d">${esc(v.etiqueta)}</div>${g.reingreso ? `<div class="item-d" style="color:var(--blue)">a cargo desde ${T.fechaCorta(g.reingreso.vuelve)}</div>` : ''}</td>
      <td>${comp(g.hayAntes ? g.antes.porMes : null, g.hayAhora ? g.ahora.porMes : null, x => bs(x), true)}</td>
      <td>${comp(g.hayAntes ? g.evitableAntes : null, g.hayAhora ? g.evitableAhora : null, pct, true, true)}</td>
      <td>${comp(g.prevAntes, g.prevAhora, x => x.toFixed(1).replace('.', ','), false)}</td>
      <td>${g.heredadas.length ? `${g.heredadas.filter(h => h.resuelta).length}/${g.heredadas.length}` : '—'}</td></tr>`).join('');

  return `<div class="cab"><div><h2>Mi gestión</h2>
      <div class="sub">Antes y desde el <label class="ini-g">${ico('calendario')}<input type="date" id="gesIni" value="${esc(iniTxt)}" max="${hoyISO()}"></label> ${info('Compara los vehículos que están trabajando antes y después de la fecha de inicio de tu gestión (la puedes cambiar). Todo sale de los gastos cargados en el Excel: si en un período faltan registros, la comparación pierde precisión.')}</div></div>${segmento()}</div>
    ${(() => {
      // Proformas del taller de motos que faltan en el Excel desde unos meses antes de la gestión
      const faltan = M.proformasFaltantes(CTX, ini - 60);
      return faltan.length ? `<div class="banner" style="border-color:#FF5A4E55;background:#FF5A4E12">${ico('alerta')}<div><b>Faltan ${faltan.length} proformas del taller de motos en el Excel</b>
        <span>N.º ${faltan.join(', ')}. Pueden ser trabajos que no se cargaron (o proformas anuladas) e incluir cambios de aceite: mientras falten, los "días sin cambio de aceite" pueden ser menos de los que se ven. Pide esas proformas al taller y cárgalas con su placa.</span></div></div>` : '';
    })()}
    ${incompleto ? `<div class="banner" style="border-color:#F5A62355;background:#F5A62312">${ico('alerta')}<div><b>Faltan registros en parte de tu gestión</b><span>En varios meses casi ningún vehículo tiene sus cambios de aceite cargados: la comparación de preventivos puede salir peor de lo que fue. Cargar lo que falte en el Excel la corrige sola.</span></div></div>` : ''}
    <div class="kpis kpis-4">
      <div class="kpi" style="--c:var(--amber)">${ico('llave')}${comp(porMes('antes'), porMes('ahora'), x => bs(x), true)}<span>gasto de mantenimiento por mes</span></div>
      <div class="kpi" style="--c:var(--red)">${ico('alerta')}${comp(evit('antes'), evit('ahora'), pct, true, true)}<span>del gasto se pudo evitar</span></div>
      <div class="kpi" style="--c:var(--green)">${ico('aceite')}${comp(prev('antes'), prev('ahora'), x => x.toFixed(1).replace('.', ','), false)}<span>preventivos por vehículo al mes</span></div>
      <div class="kpi" style="--c:var(--blue)">${ico('check')}<b data-n="${resueltas}">0</b><span>de ${heredadas.length} pendientes heredados ya resueltos</span></div>
    </div>
    <div class="cols">
      <section><div class="h3">${ico('lista')} Lo que heredaste ${info(`Tareas que el ${T.fechaCorta(ini)} ya estaban atrasadas o nunca se habían registrado. En verde, las que ya se hicieron en tu gestión. El mes que aparece es el del último registro antes de empezar.`)}</div>
        ${tarjetasHer || `<div class="vacio">${ico('check')} No había tareas atrasadas al empezar.</div>`}</section>
      <section><div class="h3">${ico('pregunta')} Problemas que vienen de antes <span class="n">${vienen.length}</span> ${info('Fallas que aparecieron en tu gestión pero cuya causa empezó antes: una pieza puesta antes que duró poco, o un período sin cambio de aceite que empezó antes de tu fecha de inicio.')}</div>
        ${vienen.length ? vienen.map(x => filaH(x, true)).join('') : `<div class="vacio">${ico('check')} Ninguno.</div>`}
        <div class="h3">${ico('alerta')} Problemas de tu gestión <span class="n">${propios.length}</span> ${info('Hallazgos importantes cuya causa empezó después de tu fecha de inicio. Sirven para corregir a tiempo.')}</div>
        ${propios.length ? propios.map(x => filaH(x, false)).join('') : `<div class="vacio">${ico('check')} Ninguno.</div>`}</section>
    </div>
    ${G.some(x => x.g.reingreso) ? `<div class="banner">${ico('info')}<div><b>Vehículos que volvieron a la flota durante tu gestión</b><span>${G.filter(x => x.g.reingreso).map(x => `${esc(x.v.placa)}: sin ningún movimiento del ${T.fechaCorta(x.g.reingreso.ultimoAntes)} al ${T.fechaCorta(x.g.reingreso.vuelve)}`).join(' · ')}. Para ellos la comparación empieza el día que volvieron; lo atrasado de antes cuenta como heredado.</span></div></div>` : ''}
    <div class="h3">${ico('furgon')} Vehículo por vehículo <span class="n">${fmt0.format(meses)} meses de gestión</span></div>
    <div class="tabla-scroll"><table class="plan"><thead><tr><th>Placa</th><th>Gasto / mes</th><th>Se pudo evitar</th><th>Preventivos / mes</th><th>Heredados resueltos</th></tr></thead><tbody>${tabla}</tbody></table></div>`;
}

// ── VEHÍCULOS ────────────────────────────────────────────────────────────────
function vVehiculos() {
  const card = v => {
    const d = DIAG.get(v.placa);
    // Con un período elegido, el veredicto y el gasto son de ese período; si no, del último año
    const inf = infDe(v.placa), a = PER.id ? inf : d.anio;
    const ratio = a.comp.n >= 3 && a.ratio ? a.ratio : 0;
    return `<a class="veh" style="--c:${d.color}" href="#vehiculo/${encodeURIComponent(v.placa)}">
      <div class="cv-top">${icoVeh(v.tipo)}<span class="placa">${esc(v.placa)}</span><span class="semaforo" title="${d.color === ROJO ? 'Algo importante' : d.color === AMBAR ? 'Cosas para revisar' : 'En orden'}"></span></div>
      <div class="cv-sub" style="margin-top:2px">${esc(v.etiqueta)} · ${esc(v.proxi)}</div>
      <div class="v">${esc(inf.veredicto.titulo)}</div>
      <div class="mini-stats">
        <span title="Gasto de mantenimiento por mes, ${PER.id ? esc(periodoTxt()) : 'último año'}">${bs(a.porMes)}<i>/mes</i></span>
        ${ratio ? `<span class="${ratio >= 1.3 ? 'alto' : ''}" title="Comparado con vehículos iguales">${ratio >= 1.3 ? ratio.toFixed(1).replace('.', ',') + '×' : ratio <= 0.75 ? 'bajo' : 'normal'}</span>` : ''}
        ${d.altos ? `<span class="alto" title="Hallazgos importantes">${ico('alerta')}${d.altos}</span>` : ''}
        ${d.toca ? `<span class="medio" title="Tareas sin registro reciente">${ico('llave')}${d.toca}</span>` : ''}
      </div></a>`;
  };
  const grupo = (tipo, titulo) => { const vs = ACTIVAS.filter(v => v.tipo === tipo && pasaFiltro(v.placa)); return vs.length ? `<div class="h3">${icoVeh(tipo)} ${titulo} <span class="n">${vs.length}</span></div><div class="grid-veh">${vs.map(card).join('')}</div>` : ''; };
  return `<div class="cab"><div><h2>Vehículos</h2><div class="sub ley-dots"><span style="--c:var(--red)">algo importante</span><span style="--c:var(--amber)">para revisar</span><span style="--c:var(--green)">en orden</span></div></div><div class="filtros-d">${selPeriodo()}${segmento()}</div></div>
    ${grupo('furgon', 'Furgones')}${grupo('moto', 'Motos')}`;
}

// ── UN VEHÍCULO ──────────────────────────────────────────────────────────────
const SUBS = [['resumen', 'Resumen'], ['agenda', 'Agenda'], ['revisiones', 'Revisiones'], ['diagnostico', 'Diagnóstico'], ['ficha', 'Ficha']];
function vVehiculo(placa, sub = 'resumen') {
  if (!SUBS.some(s => s[0] === sub)) sub = 'resumen';
  const v = CTX.veh.get(placa);
  // El diagnóstico y el resumen siguen el período elegido; agenda y revisiones siempre son de hoy
  const d = { ...(DIAG.get(placa) || diagnostico(placa)), inf: infDe(placa) };
  const inf = d.inf, C = T.CAUSAS, a = d.agenda;
  const opciones = [...ACTIVAS, ...(ACTIVAS.some(x => x.placa === placa) ? [] : [v])].map(x => `<option value="${esc(x.placa)}" ${x.placa === placa ? 'selected' : ''}>${esc(x.placa)} · ${esc(x.etiqueta)}</option>`).join('');
  const hall = inf.hallazgos.filter(h => h.nivel !== 'bajo' || h.causa !== 'desgaste');
  const prox = a.tareas.find(t => t.proxima != null && t.falta >= 0);
  const atrasadas = a.tareas.filter(t => t.cuando === 'atrasada').length;
  const ultRev = REVS.filter(r => r.placa === placa).sort((x, y) => y.fecha.localeCompare(x.fecha))[0];
  const cuenta = { agenda: atrasadas, revisiones: a.abiertos.length, diagnostico: hall.length + d.cruces.length };
  const cuerpo = { resumen: subResumen, agenda: subAgenda, revisiones: subRevisiones, diagnostico: subDiagnostico, ficha: subFicha }[sub](placa, v, d);
  return `<div class="cab-veh">
      <div class="cv-id">${icoVeh(v.tipo)}<div><h2>${esc(placa)}</h2><div class="sub">${esc(v.etiqueta)} · ${esc(v.proxi)}</div></div></div>
      <div class="acc">${selPeriodo()}<select class="sel" id="selVeh">${opciones}</select>
        <a class="btn-i" href="/informe.html?placa=${encodeURIComponent(placa)}" title="Informe para imprimir">${ico('imprimir')}</a>
        <a class="btn-i" href="/flota-3d.html?placa=${encodeURIComponent(placa)}" title="Ver en 3D">${ico('cubo')}</a></div>
    </div>
    <div class="kpis kpis-4">
      <div class="kpi" style="--c:${C[inf.veredicto.causa].color}">${ico('llave')}<b class="txt">${esc(inf.veredicto.titulo)}</b><span>estado</span></div>
      <div class="kpi" style="--c:var(--text2)">${ico('km')}<b class="txt">${a.km ? fmt0.format(a.km.actual) + ' km' : '—'}</b><span>${a.km ? (a.km.porDia ? `~${fmt0.format(a.km.porDia)} km/día` : 'último registrado') : 'sin kilometraje'}</span></div>
      <div class="kpi" style="--c:${atrasadas ? 'var(--red)' : 'var(--amber)'}">${ico('calendario')}<b class="txt">${prox ? esc(prox.nombre.split(' (')[0]) : '—'}</b><span>${prox ? `próxima: ${T.fechaCorta(prox.proxima)} (${enDias(prox.falta)})` : 'sin próxima fecha'}${atrasadas ? ` · ${atrasadas} atrasada${atrasadas > 1 ? 's' : ''}` : ''}</span></div>
      <div class="kpi" style="--c:${a.abiertos.length ? 'var(--red)' : 'var(--green)'}">${ico('lista')}<b class="txt">${ultRev ? T.fechaCorta(T.dia(ultRev.fecha)) : 'Nunca'}</b><span>última revisión${a.abiertos.length ? ` · ${a.abiertos.length} con atención` : ''}</span></div>
    </div>
    <nav class="subtabs">${SUBS.map(([k, t]) => `<a href="#vehiculo/${encodeURIComponent(placa)}/${k}" class="${k === sub ? 'on' : ''}">${t}${cuenta[k] ? `<i>${cuenta[k]}</i>` : ''}</a>`).join('')}</nav>
    <div class="sub-cuerpo">${cuerpo}</div>`;
}

function subResumen(placa, v, d) {
  const inf = d.inf, a = d.agenda, C = T.CAUSAS;
  // Lo más urgente primero: puntos con atención, tareas atrasadas y hallazgos importantes del último año
  const acciones = [
    ...a.abiertos.map(x => ({ c: ROJO, i: 'alerta', t: `Con atención: ${x.item.t.split(' (')[0]}`, s: `Revisión ${x.tipo} del ${T.fechaCorta(T.dia(x.fecha))}`, ir: 'revisiones' })),
    ...a.tareas.filter(t => t.cuando === 'atrasada').slice(0, 3).map(t => ({ c: AMBAR, i: t.id === 'aceite' ? 'aceite' : 'llave', t: t.nombre.split(' (')[0], s: `tocaba el ${T.fechaCorta(t.proxima)} · si se hizo, cargarlo en el Excel`, ir: 'agenda' })),
    ...inf.hallazgos.filter(h => h.nivel === 'alto' && h.causa !== 'desgaste' && (h.ultimo || 0) >= CTX.ref - 365).slice(0, 3).map(h => ({ c: C[h.causa].color, i: 'alerta', t: h.titulo, s: C[h.causa].nombre, ir: 'diagnostico' })),
  ];
  const causas = Object.entries(inf.causas).filter(([, x]) => x > 0).sort((x, y) => C[x[0]].orden - C[y[0]].orden);
  return `<div class="veredicto" style="--c:${C[inf.veredicto.causa].color}"><b>${esc(inf.veredicto.titulo)}</b><p>${esc(inf.veredicto.texto)}</p>
      ${inf.total ? `<div class="barra-c">${causas.map(([k, x]) => `<div style="width:${x / inf.total * 100}%;background:${C[k].color}" title="${esc(C[k].nombre)}: ${bs(x)} (${Math.round(x / inf.total * 100)}%)"></div>`).join('')}</div>

function subAgenda(placa, v, d) {
  const a = d.agenda;
  const fila = t => {
    // Barra: cuánto del plazo ya pasó desde el último registro
    const prog = t.ultimo && t.proxima != null ? Math.min(1, Math.max(0, (a.hoyDia - t.ultimo.dia) / Math.max(1, t.proxima - t.ultimo.dia))) : null;
    const color = t.cuando === 'atrasada' ? 'var(--red)' : t.cuando === 'semana' || t.cuando === 'mes' ? 'var(--amber)' : t.proxima == null ? '#8a8a8a' : 'var(--green)';
    return `<div class="tarea" style="--c:${color}">
      <div class="tarea-top"><b>${esc(t.nombre.split(' (')[0])}</b><span class="tarea-f">${t.proxima != null ? `${T.fechaCorta(t.proxima)} · ${enDias(t.falta)}` : t.critico ? 'Averiguar km del último cambio' : 'Sin registro'}</span></div>
      <div class="prog">${prog != null ? `<div style="width:${Math.round(prog * 100)}%"></div>` : ''}</div>
      <div class="tarea-s">cada ${esc(t.cada)}${t.ultimo ? ` · último ${T.fechaCorta(t.ultimo.dia)}${+t.ultimo.km > 0 ? ` (${fmt0.format(+t.ultimo.km)} km)` : ''}` : ''}${t.fuente === 'km' ? ' · por km' : ''}${t.nota ? ' ' + info(t.nota) : ''}</div></div>`;
  };
  return `<div class="sub" style="margin-bottom:12px">La barra muestra cuánto del plazo ya pasó ${info('La próxima fecha sale del último trabajo cargado en el Excel: por días o, si se conoce el kilometraje, por km (lo que llegue antes). Si una tarea aparece atrasada y ya se hizo, falta cargarla en el Excel.')}</div>
    <div class="tareas">${a.tareas.map(fila).join('')}</div>`;
}

function subDiagnostico(placa, v, d) {
  const inf = d.inf, C = T.CAUSAS;
  const evid = filas => {
    const vistos = [...new Map(filas.map(e => [e.id, e])).values()];
    return vistos.length ? `<div class="evid">${vistos.slice(0, 4).map(e => `<div>${T.fechaCorta(e.dia)} · ${bs(e.monto)} · ${esc(e.descripcion.trim() || e.tipo)}</div>`).join('')}${vistos.length > 4 ? `<div>… y ${vistos.length - 4} más</div>` : ''}</div>` : '';
  };
  const lista = (arr, f) => `<ul>${arr.map(f).join('')}</ul>`;
  const saber = id => {
    const p = M.PIEZAS[id];
    if (!p) return '';
    const vida = p.vida[v.modelo] || p.vida[v.tipo] || '';
    // Lo que es solo de motos no se muestra en un furgón, y al revés
    const otro = v.tipo === 'moto' ? /^Furg[oó]n\b|\(furg[oó]n\)/i : /^Moto:|\(moto\)/i;
    const propio = x => !otro.test(x.t || x.p || x);
    return `<div class="bloques">
      <div class="bloque"><h5>¿Por qué suele fallar?</h5>${lista(p.causas.filter(propio), c => `<li><b>${esc(c.t)}.</b> <span>${esc(c.d)}</span></li>`)}</div>
      <div class="bloque"><h5>¿Qué más puede afectar?</h5>${lista(p.afecta.filter(propio), c => `<li><b>${esc(c.p)}:</b> <span>${esc(c.d)}</span></li>`)}</div>
      <div class="bloque"><h5>Qué revisar</h5>${lista(p.revisar.filter(propio), x => `<li>${esc(x)}</li>`)}${vida ? `<div class="que"><b>Vida normal:</b> ${esc(vida)}</div>` : ''}</div>
      <div class="bloque"><h5>Preguntas para el taller</h5>${lista(p.taller, x => `<li>${esc(x)}</li>`)}<h5 style="margin-top:12px">Preguntas para el conductor</h5>${lista(p.conductor, x => `<li>${esc(x)}</li>`)}</div>
    </div>`;
  };
  const tarjeta = h => {
    const pieza = M.piezaDe(h);
    return `<details class="diag" style="--c:${h.nivel === 'alto' ? ROJO : C[h.causa].color}">
      <summary><span class="dot"></span><div class="diag-t"><b>${esc(h.titulo)}</b><span>${esc(C[h.causa].nombre)} · ${h.nivel === 'alto' ? 'importante' : h.nivel === 'medio' ? 'a revisar' : 'informativo'}</span></div><i class="abre">▾</i></summary>
      <div class="cuerpo"><div class="que">${esc(h.detalle)}</div>${h.consejo ? `<div class="que"><b style="color:var(--text)">Qué hacer:</b> ${esc(h.consejo)}</div>` : ''}${evid(h.evidencias)}
        ${pieza ? saber(pieza) : ''}</div></details>`;
  };
  const hall = inf.hallazgos.filter(h => h.nivel !== 'bajo' || h.causa !== 'desgaste');
  const cruces = d.cruces.map(x => `<details class="diag" style="--c:var(--blue)">
      <summary><span class="dot"></span><div class="diag-t"><b>${esc(x.titulo)}</b><span>Pregunta del mecánico</span></div><i class="abre">▾</i></summary>
      <div class="cuerpo"><div class="que">${esc(x.detalle)}</div>${evid(x.filas)}${saber(x.pieza)}</div></details>`).join('');
  const normales = inf.hallazgos.find(h => h.titulo === 'Cambios normales por desgaste');
  return `<div class="sub" style="margin-bottom:12px">Toca un hallazgo para ver por qué pasa, qué más afecta y qué preguntar</div>
    ${hall.length ? hall.map(tarjeta).join('') : `<div class="vacio">${ico('check')} Sin señales de mal uso ni de falta de mantenimiento.</div>`}
    ${d.cruces.length ? `<div class="h3">${ico('pregunta')} Lo que el mecánico preguntaría ${info('Arreglos que normalmente van juntos y no aparecen en los gastos. Puede que se hayan hecho y no se anotaron: vale la pena preguntar.')}</div>${cruces}` : ''}
    ${normales ? `<div class="accion" style="--c:var(--green);margin-top:12px">${ico('check')}<div><b>Desgaste normal</b><span>${esc(normales.detalle)}</span></div></div>` : ''}`;
}

// Después de dibujar: filtros, contadores animados y atajos
function despues() {
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { FILTRO.tipo = b.dataset.t; mostrar(true); });
  const sp = document.getElementById('selPer');
  if (sp) sp.onchange = () => { PER.id = sp.value; mostrar(true); };
  const gi = document.getElementById('gesIni');
  if (gi) gi.onchange = () => { if (!gi.value) return; try { localStorage.setItem('togo_gestion', gi.value); } catch {} CACHE_INF.clear(); mostrar(true); };
  document.querySelectorAll('[data-ir]').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.ir)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-n]').forEach(el => {
    const fin = +el.dataset.n;
    // Sin animación si la pestaña está oculta (el navegador la pausa y quedaría en 0)
    if (quieto || !fin || document.hidden) { el.textContent = fmt0.format(fin); return; }
    const t0 = performance.now();
    const paso = t => { const p = Math.min(1, (t - t0) / 500); el.textContent = fmt0.format(Math.round(fin * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}

function armarRevision(placa, tipo) {
  document.querySelectorAll('.rev-item .tri button').forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    b.closest('.rev-item').dataset.estado = b.dataset.e;
  });
  document.getElementById('rvGuardar').onclick = async () => {
    const msg = document.getElementById('rvMsg'), btn = document.getElementById('rvGuardar');
    const items = {};
    document.querySelectorAll('.rev-item').forEach(el => items[el.dataset.id] = el.dataset.estado || 'ok');
    const kmTxt = document.getElementById('rvKm').value.trim();
    const datos = { placa, tipo, fecha: document.getElementById('rvFecha').value, km: kmTxt === '' ? null : Math.round(+kmTxt), items, nota: document.getElementById('rvNota').value.trim() };
    if (!datos.fecha) { msg.textContent = 'Falta la fecha.'; return; }
    btn.disabled = true; msg.textContent = 'Guardando…';
    try {
      const r = await enviar('/api/revisiones', 'POST', datos);
      REVS.unshift(r.revision);
      DIAG.set(placa, diagnostico(placa));
      aviso('Revisión guardada');
      location.hash = 'vehiculo/' + encodeURIComponent(placa) + '/revisiones';
    } catch (e) { msg.textContent = 'No se pudo guardar: ' + e.message; btn.disabled = false; }
  };
}
async function borrarRevision(id) {
  const r = REVS.find(x => String(x.id) === String(id));
  if (!r || !confirm(`¿Borrar la revisión ${r.tipo} del ${T.fechaCorta(T.dia(r.fecha))} de ${r.placa}? No se puede deshacer.`)) return;
  try {
    await enviar('/api/revisiones/' + encodeURIComponent(id), 'DELETE');
    REVS = REVS.filter(x => x !== r);
    DIAG.set(r.placa, diagnostico(r.placa));
    mostrar(true);
    aviso('Revisión borrada');
  } catch (e) { alert('No se pudo borrar: ' + e.message); }
}
async function enviar(path, method, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', 'x-auth-token': token() }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { goLogin(); throw new Error('Sesión vencida'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
  return d;
}

    <tbody>${items.map(i => `<tr><td><b>${esc(i.t)}</b><div class="por">${esc(i.por)}</div></td>${casillas(cols)}</tr>`).join('')}</tbody></table>`;
  return `<div class="no-print hoja-acc"><a class="btn" href="#vehiculo/${encodeURIComponent(placa)}">← ${esc(placa)}</a><button class="btn btn-ok" onclick="window.print()">Imprimir</button>
      <span class="item-d">Sale en una hoja A4. Marca ✓ si está bien o ✗ si hay que revisarlo, y avisa al responsable.</span></div>
    <div class="hoja-imp">
      <div class="hj-top"><div><span class="hj-logo">TOGO</span><div class="hj-tit">Hoja de revisión</div><div class="hj-sub">${esc(placa)} · ${esc(v.etiqueta)} · ${esc(v.proxi)}</div></div>
        <div class="hj-campos"><div>Conductor: ______________________</div><div>Mes: ________________ Año: ________</div></div></div>
      <div class="hj-sec">Antes de salir, todos los días (2 minutos)</div>
      ${tabla(L.diaria, 7, ['L', 'M', 'M', 'J', 'V', 'S', 'D'])}
      <div class="hj-sec">Cada semana</div>
      ${tabla(L.semanal, 5, ['Sem 1', 'Sem 2', 'Sem 3', 'Sem 4', 'Sem 5'])}
      <table class="hj"><tbody><tr><td><b>Kilometraje del día de la revisión semanal</b></td>${casillas(5)}</tr><tr><td><b>Fecha</b></td>${casillas(5)}</tr></tbody></table>
      <div class="hj-sec">Una vez al mes</div>
      ${tabla(L.mensual, 2, ['Bien', 'Revisar'])}
      <div class="hj-sec">Observaciones</div>
      <div class="hj-lineas"><div></div><div></div><div></div></div>
      <div class="hj-firmas"><div>Firma del conductor</div><div>Revisado por</div></div>
    </div>`;
}

const pie = () => `<div class="pie">El mecánico virtual saca sus conclusiones de las descripciones, fechas y montos del Excel de gastos, y de referencias de mantenimiento para estos modelos. Son indicios para preguntar y revisar, no un peritaje: confírmalos con el taller y con el conductor. Los intervalos varían según el manual, el aceite y el uso.</div>`;

cargar();
</script>
</body>
</html>

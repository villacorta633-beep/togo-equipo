<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOGO · Mi taller</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Mi taller (vista sencilla): tarjetas por vehículo → informe del vehículo */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D;--bg2:#141414;--bg3:#1A1A1A;--border:#2A2A2A;--border2:#333;
  --amber:#F5A623;--amber-dim:#F5A6231a;--text:#E8E8E8;--text2:#A3A3A3;--text3:#6b6b6b;
  --red:#FF5A4E;--green:#3fb68b;--corr:#e0705f;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px;line-height:1.5}
button,select{font-family:inherit}
a{color:inherit}
.header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 24px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.logo{background:var(--amber);color:#000;font-weight:700;font-size:13px;padding:4px 10px;border-radius:4px;letter-spacing:1px;font-family:var(--mono);text-decoration:none}
.titulo b{font-size:15px}
.sep{flex:1}
.btn{padding:6px 12px;font-size:11px;font-family:var(--mono);font-weight:500;border:1px solid var(--border2);background:transparent;color:var(--text2);border-radius:4px;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.btn:hover,.btn:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
.sel{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:4px;padding:6px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:5px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--text2);padding:6px 11px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--amber-dim);color:var(--amber)}
.wrap{max-width:980px;margin:0 auto;padding:22px 24px 60px}
.estado{display:flex;align-items:center;justify-content:center;min-height:60vh;text-align:center;color:var(--text2);line-height:1.7;padding:24px}
h2{font-size:20px;font-weight:700;text-wrap:balance}
.sub{color:var(--text2);font-size:13px;margin-top:4px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.h3{font-size:11px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--text3);font-weight:600;margin:28px 0 10px}
/* Tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--c);border-radius:8px;padding:14px 16px;transition:border-color .15s}
.card:hover,.card:focus-visible{border-color:var(--amber);outline:none}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.placa{font-family:var(--mono);font-weight:700;font-size:14px}
.monto{font-family:var(--mono);font-size:18px;font-weight:500}
.card .m{font-size:12px;color:var(--text2)}
.chip{align-self:flex-start;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.card .ult{font-size:12.5px;color:var(--text2)}
.card .ult b{color:var(--text);font-weight:600}
/* Informe del vehículo */
.volver{display:inline-block;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.kpi span{font-size:12px;color:var(--text2)}
.trabajo{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.tr-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tr-top h4{font-size:15px;font-weight:600}
.tr-top .monto{color:var(--amber);font-size:16px}
.tr-meta{font-size:12px;color:var(--text3);font-family:var(--mono)}
.tr-desc{font-size:12.5px;color:var(--text2);background:var(--bg3);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}
.causa{border-left:3px solid var(--corr);padding-left:14px;display:flex;flex-direction:column;gap:6px}
.causa h5{font-size:13px;font-weight:600}
.causa dl{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13px}
.causa dt{color:var(--text3);font-size:11px;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase;padding-top:2px}
.causa dd{min-width:0;max-width:66ch}
.tabla{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:10.5px;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--text3);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap;font-family:var(--mono)}
tr:last-child td{border-bottom:0}
.recs{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px}
.recs li{display:grid;grid-template-columns:28px 1fr;gap:10px;max-width:76ch}
.recs li::before{counter-increment:r;content:counter(r);font-family:var(--mono);font-size:12px;color:var(--amber);border:1px solid var(--amber);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.vacio{color:var(--text3);font-size:13px;padding:8px 0}
.pie{margin-top:30px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);max-width:80ch}
@media (max-width:720px){
  .wrap{padding:16px 16px 48px}
  .header{padding:10px 16px}
  .kpis{grid-template-columns:1fr}
  .causa dl{grid-template-columns:1fr}
  .causa dd{margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="header">
  <a class="logo" href="/">TOGO</a>
  <div class="titulo"><b>Mi taller</b></div>
  <span class="sep"></span>
  <a class="btn" href="/taller-completo.html">Vista completa</a>
  <a class="btn" href="/">← Gastos</a>
</div>
<div class="wrap" id="app"><div class="estado">Cargando gastos…</div></div>

<script src="/taller.js"></script>
<script src="/mecanico.js"></script>
<script src="/taller-simple.js"></script>
<script>
const T = window.Taller, M = window.Mecanico, S = window.TallerSimple;
const fmt0 = new Intl.NumberFormat('es-BO', { maximumFractionDigits: 0 });
const bs = v => 'Bs ' + fmt0.format(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = () => localStorage.getItem('togo_token');
const goLogin = () => { ['togo_token', 'togo_user', 'togo_role'].forEach(k => localStorage.removeItem(k)); location.href = '/login.html?volver=' + encodeURIComponent(location.pathname + location.hash); };
const leer = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

let CTX = null, ACTIVAS = [];
const F = { per: leer('togo_taller_per', '3'), tipo: leer('togo_taller_tipo', '') };
const PERIODOS = [['3', 'Últimos 3 meses'], ['6', 'Últimos 6 meses'], ['anio', 'Este año']];

async function api(path) {
  const r = await fetch(path, { headers: { 'x-auth-token': token() } });
  if (r.status === 401) { goLogin(); throw new Error('Sesión vencida'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
  return d;
}

async function cargar() {
  if (!token()) return goLogin();
  // Mi taller está en preparación: por ahora solo lo ve el admin (el rol lo confirma el servidor)
  const yo = await api('/api/me').catch(() => null);
  if (!yo) { app().innerHTML = '<div class="estado">No se pudo verificar el usuario. Intenta de nuevo en un momento.</div>'; return; }
  if (yo.role !== 'admin') { app().innerHTML = '<div class="estado">Mi taller todavía está en preparación.<br>Por ahora solo lo ve el administrador.</div>'; return; }
  const t0 = Date.now();
  const espera = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000), el = document.querySelector('#app .estado');
    if (s >= 5 && el) el.innerHTML = `Iniciando el servidor…<br><span style="font-size:12px">Se apaga cuando nadie lo usa y tarda hasta un minuto en arrancar (${s} s).</span>`;
  }, 1000);
  let d;
  try { d = await api('/api/gastos'); }
  catch (e) { app().innerHTML = `<div class="estado">No se pudieron cargar los gastos.<br>${esc(e.message)}</div>`; return; }
  finally { clearInterval(espera); }
  CTX = T.preparar(d.rows, d.flota?.placas || []);
  ACTIVAS = M.activas(CTX);
  window.addEventListener('hashchange', mostrar);
  mostrar();
}
const app = () => document.getElementById('app');

// Día desde el que se cuenta el período elegido (el último día con datos es CTX.ref)
function desde() {
  if (F.per === 'anio') return T.dia(T.fechaCorta(CTX.ref).slice(6) + '-01-01');
  return CTX.ref - Math.round(+F.per * 30.44);
}
const periodoTxt = () => PERIODOS.find(p => p[0] === F.per)[1].toLowerCase();

function mostrar() {
  const [vista, placa] = decodeURIComponent(location.hash.slice(1)).split('/');
  app().innerHTML = vista === 'vehiculo' && CTX.veh.has(placa) ? vVehiculo(placa) : vLista();
  const per = document.getElementById('per');
  if (per) per.onchange = () => { F.per = per.value; guardar('togo_taller_per', F.per); mostrar(); };
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { F.tipo = b.dataset.t; guardar('togo_taller_tipo', F.tipo); mostrar(); });
  window.scrollTo(0, 0);
}

const filtros = (conTipo = true) => `<div class="filtros">
  <select class="sel" id="per" aria-label="Período">${PERIODOS.map(([k, t]) => `<option value="${k}" ${F.per === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
  ${conTipo ? `<div class="seg" id="seg">${[['', 'Todos'], ['moto', 'Motos'], ['furgon', 'Furgones']].map(([k, t]) => `<button data-t="${k}" class="${F.tipo === k ? 'on' : ''}">${t}</button>`).join('')}</div>` : ''}
</div>`;

// Color y texto de la tarjeta según los trabajos grandes del período
function estadoDe(grandes) {
  if (!grandes.length) return { c: 'var(--green)', t: 'Solo servicios de rutina' };
  if (grandes.length === 1) return { c: 'var(--amber)', t: '1 trabajo grande' };
  return { c: 'var(--red)', t: `${grandes.length} trabajos grandes` };
}

// ── LISTA DE VEHÍCULOS ───────────────────────────────────────────────────────
function vLista() {
  const d0 = desde();
  const datos = ACTIVAS.filter(v => !F.tipo || v.tipo === F.tipo).map(v => {
    const tr = S.trabajosDe(CTX, v.placa, d0);
    return { v, tr, grandes: tr.filter(r => r.grande), total: tr.reduce((s, r) => s + r.monto, 0) };
  }).sort((a, b) => b.grandes.length - a.grandes.length || b.total - a.total);
  const card = ({ v, grandes, total }) => {
    const e = estadoDe(grandes), g = grandes[0];
    return `<a class="card" style="--c:${e.c}" href="#vehiculo/${encodeURIComponent(v.placa)}">
      <div class="card-top"><span class="placa">${esc(v.placa)}</span><span class="monto">${bs(total)}</span></div>
      <div class="m">${esc(v.etiqueta)}${v.proxi ? ' · ' + esc(v.proxi) : ''}</div>
      <span class="chip">${e.t}</span>
      <div class="ult">${g ? `Último: <b>${esc(g.que[0].nombre.split(':')[0])}</b> · ${T.fechaCorta(g.dia)}` : 'Sin reparaciones en el período'}</div>
    </a>`;
  };
  return `<div class="cab"><div><h2>Vehículos</h2><div class="sub">Gasto de taller en ${esc(periodoTxt())}, sin combustible. Toca una tarjeta para ver qué se le hizo, por qué y qué hacer de aquí en adelante.</div></div>${filtros()}</div>
    ${datos.length ? `<div class="grid">${datos.map(card).join('')}</div>` : '<div class="vacio">No hay vehículos con gastos en este período.</div>'}`;
}

// ── INFORME DE UN VEHÍCULO ───────────────────────────────────────────────────
function vVehiculo(placa) {
  const v = CTX.veh.get(placa), d0 = desde();
  const tr = S.trabajosDe(CTX, placa, d0);
  const grandes = tr.filter(r => r.grande), menores = tr.filter(r => !r.grande);
  const total = tr.reduce((s, r) => s + r.monto, 0);
  const km = [...v.filas].reverse().find(r => +r.km > 0);
  const recs = S.recomendaciones(CTX, placa, d0);
  const doc = r => r.doc ? `Doc. ${esc(r.doc)}` : 'Sin N° de documento';
  const bloque = r => `<article class="trabajo">
      <div class="tr-top"><div><h4>${esc(r.que.slice(0, 2).map(t => t.nombre).join(' · '))}</h4><div class="tr-meta">${T.fechaCorta(r.dia)} · ${esc(r.tipo)} · ${doc(r)}</div></div><span class="monto">${bs(r.monto)}</span></div>
      <div class="tr-desc">${esc(r.descripcion)}</div>
      ${r.que.slice(0, 2).map(t => `<div class="causa"><h5>${esc(t.nombre)}</h5><dl>
        <dt>Qué estaba fallando</dt><dd>${esc(t.falla)}</dd>
        <dt>Por qué pasa</dt><dd>${esc(t.pasa)}</dd>
        <dt>Por qué había que hacerlo</dt><dd>${esc(t.justifica)}</dd></dl></div>`).join('')}
    </article>`;
  return `<a class="btn volver" href="#">← Vehículos</a>
    <div class="cab"><div><h2>${esc(placa)}</h2><div class="sub">${esc(v.etiqueta)}${v.proxi ? ' · ' + esc(v.proxi) : ''}${km ? ` · último km registrado: ${fmt0.format(+km.km)} (${T.fechaCorta(km.dia)})` : ''}</div></div>${filtros(false)}</div>
    <div class="kpis">
      <div class="kpi"><b>${bs(total)}</b><span>gasto de taller, ${esc(periodoTxt())}</span></div>
      <div class="kpi"><b>${grandes.length}</b><span>${grandes.length === 1 ? 'trabajo grande' : 'trabajos grandes'} (${bs(grandes.reduce((s, r) => s + r.monto, 0))})</span></div>
      <div class="kpi"><b>${menores.length}</b><span>servicios y gastos menores (${bs(menores.reduce((s, r) => s + r.monto, 0))})</span></div>
    </div>
    <div class="h3">Trabajos grandes y por qué se hicieron</div>
    ${grandes.length ? grandes.map(bloque).join('') : '<div class="vacio">No hubo reparaciones grandes en este período.</div>'}
    <div class="h3">Servicios y gastos menores</div>
    ${menores.length ? `<div class="tabla"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="r">Bs</th></tr></thead><tbody>
      ${menores.map(r => `<tr><td class="r" style="text-align:left">${T.fechaCorta(r.dia)}</td><td>${esc(r.tipo)}</td><td>${esc(r.descripcion)}</td><td class="r">${fmt0.format(r.monto)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="vacio">Sin gastos menores en este período.</div>'}
    <div class="h3">Recomendaciones para adelante</div>
    <ol class="recs">${recs.map(t => `<li><span>${esc(t)}</span></li>`).join('')}</ol>
    <div class="pie">Las explicaciones salen de las piezas que nombra cada proforma o descripción del Excel de gastos y de cómo trabajan esas piezas en un vehículo de reparto. No reemplazan el diagnóstico del mecánico. No se usan los cambios de aceite para sacar conclusiones, porque puede haber registros que falten.</div>`;
}

cargar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOGO — Equipo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.topbar{background:#1A1A2E;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:52px}
.logo{color:#F5C400;font-weight:700;font-size:18px;letter-spacing:.5px}
.logo span{color:#fff;font-weight:400;font-size:13px;margin-left:8px;opacity:.7}
.notif-btn{background:#F5C400;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#1A1A2E;display:flex;align-items:center;gap:5px}
.notif-btn.active{background:#1D9E75;color:#fff}
.notif-btn.denied{background:#D85A30;color:#fff;cursor:default}
.container{max-width:820px;margin:0 auto;padding:1.5rem 1rem}
.tabs{display:flex;gap:2px;margin-bottom:1.25rem;background:#e8e8e2;padding:3px;border-radius:10px}
.tab{flex:1;padding:8px 0;font-size:13px;font-weight:500;color:#666;cursor:pointer;border:none;background:none;border-radius:8px;transition:all .15s}
.tab.active{background:#fff;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border-radius:12px;border:0.5px solid #e0ded8;padding:1.25rem;margin-bottom:1rem}
.section-title{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cal-nav button{background:#f5f5f0;border:0.5px solid #ddd;border-radius:8px;padding:6px 12px;cursor:pointer;color:#333;font-size:13px}
.cal-nav h2{font-size:15px;font-weight:600;color:#1a1a1a}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:1rem}
.dow{text-align:center;font-size:11px;font-weight:600;color:#888;padding:4px 0}
.day{min-height:58px;border-radius:8px;border:0.5px solid #eee;padding:4px;background:#fff;font-size:10px}
.day.other{opacity:.3}.day.today{border-color:#378ADD;background:#E6F1FB}
.day .dn{font-size:11px;font-weight:600;color:#555;margin-bottom:2px}
.day.today .dn{color:#185FA5}
.dot{border-radius:3px;padding:1px 4px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:9px}
.dot-vac{background:#E1F5EE;color:#085041}
.dot-sol{background:#E6F1FB;color:#0C447C}
.dot-otro{background:#FAEEDA;color:#633806}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem}
.leg{display:flex;align-items:center;gap:4px;font-size:12px;color:#666}
.leg-dot{width:10px;height:10px;border-radius:3px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:.75rem}
.form-group label{font-size:11px;font-weight:600;color:#888;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.form-group input,.form-group select{width:100%;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#378ADD}
.btn-primary{background:#1A1A2E;color:#F5C400;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-primary:hover{background:#2a2a4e}
.evt-list{display:flex;flex-direction:column;gap:6px}
.evt-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0.5px solid #eee;background:#fafaf7}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;white-space:nowrap}
.badge-vac{background:#E1F5EE;color:#085041}
.badge-sol{background:#E6F1FB;color:#0C447C}
.badge-otro{background:#FAEEDA;color:#633806}
.evt-info{flex:1}
.evt-title{font-size:13px;font-weight:500;color:#1a1a1a}
.evt-sub{font-size:11px;color:#888;margin-top:1px}
.del{background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;padding:2px 4px;line-height:1;border-radius:4px}
.del:hover{color:#D85A30;background:#fff0ee}
.quick-note-area{width:100%;border:none;background:none;resize:none;min-height:80px;font-size:14px;color:#1a1a1a;font-family:inherit;outline:none;line-height:1.6}
.note-footer{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:0.5px solid #eee;margin-top:8px;flex-wrap:wrap}
.note-footer input{padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:12px;color:#1a1a1a;background:#fff;outline:none;width:140px}
.pin-label{display:flex;align-items:center;gap:5px;font-size:12px;color:#666;cursor:pointer}
.note-card{padding:12px;border-radius:8px;border:0.5px solid #eee;background:#fafaf7;margin-bottom:6px}
.note-card.pinned{border-color:#EF9F27;background:#FAEEDA22}
.note-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.note-author{font-size:11px;font-weight:600;color:#888}
.pin-tag{font-size:10px;background:#FAEEDA;color:#633806;border-radius:4px;padding:1px 6px;font-weight:600;margin-left:6px}
.note-text{font-size:13px;color:#1a1a1a;line-height:1.55;white-space:pre-wrap}
.empty{text-align:center;padding:2rem;color:#aaa;font-size:13px}
.sync{font-size:11px;color:#888;text-align:right;margin-bottom:.75rem}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1A1A2E;color:#F5C400;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">TOGO <span>Equipo</span></div>
  <button class="notif-btn" id="notifBtn" onclick="toggleNotifications()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    Activar alertas
  </button>
</div>

<div class="container">
  <div class="sync" id="syncBar">Conectando...</div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('cal', this)">📅 Calendario</button>
    <button class="tab" onclick="switchTab('notas', this)">📝 Bloc de notas</button>
  </div>

  <div id="tab-cal" class="panel active">
    <div class="card">
      <div class="legend">
        <div class="leg"><div class="leg-dot" style="background:#1D9E75"></div>Vacaciones</div>
        <div class="leg"><div class="leg-dot" style="background:#378ADD"></div>Solicitud</div>
        <div class="leg"><div class="leg-dot" style="background:#EF9F27"></div>Otro</div>
      </div>
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">&#8592;</button>
        <h2 id="calTitle"></h2>
        <button onclick="changeMonth(1)">&#8594;</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="card">
      <p class="section-title">Agregar evento</p>
      <div class="form-grid">
        <div class="form-group">
          <label>Tipo</label>
          <select id="evtType">
            <option value="vac">Vacaciones</option>
            <option value="sol">Solicitud</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Persona / descripcion</label>
          <input type="text" id="evtTitle" placeholder="Ej: Juan - Vacaciones">
        </div>
        <div class="form-group">
          <label>Fecha inicio</label>
          <input type="date" id="evtStart">
        </div>
        <div class="form-group">
          <label>Fecha fin</label>
          <input type="date" id="evtEnd">
        </div>
      </div>
      <button class="btn-primary" onclick="addEvent()">+ Agregar evento</button>
    </div>

    <div class="evt-list" id="evtList"></div>
  </div>

  <div id="tab-notas" class="panel">
    <div class="card">
      <textarea class="quick-note-area" id="noteText" placeholder="Escribe aqui tu nota rapida..."></textarea>
      <div class="note-footer">
        <input type="text" id="noteAuthor" placeholder="Tu nombre">
        <label class="pin-label"><input type="checkbox" id="notePin"> Fijar</label>
        <button class="btn-primary" onclick="addNote()">Guardar nota</button>
      </div>
    </div>
    <div id="notesList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DOWS = ['Lu','Ma','Mi','Ju','Vi','Sa','Do'];
const TYPE_LABELS = { vac:'Vacaciones', sol:'Solicitud', otro:'Otro' };
let curYear, curMonth, events = [], notes = [], swReg = null, pushSub = null;

function showToast(msg, ms=3000){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms);
}

function syncBar(msg){ document.getElementById('syncBar').textContent = msg; }

function fmt(s){ const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }

function switchTab(name, btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

async function fetchData(){
  try {
    const [evRes, noRes] = await Promise.all([fetch(API+'/api/events'), fetch(API+'/api/notes')]);
    events = await evRes.json();
    notes = await noRes.json();
    renderCal(); renderNotes();
    syncBar('Actualizado ' + new Date().toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'}));
  } catch(e){ syncBar('Sin conexion al servidor'); }
}

function changeMonth(d){ curMonth+=d; if(curMonth>11){curMonth=0;curYear++;}else if(curMonth<0){curMonth=11;curYear--;} renderCal(); }

function renderCal(){
  document.getElementById('calTitle').textContent = MONTHS[curMonth] + ' ' + curYear;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  DOWS.forEach(d=>{ const c=document.createElement('div'); c.className='dow'; c.textContent=d; grid.appendChild(c); });
  let fd = new Date(curYear,curMonth,1).getDay(); if(fd===0)fd=7; fd--;
  const dim = new Date(curYear,curMonth+1,0).getDate();
  const prev = new Date(curYear,curMonth,0).getDate();
  const today = new Date();
  function evts(y,m,d){ const s=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; return events.filter(e=>e.start_date<=s&&e.end_date>=s); }
  for(let i=0;i<fd;i++){ const c=document.createElement('div'); c.className='day other'; c.innerHTML=`<div class="dn">${prev-fd+1+i}</div>`; grid.appendChild(c); }
  for(let d=1;d<=dim;d++){
    const c=document.createElement('div'); c.className='day';
    if(d===today.getDate()&&curMonth===today.getMonth()&&curYear===today.getFullYear()) c.classList.add('today');
    const ev=evts(curYear,curMonth,d);
    let h=`<div class="dn">${d}</div>`;
    ev.slice(0,2).forEach(e=>{ h+=`<span class="dot dot-${e.type}">${e.title}</span>`; });
    if(ev.length>2) h+=`<span class="dot" style="color:#aaa">+${ev.length-2}</span>`;
    c.innerHTML=h; grid.appendChild(c);
  }
  const rem=(fd+dim)%7; if(rem>0){for(let i=1;i<=7-rem;i++){const c=document.createElement('div');c.className='day other';c.innerHTML=`<div class="dn">${i}</div>`;grid.appendChild(c);}}
  renderEvtList();
}

function renderEvtList(){
  const el=document.getElementById('evtList');
  const sorted=[...events].sort((a,b)=>a.start_date.localeCompare(b.start_date));
  if(!sorted.length){ el.innerHTML='<div class="empty">Sin eventos. Agrega uno arriba.</div>'; return; }
  el.innerHTML=sorted.map(e=>`
    <div class="evt-row">
      <span class="badge badge-${e.type}">${TYPE_LABELS[e.type]||'Otro'}</span>
      <div class="evt-info">
        <div class="evt-title">${e.title}</div>
        <div class="evt-sub">${fmt(e.start_date)}${e.end_date!==e.start_date?' → '+fmt(e.end_date):''}</div>
      </div>
      <button class="del" onclick="delEvent(${e.id})">&#128465;</button>
    </div>`).join('');
}

async function addEvent(){
  const type=document.getElementById('evtType').value;
  const title=document.getElementById('evtTitle').value.trim();
  const start=document.getElementById('evtStart').value;
  const end=document.getElementById('evtEnd').value||start;
  if(!title||!start){ showToast('Completa nombre y fecha'); return; }
  await fetch(API+'/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,title,start_date:start,end_date:end})});
  document.getElementById('evtTitle').value='';
  document.getElementById('evtStart').value='';
  document.getElementById('evtEnd').value='';
  showToast('Evento agregado. Notificando al equipo...');
  fetchData();
}

async function delEvent(id){
  await fetch(API+'/api/events/'+id,{method:'DELETE'});
  fetchData();
}

function renderNotes(){
  const el=document.getElementById('notesList');
  if(!notes.length){ el.innerHTML='<div class="empty">Sin notas. Escribe la primera.</div>'; return; }
  el.innerHTML=notes.map(n=>`
    <div class="note-card${n.pinned?' pinned':''}">
      <div class="note-meta">
        <span class="note-author">${n.author||'Anonimo'} · ${n.created_at.substring(0,16)}${n.pinned?'<span class="pin-tag">Fijada</span>':''}</span>
        <button class="del" onclick="delNote(${n.id})">&#128465;</button>
      </div>
      <div class="note-text">${n.text.replace(/</g,'&lt;')}</div>
    </div>`).join('');
}

async function addNote(){
  const text=document.getElementById('noteText').value.trim();
  const author=document.getElementById('noteAuthor').value.trim();
  const pinned=document.getElementById('notePin').checked;
  if(!text){ showToast('Escribe algo antes de guardar'); return; }
  await fetch(API+'/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,author,pinned})});
  document.getElementById('noteText').value='';
  document.getElementById('notePin').checked=false;
  showToast('Nota guardada. Notificando al equipo...');
  fetchData();
}

async function delNote(id){
  await fetch(API+'/api/notes/'+id,{method:'DELETE'});
  fetchData();
}

// ── Web Push ──────────────────────────────────────────────────────────────────
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=window.atob(base64); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}

async function initSW(){
  if(!('serviceWorker' in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register('/sw.js');
    pushSub = await swReg.pushManager.getSubscription();
    updateNotifBtn();
    navigator.serviceWorker.addEventListener('message', e=>{
      if(e.data?.action==='switchTab'){
        const btn=document.querySelector(`.tab[onclick*="${e.data.tab}"]`);
        if(btn) btn.click();
      }
    });
  } catch(e){ console.error('SW error', e); }
}

function updateNotifBtn(){
  const btn=document.getElementById('notifBtn');
  const perm=Notification.permission;
  if(perm==='denied'){ btn.className='notif-btn denied'; btn.textContent='Alertas bloqueadas'; return; }
  if(pushSub){ btn.className='notif-btn active'; btn.textContent='Alertas activas'; }
  else { btn.className='notif-btn'; btn.textContent='Activar alertas'; }
}

async function toggleNotifications(){
  if(!swReg){ showToast('Navegador no compatible'); return; }
  if(Notification.permission==='denied'){ showToast('Desbloquealo en configuracion del navegador'); return; }
  if(pushSub){
    await pushSub.unsubscribe();
    await fetch(API+'/api/subscribe',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:pushSub.endpoint})});
    pushSub=null; updateNotifBtn(); showToast('Alertas desactivadas');
    return;
  }
  try {
    const keyRes=await fetch(API+'/api/vapid-public-key');
    const {key}=await keyRes.json();
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ showToast('Permiso denegado'); return; }
    pushSub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(key)});
    const name=prompt('¿Tu nombre? (para identificar quien activo las alertas)','') || 'Anonimo';
    await fetch(API+'/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:pushSub.toJSON(),userName:name})});
    updateNotifBtn(); showToast('Alertas activadas. Te avisaremos de cada novedad.');
  } catch(e){ showToast('Error al activar: '+e.message); }
}

// ── Init ──────────────────────────────────────────────────────────────────────
const now=new Date(); curYear=now.getFullYear(); curMonth=now.getMonth();
const td=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
document.getElementById('evtStart').value=td;
document.getElementById('evtEnd').value=td;
initSW();
fetchData();
setInterval(fetchData, 20000);

const params=new URLSearchParams(location.search);
if(params.get('tab')==='notas') document.querySelectorAll('.tab')[1].click();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOGO · Gastos de flota</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D;--bg2:#141414;--bg3:#1A1A1A;--bg4:#222;
  --border:#2A2A2A;--border2:#333;
  --amber:#F5A623;--amber2:#FFBE47;--amber-dim:#F5A6231a;
  --text:#E8E8E8;--text2:#999;--text3:#666;
  --red:#FF4444;--red-dim:#FF444420;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  /* series: validadas para fondo oscuro y daltonismo */
  --c-comb:#c98500;--c-mant:#3987e5;--c-otros:#d55181;--c-prev:#8a8a8a;--c-rank:#555;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
button,select,input{font-family:inherit;}

/* HEADER */
.header{display:flex;align-items:center;gap:16px;padding:0 24px;height:52px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{background:var(--amber);color:#000;font-weight:700;font-size:13px;padding:4px 10px;border-radius:4px;letter-spacing:1px;font-family:var(--mono);text-decoration:none;}
.header-title{font-size:13px;color:var(--text2);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;}
.header-sep{flex:1;}
.last-update{font-size:11px;color:var(--text3);font-family:var(--mono);text-align:right;}
.last-update span{color:var(--amber);}
.hdr-user{font-size:11px;color:var(--text2);font-family:var(--mono);}
.hdr-btn{padding:5px 12px;font-size:10px;}
.btn-danger:hover{border-color:var(--red);color:var(--red);}

/* TOOLBAR / FILTROS */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg2);}
.f-label{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.8px;}
.f-group{display:flex;align-items:center;gap:6px;}
.sel{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:4px;padding:6px 10px;font-size:12px;font-family:var(--mono);cursor:pointer;}
.sel:focus{outline:1px solid var(--amber);}
.btn{padding:6px 14px;font-size:11px;font-family:var(--mono);font-weight:500;border:1px solid var(--border2);background:transparent;color:var(--text2);border-radius:4px;cursor:pointer;transition:all .15s;letter-spacing:.5px;text-transform:uppercase;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn:disabled:hover{border-color:var(--border2);color:var(--text2);}
.btn-primary{background:var(--amber);color:#000;border:none;font-weight:600;}
.btn-primary:hover{background:var(--amber2);color:#000;}
.toolbar-sep{flex:1;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px;background:var(--amber-dim);border:1px solid var(--amber);color:var(--amber);font-size:11px;font-family:var(--mono);cursor:pointer;}
.chip:hover{background:#F5A62333;}

/* AVISOS */
.notes{padding:0 24px;display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.note{font-size:12px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--text3);border-radius:4px;padding:10px 14px;line-height:1.5;}
.note b{color:var(--text);font-weight:600;}
.link{color:var(--amber);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:12px;}

/* TARJETAS */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);margin:16px 24px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.card{background:var(--bg2);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;animation:fadeUp .4s ease both;transition:background .15s;}
.card:hover{background:var(--bg3);}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}
.card-label{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex-shrink:0;}
.card-val{font-size:22px;font-weight:700;font-family:var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-sub{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-sub em{color:var(--text2);font-style:normal;font-family:var(--mono);}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* PANELES */
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin:16px 24px;align-items:start;}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:18px;min-width:0;animation:fadeUp .4s ease both;}
.panel.full{grid-column:1/-1;}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.panel-title{font-size:12px;font-family:var(--mono);color:var(--text);letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.panel-hint{font-size:11px;color:var(--text3);}
.chart-box{position:relative;height:300px;}
.dona-wrap{display:flex;flex-direction:column;gap:14px;}
.dona-box{position:relative;height:220px;}
.dona-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.dona-center b{font-family:var(--mono);font-size:16px;}
.dona-center span{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.8px;}
.leg{width:100%;border-collapse:collapse;font-size:12px;}
.leg td{padding:4px 4px;border-bottom:1px solid var(--border);}
.leg tr{cursor:pointer;transition:background .15s;}
.leg tr:hover{background:var(--bg3);}
.leg tr.sel td{color:var(--amber);}
.leg .sw{width:10px;height:10px;border-radius:2px;display:inline-block;vertical-align:middle;}
.leg .n{font-family:var(--mono);font-size:11px;}
.leg .v,.leg .p{text-align:right;font-family:var(--mono);white-space:nowrap;}
.leg .p{color:var(--text3);width:44px;}
.rank .pct{text-align:right;font-family:var(--mono);color:var(--text3);width:48px;}

/* RANKING */
.rank{width:100%;border-collapse:collapse;font-size:12px;}
.rank td{padding:5px 6px;border-bottom:1px solid var(--border);}
.rank tr{cursor:pointer;transition:background .15s;}
.rank tr:hover{background:var(--bg3);}
.rank tr.sel td{color:var(--amber);}
.rank .pos{color:var(--text3);font-family:var(--mono);width:24px;}
.rank .placa{font-family:var(--mono);white-space:nowrap;}
.rank .px{font-size:10px;color:var(--text3);font-family:var(--mono);}
.rank .barcell{width:45%;}
.rank .bar{height:10px;border-radius:0 4px 4px 0;background:var(--c-rank);transition:width .4s ease;}
.rank tr.sel .bar{background:var(--amber);}
.rank .amt{text-align:right;font-family:var(--mono);white-space:nowrap;}

/* TABLA */
.search{flex:1;min-width:180px;max-width:320px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:4px;padding:6px 10px;font-size:12px;}
.search:focus{outline:1px solid var(--amber);}
.table-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;font-size:10px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:8px 8px;border-bottom:1px solid var(--border2);cursor:pointer;white-space:nowrap;user-select:none;}
.tbl th:hover{color:var(--amber);}
.tbl th.sorted{color:var(--amber);}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top;}
.tbl td.m{font-family:var(--mono);white-space:nowrap;}
.tbl td.r,.tbl th.r{text-align:right;}
.tbl td.desc{color:var(--text);min-width:220px;}
.tbl tr:hover td{background:var(--bg3);}
.more{display:flex;justify-content:center;gap:12px;align-items:center;margin-top:12px;font-size:11px;color:var(--text3);font-family:var(--mono);}

/* MODAL CARGA */
.modal-bg{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto;animation:fadeUp .25s ease both;}
.modal h3{font-size:13px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12px;margin-bottom:14px;}
.kv dt{color:var(--text3);}
.kv dd{color:var(--text);font-family:var(--mono);}
.modal .msg{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px;}
.modal .err{color:var(--red);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

.empty{padding:60px 24px;text-align:center;color:var(--text3);font-size:13px;line-height:1.7;}
.loading{padding:80px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:12px;}

@media(max-width:1100px){
  .cards{grid-template-columns:repeat(6,1fr);}
  .card{grid-column:span 2;}
  .card:nth-child(n+4){grid-column:span 3;}
}
@media(max-width:768px){
  .header,.toolbar{padding-left:16px;padding-right:16px;}
  .grid{grid-template-columns:1fr;margin:16px;}
  .cards{grid-template-columns:repeat(2,1fr);margin:16px 16px 0;}
  .card,.card:nth-child(n+4){grid-column:span 1;}
  .card:first-child{grid-column:span 2;}
  .notes{padding:0 16px;}
  .header-title{display:none;}
  .chart-box{height:240px;}
}
@media(max-width:600px){
  .header{gap:8px;}
  .hdr-user,.last-update{display:none;}
}
@media(max-width:480px){
  .card-val{font-size:18px;}
  .toolbar{gap:8px;}
  .rank .px{display:none;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="header">
  <span class="logo">TOGO</span>
  <span class="header-title">Gastos de flota</span>
  <span class="header-sep"></span>
  <span class="last-update" id="meta"></span>
  <span class="hdr-user" id="hdrUser"></span>
  <button class="btn hdr-btn" id="usersBtn" style="display:none">Usuarios</button>
  <button class="btn hdr-btn btn-danger" id="logoutBtn">Salir</button>
</div>

<div class="toolbar" id="toolbar" style="display:none">
  <div class="f-group" id="fVista">
    <span class="f-label">Vista</span>
    <button class="btn active" data-v="TOTAL">Total</button>
    <button class="btn" data-v="FLOTA" id="vFlota">Flota actual</button>
  </div>
  <div class="f-group"><span class="f-label">Año</span><select class="sel" id="fAnio"></select></div>
  <div class="f-group"><span class="f-label">Mes</span><select class="sel" id="fMes"></select></div>
  <div class="f-group"><span class="f-label">Placa</span><select class="sel" id="fPlaca"></select></div>
  <div class="f-group"><span class="f-label">Tipo</span><select class="sel" id="fTipo"></select></div>
  <div class="f-group" id="fProxi">
    <button class="btn active" data-p="TODOS">Todos</button>
    <button class="btn" data-p="ISUTO">Isuto</button>
    <button class="btn" data-p="ESCUADRON">Escuadrón</button>
  </div>
  <span id="chips"></span>
  <span class="toolbar-sep"></span>
  <button class="btn btn-primary" id="uploadBtn" style="display:none">Subir Excel / CSV</button>
  <input type="file" id="fileIn" accept=".xlsx,.xlsm,.csv" hidden>
</div>

<div id="app"><div class="loading">Cargando gastos…</div></div>

<div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>

<script>
const API = '';
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const GRUPOS = { 'Combustible': ['GASOLINA','GNV'], 'Mantenimiento': ['PREVENTIVO','CORRECTIVO','REPUESTOS'] };
const COLOR = { 'Combustible':'#c98500', 'Mantenimiento':'#3987e5', 'Otros':'#d55181', prev:'#8a8a8a' };
// Cada tipo usa el color de su grupo en otro tono (7 colores distintos no se distinguen bien)
const COLOR_TIPO = { GASOLINA:'#c98500', GNV:'#e9b54a', CORRECTIVO:'#3987e5', REPUESTOS:'#7db3f2', PREVENTIVO:'#245ea8',
                     'OTROS GASTOS':'#d55181', 'SIN CLASIFICAR':'#8a8a8a' };
const colorTipo = t => COLOR_TIPO[t] || COLOR[grupo(t)];
const SURFACE = '#141414';
const PROXIS = ['ISUTO','ESCUADRON'];

const fmt0 = new Intl.NumberFormat('es-BO', { maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const bs = v => 'Bs ' + fmt0.format(v);
const fmt1 = new Intl.NumberFormat('es-BO', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = (a, b) => b ? fmt1.format(a / b * 100) + '%' : '–';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grupo = tipo => GRUPOS.Combustible.includes(tipo) ? 'Combustible' : GRUPOS.Mantenimiento.includes(tipo) ? 'Mantenimiento' : 'Otros';

let ROWS = [], META = {};
// Flota actual: placas que están trabajando, del Excel VEHICULOS PROXI
let FLOTA = {}, FLOTA_SET = new Set();
const F = { vista: 'TOTAL', anio: null, mes: 0, proxi: 'TODOS', placa: '', tipo: '' };
const T = { q: '', sort: 'fecha', dir: -1, shown: 100 };
let rankAll = false;
let chMes = null, chTipo = null, chDona = null;

// ── AUTH ─────────────────────────────────────────────────────────────────────
const token = () => localStorage.getItem('togo_token');
const isAdmin = () => localStorage.getItem('togo_role') === 'admin';
function goLogin() {
  ['togo_token','togo_user','togo_role'].forEach(k => localStorage.removeItem(k));
  location.href = '/login.html';
}
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-auth-token': token(), ...(opts.headers || {}) } });
  if (r.status === 401) { goLogin(); throw new Error('No autenticado'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Error ' + r.status);
  return data;
}

// ── CARGA DE DATOS ───────────────────────────────────────────────────────────
async function load() {
  if (!token()) return goLogin();
  try {
    const d = await api('/api/gastos');
    ROWS = d.rows; META = d.meta || {};
    FLOTA = d.flota || {};
    FLOTA_SET = new Set((FLOTA.placas || []).map(p => p.placa));
    if (!FLOTA_SET.size) F.vista = 'TOTAL';
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty">No se pudieron cargar los gastos.<br>${esc(e.message)}</div>`;
    return;
  }
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('uploadBtn').style.display = isAdmin() ? '' : 'none';
  document.getElementById('usersBtn').style.display = isAdmin() ? '' : 'none';
  document.getElementById('hdrUser').textContent = localStorage.getItem('togo_user') || '';
  renderMeta();
  if (!ROWS.length) {
    document.getElementById('app').innerHTML = `<div class="empty">Todavía no hay gastos cargados.<br>${isAdmin() ? 'Usa <b>Subir Excel / CSV</b> con la hoja Detalle del DASHBOARD GASTOS TOGO.' : 'Pide a un administrador que suba el Excel de gastos.'}</div>`;
    return;
  }
  setupFilters();
  buildLayout();
  render();
}

function renderMeta() {
  if (!META.fecha) { document.getElementById('meta').innerHTML = ''; return; }
  const d = new Date(META.fecha);
  document.getElementById('meta').innerHTML =
    `Actualizado <span>${d.toLocaleDateString('es-BO')} ${d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'})}</span> · ${fmt0.format(META.filas)} filas`;
  document.getElementById('meta').title = `${META.archivo || ''} · cargado por ${META.por || ''}`;
}

// ── FILTROS ──────────────────────────────────────────────────────────────────
function setupFilters() {
  const anios = [...new Set(ROWS.map(r => r.anio))].sort((a, b) => b - a);
  if (!anios.includes(F.anio)) F.anio = anios.includes(2026) ? 2026 : anios[0];
  const sA = document.getElementById('fAnio');
  sA.innerHTML = anios.map(a => `<option value="${a}">${a}</option>`).join('');
  sA.value = F.anio;
  sA.onchange = () => { F.anio = +sA.value; render(); };
  const sM = document.getElementById('fMes');
  sM.innerHTML = '<option value="0">Todos</option>' + MESES_FULL.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
  sM.value = F.mes;
  sM.onchange = () => { F.mes = +sM.value; render(); };
  const sP = document.getElementById('fPlaca');
  sP.onchange = () => { F.placa = sP.value; render(); };
  const sT = document.getElementById('fTipo');
  sT.innerHTML = opciones([...new Set(ROWS.map(r => r.tipo))].sort(), 'Todos');
  sT.onchange = () => { F.tipo = sT.value; render(); };
  document.querySelectorAll('#fProxi .btn').forEach(b => b.onclick = () => { F.proxi = b.dataset.p; render(); });
  const vF = document.getElementById('vFlota');
  vF.disabled = !FLOTA_SET.size;
  vF.textContent = FLOTA_SET.size ? `Flota actual (${FLOTA_SET.size})` : 'Flota actual';
  vF.title = FLOTA_SET.size ? '' : 'Sube el Excel VEHICULOS PROXI para activar esta vista';
  document.querySelectorAll('#fVista .btn').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    F.vista = b.dataset.v;
    if (F.vista === 'FLOTA' && F.placa && !FLOTA_SET.has(F.placa)) F.placa = '';
    render();
  });
}
const opciones = (vals, todos) => `<option value="">${todos}</option>` + vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');

// En la vista Flota actual solo cuentan las placas de la flota, también en el año anterior,
// así la comparación es con los mismos vehículos.
function match(r, { anio = F.anio, mes = F.mes, proxi = F.proxi, placa = F.placa, tipo = F.tipo } = {}) {
  return (F.vista !== 'FLOTA' || FLOTA_SET.has(r.placa)) &&
         (anio == null || r.anio === anio) && (!mes || r.mes === mes) &&
         (proxi === 'TODOS' || r.proxi === proxi) && (!placa || r.placa === placa) && (!tipo || r.tipo === tipo);
}

function renderChips() {
  const c = [];
  if (F.mes) c.push(`<span class="chip" data-k="mes">${MESES_FULL[F.mes - 1]} ✕</span>`);
  if (F.placa) c.push(`<span class="chip" data-k="placa">Placa ${esc(F.placa)} ✕</span>`);
  if (F.tipo) c.push(`<span class="chip" data-k="tipo">${esc(F.tipo)} ✕</span>`);
  const el = document.getElementById('chips');
  el.innerHTML = c.join(' ');
  el.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { F[ch.dataset.k] = ch.dataset.k === 'mes' ? 0 : ''; render(); });
  document.getElementById('fAnio').value = F.anio;
  document.getElementById('fMes').value = F.mes;
  const placas = F.vista === 'FLOTA' ? [...FLOTA_SET] : ROWS.map(r => r.placa);
  document.getElementById('fPlaca').innerHTML = opciones([...new Set(placas)].sort(), 'Todas');
  document.getElementById('fPlaca').value = F.placa;
  document.querySelectorAll('#fVista .btn').forEach(b => b.classList.toggle('active', b.dataset.v === F.vista));
  document.getElementById('fTipo').value = F.tipo;
  document.querySelectorAll('#fProxi .btn').forEach(b => b.classList.toggle('active', b.dataset.p === F.proxi));
}

// ── LAYOUT ───────────────────────────────────────────────────────────────────
function buildLayout() {
  [chMes, chTipo, chDona].forEach(c => c && c.destroy());
  document.getElementById('app').innerHTML = `
  <div class="notes" id="notes"></div>
  <div class="cards" id="cards"></div>
  <div class="grid">
    <div class="panel full">
      <div class="panel-head"><span class="panel-title">Gasto mensual</span><span class="panel-hint" id="mesHint">Clic en un mes para filtrarlo</span></div>
      <div class="chart-box"><canvas id="cMes"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Gastos por tipo</span><span class="panel-hint">Clic en un tipo para filtrar</span></div>
      <div class="chart-box" id="tipoBox"><canvas id="cTipo"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Distribución del gasto</span></div>
      <div class="dona-wrap">
        <div class="dona-box"><canvas id="cDona"></canvas><div class="dona-center"><b id="donaTot"></b><span>total</span></div></div>
        <table class="leg" id="donaLeg"></table>
      </div>
    </div>
    <div class="panel full">
      <div class="panel-head"><span class="panel-title">Gasto por vehículo</span><span class="panel-hint" id="rankHint">Clic en una placa para filtrar</span></div>
      <div id="rank"></div>
    </div>
    <div class="panel full">
      <div class="panel-head">
        <span class="panel-title">Registros</span>
        <span class="panel-hint" id="tCount"></span>
        <span class="toolbar-sep"></span>
        <input class="search" id="q" placeholder="Buscar placa, descripción, factura, OT…" value="${esc(T.q)}">
      </div>
      <div class="table-wrap"><table class="tbl" id="tbl"></table></div>
      <div class="more" id="more"></div>
    </div>
  </div>`;
  document.getElementById('q').oninput = e => { T.q = e.target.value; T.shown = 100; renderTable(); };

  Chart.defaults.color = '#999';
  Chart.defaults.font.family = "'Inter',sans-serif";
  Chart.defaults.borderColor = '#2A2A2A';
  const tooltip = {
    backgroundColor: '#1A1A1A', borderColor: '#333', borderWidth: 1, padding: 10,
    titleFont: { family: "'JetBrains Mono',monospace", size: 11 }, bodyFont: { size: 12 },
    callbacks: { label: c => ` ${c.dataset.label || c.label}: Bs ${fmt2.format(c.parsed[c.chart.options.indexAxis === 'y' ? 'x' : 'y'])}` }
  };
  const moneyTick = v => v >= 1000 ? fmt0.format(v / 1000) + 'k' : fmt0.format(v);

  chMes = new Chart(document.getElementById('cMes'), {
    type: 'bar',
    data: { labels: MESES, datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      animation: { duration: 500 },
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, ticks: { callback: moneyTick }, grid: { color: '#222' } }
      },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 8, boxHeight: 8, padding: 14,
          generateLabels: c => Chart.defaults.plugins.legend.labels.generateLabels(c).map(l => ({ ...l, fillStyle: COLOR[l.text] || COLOR.prev, strokeStyle: COLOR[l.text] || COLOR.prev })) } },
        tooltip: { ...tooltip, callbacks: { ...tooltip.callbacks,
          footer: items => { const t = items.filter(i => i.dataset.stack === 'a').reduce((s, i) => s + i.parsed.y, 0); return 'Total: Bs ' + fmt2.format(t); } } }
      },
      onClick: (e, els, chart) => {
        const pts = chart.getElementsAtEventForMode(e, 'index', { intersect: false }, false);
        if (!pts.length) return;
        const m = pts[0].index + 1;
        F.mes = F.mes === m ? 0 : m; render();
      },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
    }
  });

  chTipo = new Chart(document.getElementById('cTipo'), {
    type: 'bar',

      indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: { duration: 500 },

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  renderChips();
  renderNotes();
  renderCards();
  renderMes();
  renderTipo();
  renderDona();
  renderRank();
  renderTable();
}

function renderNotes() {
  const notes = [];
  if (F.anio === 2026)
    notes.push(`<div class="note">Los datos de <b>2026</b> pueden estar incompletos en correctivo, repuestos y otros gastos, y en enero–abril. Una baja contra 2025 no siempre es una baja real.</div>`);
  if (F.vista === 'FLOTA') {
    const f = FLOTA.fecha ? new Date(FLOTA.fecha).toLocaleDateString('es-BO') : '';
    notes.push(`<div class="note">Vista <b>Flota actual</b>: solo las <b>${FLOTA_SET.size} placas</b> que están trabajando
      (${esc(FLOTA.archivo || 'VEHICULOS PROXI')}${f ? ', cargado el ' + f : ''}). La comparación con ${F.anio - 1} usa las mismas placas.</div>`);
  }
  document.getElementById('notes').innerHTML = notes.join('');
}

function animateValue(el, to, fmtFn) {
  const from = +el.dataset.v || 0; el.dataset.v = to;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmtFn(to); return; }
  const t0 = performance.now(), d = 450;
  const step = t => { const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtFn(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function renderCards() {
  const rows = ROWS.filter(r => match(r));
  const tot = rows.reduce((s, r) => s + r.monto, 0);
  const by = { Combustible: 0, Mantenimiento: 0, Otros: 0 };
  const porPlaca = {};
  rows.forEach(r => { by[grupo(r.tipo)] += r.monto; if (r.placa !== 'SIN PLACA') porPlaca[r.placa] = (porPlaca[r.placa] || 0) + r.monto; });
  const placas = Object.entries(porPlaca).sort((a, b) => b[1] - a[1]);
  const conPlaca = placas.reduce((s, p) => s + p[1], 0);
  const prom = placas.length ? conPlaca / placas.length : 0;
  const top = placas[0];

  const el = document.getElementById('cards');
  if (!el.children.length) el.innerHTML = Array.from({ length: 5 }, () => '<div class="card"><div class="card-label"></div><div class="card-val"></div><div class="card-sub"></div></div>').join('');
  const set = (i, label, val, fmtFn, sub, isText) => {
    const c = el.children[i];
    c.children[0].innerHTML = label;
    if (isText) { c.children[1].textContent = val; c.children[1].dataset.v = 0; } else animateValue(c.children[1], val, fmtFn);
    c.children[2].innerHTML = sub;
  };
  set(0, 'Gasto total', tot, bs, `<em>${fmt0.format(rows.length)}</em> registros`);
  set(1, `<span class="dot" style="background:${COLOR.Combustible}"></span>Combustible`, by.Combustible, bs, `<em>${pct(by.Combustible, tot)}</em> del total · gasolina + GNV`);
  set(2, `<span class="dot" style="background:${COLOR.Mantenimiento}"></span>Mantenimiento y repuestos`, by.Mantenimiento, bs, `<em>${pct(by.Mantenimiento, tot)}</em> del total`);
  set(3, 'Vehículo que más gasta', top ? top[0] : '—', null, top ? `<em>${bs(top[1])}</em> · ${pct(top[1], tot)} del total` : 'sin datos', true);
  set(4, 'Promedio por vehículo', prom, bs, `<em>${placas.length}</em> vehículos con placa`);
}

function renderMes() {
  const sum = (anio, filtro) => {
    const s = { Combustible: Array(12).fill(0), Mantenimiento: Array(12).fill(0), Otros: Array(12).fill(0), total: Array(12).fill(0) };
    ROWS.forEach(r => { if (match(r, { anio, mes: 0 }) && (!filtro || filtro(r))) { s[grupo(r.tipo)][r.mes - 1] += r.monto; s.total[r.mes - 1] += r.monto; } });
    return s;
  };
  const cur = sum(F.anio);
  const prevHas = ROWS.some(r => r.anio === F.anio - 1);
  const prev = prevHas ? sum(F.anio - 1) : null;
  const alpha = (hex, i) => !F.mes || F.mes === i + 1 ? hex : hex + '40';
  const ds = ['Combustible', 'Mantenimiento', 'Otros'].map(g => ({
    type: 'bar', label: g, stack: 'a', data: cur[g],
    backgroundColor: cur[g].map((_, i) => alpha(COLOR[g], i)),
    borderColor: SURFACE, borderWidth: { top: 2 }, borderRadius: g === 'Otros' ? { topLeft: 4, topRight: 4 } : 0, borderSkipped: false,
    maxBarThickness: 44
  }));
  if (prev) ds.push({ type: 'line', label: `Total ${F.anio - 1}`, stack: 'prev', data: prev.total,
    borderColor: COLOR.prev, backgroundColor: COLOR.prev, borderWidth: 2, borderDash: [5, 4],
    pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: COLOR.prev, pointBorderColor: SURFACE, pointBorderWidth: 2, cubicInterpolationMode: 'monotone', order: -1 });
  chMes.data.datasets = ds;
  chMes.update();
  document.getElementById('mesHint').textContent = F.mes ? `Mostrando ${MESES_FULL[F.mes - 1]} · clic de nuevo para quitar` : 'Clic en un mes para filtrarlo';
}

// Los gráficos por tipo ignoran el filtro de tipo para que se vea el resto resaltado
function porTipo() {
  const by = {};
  ROWS.forEach(r => { if (match(r, { tipo: '' })) by[r.tipo] = (by[r.tipo] || 0) + r.monto; });
  return Object.entries(by).sort((a, b) => b[1] - a[1]);
}
const dim = (hex, t) => !F.tipo || F.tipo === t ? hex : hex + '40';

function renderDona() {
  const arr = porTipo();
  const tot = arr.reduce((s, a) => s + a[1], 0);
  chDona.data.labels = arr.map(a => a[0]);
  chDona.data.datasets[0].data = arr.map(a => a[1]);
  chDona.data.datasets[0].backgroundColor = arr.map(a => dim(colorTipo(a[0]), a[0]));
  chDona.update();
  document.getElementById('donaTot').textContent = bs(tot);
  const leg = document.getElementById('donaLeg');
  leg.innerHTML = arr.map(([t, v]) => `<tr data-t="${esc(t)}" class="${F.tipo === t ? 'sel' : ''}">
    <td><span class="sw" style="background:${colorTipo(t)}"></span></td><td class="n">${esc(t)}</td>
    <td class="v">${bs(v)}</td><td class="p">${pct(v, tot)}</td></tr>`).join('');
  leg.querySelectorAll('tr').forEach(tr => tr.onclick = () => { F.tipo = F.tipo === tr.dataset.t ? '' : tr.dataset.t; render(); });
}

function renderTipo() {
  const arr = porTipo();
  chTipo.data.labels = arr.map(a => a[0]);
  chTipo.data.datasets[0].data = arr.map(a => a[1]);
  chTipo.data.datasets[0].backgroundColor = arr.map(a => dim(colorTipo(a[0]), a[0]));

}

function renderRank() {
  const by = {}, px = {};
  ROWS.forEach(r => { if (match(r, { placa: '' })) { by[r.placa] = (by[r.placa] || 0) + r.monto; px[r.placa] = r.proxi; } });
  const arr = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const max = arr.length ? arr[0][1] : 1;
  const tot = arr.reduce((s, a) => s + a[1], 0);
  const conPlaca = arr.filter(a => a[0] !== 'SIN PLACA');
  document.getElementById('rankHint').textContent =
    `${conPlaca.length} vehículos · promedio ${bs(conPlaca.length ? conPlaca.reduce((s, a) => s + a[1], 0) / conPlaca.length : 0)} · clic en una placa para filtrar`;
  const list = rankAll ? arr : arr.slice(0, 12);
  const el = document.getElementById('rank');
  if (!arr.length) { el.innerHTML = '<div class="panel-hint">Sin gastos con estos filtros.</div>'; return; }
  el.innerHTML = `<table class="rank">${list.map(([p, v], i) => `
    <tr data-p="${esc(p)}" class="${F.placa === p ? 'sel' : ''}">
      <td class="pos">${i + 1}</td>
      <td class="placa">${esc(p)}<div class="px">${esc(px[p] || '')}</div></td>
      <td class="barcell"><div class="bar" style="width:${Math.max(1, v / max * 100)}%"></div></td>
      <td class="amt">${bs(v)}</td>
      <td class="pct">${pct(v, tot)}</td>
    </tr>`).join('')}</table>` +
    (arr.length > 12 ? `<div class="more"><button class="link" id="rankMore">${rankAll ? 'Ver solo top 12' : `Ver los ${arr.length} vehículos`}</button></div>` : '');
  el.querySelectorAll('tr').forEach(tr => tr.onclick = () => { F.placa = F.placa === tr.dataset.p ? '' : tr.dataset.p; render(); });
  const mb = document.getElementById('rankMore');
  if (mb) mb.onclick = () => { rankAll = !rankAll; renderRank(); };
}

const COLS = [
  ['fecha', 'Fecha', 'm'], ['placa', 'Placa', 'm'], ['proxi', 'Proxy', 'm'], ['tipo', 'Tipo', ''],
  ['descripcion', 'Descripción', 'desc'], ['ot', 'OT', 'm'], ['doc', 'Fact./Recibo', 'm'], ['monto', 'Monto (Bs)', 'm r']
];
function renderTable() {
  const q = T.q.trim().toUpperCase();
  let rows = ROWS.filter(r => match(r));
  if (q) rows = rows.filter(r => (r.placa + ' ' + r.descripcion + ' ' + r.doc + ' ' + r.ot + ' ' + r.tipo + ' ' + r.proxi).toUpperCase().includes(q));
  const k = T.sort, d = T.dir;
  rows.sort((a, b) => (typeof a[k] === 'number' ? a[k] - b[k] : String(a[k]).localeCompare(String(b[k]), 'es')) * d || (a.id - b.id) * d);
  const tot = rows.reduce((s, r) => s + r.monto, 0);
  document.getElementById('tCount').textContent = `${fmt0.format(rows.length)} registros · ${bs(tot)}`;
  const head = '<tr>' + COLS.map(([key, lbl, cls]) =>
    `<th data-k="${key}" class="${cls.includes('r') ? 'r ' : ''}${T.sort === key ? 'sorted' : ''}">${lbl}${T.sort === key ? (T.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr>';
  const body = rows.slice(0, T.shown).map(r => '<tr>' + COLS.map(([key, , cls]) =>
    `<td class="${cls}">${key === 'monto' ? fmt2.format(r.monto) : esc(r[key])}</td>`).join('') + '</tr>').join('');
  const tbl = document.getElementById('tbl');
  tbl.innerHTML = head + (body || `<tr><td colspan="${COLS.length}" class="panel-hint">Sin registros con estos filtros.</td></tr>`);
  tbl.querySelectorAll('th').forEach(th => th.onclick = () => {
    T.dir = T.sort === th.dataset.k ? -T.dir : (th.dataset.k === 'fecha' || th.dataset.k === 'monto' ? -1 : 1);
    T.sort = th.dataset.k; renderTable();
  });
  const more = document.getElementById('more');
  more.innerHTML = rows.length > T.shown
    ? `Mostrando ${fmt0.format(T.shown)} de ${fmt0.format(rows.length)} <button class="btn" id="moreBtn">Mostrar más</button>` : '';
  const mb = document.getElementById('moreBtn');
  if (mb) mb.onclick = () => { T.shown += 200; renderTable(); };
}

// ── SUBIR EXCEL / CSV (solo admin) ───────────────────────────────────────────
// Lee una copia del archivo en el navegador; el Excel original no se modifica.
const HEADERS = {
  fecha: ['FECHA', 'FECHADELGASTO'], proxi: ['PROXI', 'PROXY'], placa: ['PLACA'],
  tipo: ['TIPO', 'TIPOGASTO', 'TIPODEGASTO'], descripcion: ['DESCRIPCION'], ot: ['OT', 'OTOS'],
  doc: ['DOC', 'FACTRECIBO', 'FACTURA', 'RECIBO'], monto: ['MONTO', 'MONTOGASTADO']
};
const normH = h => String(h ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');

function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); });
}

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.slice(0, text.indexOf('\n') + 1 || text.length);
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); out.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); out.push(row); }
  return out;
}

const ymd = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
function parseFecha(v) {
  if (v instanceof Date && !isNaN(v)) return ymd(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number' && v > 20000 && v < 80000) {   // número de serie de Excel
    const d = new Date(Math.round((v - 25569) * 864e5));
    return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return ymd(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) return ymd(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  return null;
}
// Montos de texto: si hay coma, la coma es decimal y el punto es de miles
// ("1.234,50"); si no hay coma, el punto es decimal ("32.95").
function parseMonto(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? Math.round(v * 100) / 100 : null;
  let s = String(v ?? '').replace(/bs\.?/i, '').replace(/\s/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : null;
}
const valido = (f) => { if (!f) return false; const [y, m, d] = f.split('-').map(Number); return y > 2000 && m >= 1 && m <= 12 && d >= 1 && d <= 31; };

function limpiar(table) {
  let hi = -1, idx = {};
  for (let i = 0; i < Math.min(15, table.length); i++) {
    const hs = table[i].map(normH);
    const found = {};
    for (const [k, alias] of Object.entries(HEADERS)) { const j = hs.findIndex(h => alias.includes(h)); if (j >= 0) found[k] = j; }
    if (found.fecha != null && found.monto != null) { hi = i; idx = found; break; }
  }
  if (hi < 0) throw new Error('No encontré las columnas de fecha y monto. ¿Es la hoja Detalle del Excel de gastos?');
  const faltan = Object.keys(HEADERS).filter(k => idx[k] == null);
  const rows = [], malas = [];
  table.slice(hi + 1).forEach((raw, i) => {
    const get = k => idx[k] == null ? '' : raw[idx[k]];
    const fRaw = get('fecha'), mRaw = get('monto');
    if (String(fRaw ?? '').trim() === '' && String(mRaw ?? '').trim() === '') return;   // fila vacía
    const fecha = parseFecha(fRaw), monto = parseMonto(mRaw);
    if (!valido(fecha) || monto == null) { malas.push({ fila: hi + i + 2, fecha: fRaw, monto: mRaw }); return; }
    const pl = String(get('placa') ?? '').toUpperCase().replace(/[\s-]/g, '');
    const placa = !pl || pl === 'SINPLACA' ? 'SIN PLACA' : pl;
    const p = String(get('proxi') ?? '').trim().toUpperCase();
    const tipo = String(get('tipo') ?? '').trim().toUpperCase() || 'SIN CLASIFICAR';
    const txt = k => String(get(k) ?? '').trim();
    rows.push({ fecha, monto, placa, proxi: PROXIS.includes(p) ? p : 'SIN PROXY', tipo,
                descripcion: txt('descripcion'), ot: txt('ot'), doc: txt('doc') });
  });
  return { rows, malas, faltan };
}

function modal(html) { document.getElementById('modalBody').innerHTML = html; document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

document.getElementById('uploadBtn').onclick = () => document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  modal(`<h3>Leyendo archivo…</h3><div class="msg">${esc(file.name)}</div>`);
  try {
    let table, hoja = '', wb = null;
    if (/\.csv$/i.test(file.name)) {
      table = parseCSV(await file.text());
    } else {
      if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      hoja = wb.SheetNames.includes('Detalle') ? 'Detalle' : wb.SheetNames[0];
      table = XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header: 1, raw: true, defval: '' });
    }
    // Excel de gastos (hoja Detalle) o, si no tiene fecha y monto, la lista de vehículos (flota actual)
    let gastos = null;
    try { gastos = limpiar(table); } catch (errGastos) {
      const tablas = wb ? wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' })) : [table];
      const placas = leerFlota(tablas);
      if (!placas.length) throw new Error('No reconocí el archivo: no es la hoja Detalle de gastos ni una lista de vehículos con columna PLACA.');
      return previewFlota(file.name, placas);
    }
    const { rows, malas, faltan } = gastos;
    if (!rows.length) throw new Error('El archivo no tiene filas de gastos válidas.');
    previewUpload(file.name + (hoja ? ` · hoja ${hoja}` : ''), rows, malas, faltan);
  } catch (err) {
    modal(`<h3>No se pudo leer el archivo</h3><div class="msg err">${esc(err.message)}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cerrar</button></div>`);
  }
};

// Lista de vehículos (Excel VEHICULOS PROXI): puede tener varios bloques lado a lado,
// uno por proxy, cada uno con su columna PLACA. El proxy sale de la columna PROXI
// o, si no hay, del título que está encima del bloque.
const normPlaca = p => String(p ?? '').toUpperCase().replace(/[\s-]/g, '');
const normProxi = p => { const s = normH(p); return s.startsWith('ISUTO') ? 'ISUTO' : s.startsWith('ESCUADR') ? 'ESCUADRON' : String(p ?? '').trim().toUpperCase(); };
function leerFlota(tablas) {
  const vistas = new Map();
  for (const t of tablas) {
    for (let hi = 0; hi < Math.min(10, t.length); hi++) {
      const hs = t[hi].map(normH);
      const cols = hs.map((h, c) => h === 'PLACA' ? c : -1).filter(c => c >= 0);
      cols.forEach((c, k) => {
        const fin = k + 1 < cols.length ? cols[k + 1] : hs.length;
        const col = alias => { for (let j = c + 1; j < fin; j++) if (alias.includes(hs[j])) return j; return -1; };
        const cP = col(['PROXI', 'PROXY']), cT = col(['TIPO', 'VEHICULO']), cMa = col(['MARCA']), cMo = col(['MODELO']);
        const titulo = hi > 0 ? t[hi - 1][c] : '';
        for (let r = hi + 1; r < t.length; r++) {
          const placa = normPlaca(t[r][c]);
          if (!placa) break;
          if (!/^[A-Z0-9]{5,10}$/.test(placa) || vistas.has(placa)) continue;
          const v = j => j >= 0 ? String(t[r][j] ?? '').trim() : '';
          vistas.set(placa, { placa, proxi: normProxi(v(cP) || titulo), tipo: v(cT).toUpperCase(), marca: v(cMa), modelo: v(cMo) });
        }
      });
    }
  }
  return [...vistas.values()];
}

function previewFlota(nombre, placas) {
  const conGasto = new Set(ROWS.map(r => r.placa));
  const sinGasto = placas.filter(p => !conGasto.has(p.placa)).map(p => p.placa);
  const nuevas = new Set(placas.map(p => p.placa));
  const fuera = [...conGasto].filter(p => p !== 'SIN PLACA' && !nuevas.has(p)).sort();
  const porProxi = {};
  placas.forEach(p => (porProxi[p.proxi || 'SIN PROXY'] = porProxi[p.proxi || 'SIN PROXY'] || []).push(p.placa));
  modal(`<h3>Flota actual</h3>
    <dl class="kv">
      <dt>Archivo</dt><dd>${esc(nombre)}</dd>
      <dt>Placas</dt><dd>${placas.length}</dd>
      ${Object.entries(porProxi).map(([px, ps]) => `<dt>${esc(px)}</dt><dd>${ps.length}: ${esc(ps.join(', '))}</dd>`).join('')}
    </dl>
    ${sinGasto.length ? `<div class="msg">Sin gastos en el Detalle cargado: <b>${esc(sinGasto.join(', '))}</b></div>` : ''}
    ${fuera.length ? `<div class="msg">Tienen gastos pero no están en esta lista (no cuentan en la vista Flota actual): ${esc(fuera.join(', '))}</div>` : ''}
    <div class="msg">Esto <b>reemplaza la lista de flota actual</b>${FLOTA_SET.size ? ` (hoy ${FLOTA_SET.size} placas)` : ''}. Los gastos no cambian.</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="confirmFlota">Guardar flota actual</button></div>`);
  document.getElementById('confirmFlota').onclick = async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Guardando…';
    try {
      await api('/api/flota', { method: 'POST', body: JSON.stringify({ placas, archivo: nombre }) });
      closeModal();
      F.vista = 'FLOTA'; F.placa = '';
      await load();
    } catch (err) {
      ev.target.disabled = false; ev.target.textContent = 'Reintentar';
      document.querySelector('#modalBody .modal-actions').insertAdjacentHTML('beforebegin', `<div class="msg err">${esc(err.message)}</div>`);
    }
  };
}

function previewUpload(nombre, rows, malas, faltan) {
  const fechas = rows.map(r => r.fecha).sort();
  const tot = rows.reduce((s, r) => s + r.monto, 0);
  const sinProxy = [...new Set(rows.filter(r => r.proxi === 'SIN PROXY' && r.placa !== 'SIN PLACA').map(r => r.placa))];
  modal(`<h3>Revisar antes de cargar</h3>
    <dl class="kv">
      <dt>Archivo</dt><dd>${esc(nombre)}</dd>
      <dt>Filas</dt><dd>${fmt0.format(rows.length)}</dd>
      <dt>Período</dt><dd>${fechas[0]} a ${fechas[fechas.length - 1]}</dd>
      <dt>Total</dt><dd>Bs ${fmt2.format(tot)}</dd>
      <dt>Sin placa</dt><dd>${rows.filter(r => r.placa === 'SIN PLACA').length} filas</dd>
      <dt>Placas sin proxy</dt><dd>${sinProxy.length ? esc(sinProxy.join(', ')) : 'ninguna'}</dd>    </dl>
    ${faltan.length ? `<div class="msg">Columnas no encontradas (quedan vacías): <b>${faltan.join(', ')}</b></div>` : ''}
    ${malas.length ? `<div class="msg err">${malas.length} filas sin fecha o monto válido no se cargarán (filas ${malas.slice(0, 8).map(m => m.fila).join(', ')}${malas.length > 8 ? '…' : ''}).</div>` : ''}
    <div class="msg">Esto <b>reemplaza todos los gastos</b> cargados ahora (${fmt0.format(ROWS.length)} filas) por los de este archivo.</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="confirmUp">Reemplazar y cargar</button></div>`);
  document.getElementById('confirmUp').onclick = async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Cargando…';
    try {
      await api('/api/gastos/import', { method: 'POST', body: JSON.stringify({ rows, archivo: nombre }) });
      closeModal();
      F.mes = 0; F.placa = ''; F.tipo = ''; T.q = ''; T.shown = 100;
      await load();
    } catch (err) {
      ev.target.disabled = false; ev.target.textContent = 'Reintentar';
      document.querySelector('#modalBody .modal-actions').insertAdjacentHTML('beforebegin', `<div class="msg err">${esc(err.message)}</div>`);
    }
  };
}

document.getElementById('usersBtn').onclick = () => openUsers();
async function openUsers(msg = '') {
  modal('<h3>Usuarios</h3><div class="msg">Cargando…</div>');
  let users = [];
  try { users = await api('/api/users'); } catch (e) { msg = `<span class="err">${esc(e.message)}</span>`; }
  modal(`<h3>Usuarios</h3>
    <div class="msg">Los usuarios <b>user</b> solo ven el dashboard. Los <b>admin</b> además suben el Excel y gestionan usuarios.</div>
    <table class="tbl">${users.map(u => `<tr><td class="m">${esc(u.username)}</td><td>${esc(u.role)}</td>
      <td class="r"><button class="link" data-pw="${u.id}">Cambiar contraseña</button>
      ${u.username === 'admin' ? '' : `<button class="link" data-del="${u.id}" data-n="${esc(u.username)}">Eliminar</button>`}</td></tr>`).join('')}</table>
    <h3 style="margin-top:18px">Nuevo usuario</h3>
    <div class="f-group" style="flex-wrap:wrap">
      <input class="search" id="nuUser" placeholder="usuario" autocomplete="off">
      <input class="search" id="nuPass" type="password" placeholder="contraseña" autocomplete="new-password">
      <select class="sel" id="nuRole"><option value="user">user</option><option value="admin">admin</option></select>
      <button class="btn btn-primary" id="nuAdd">Crear</button>
    </div>
    <div class="msg" id="uMsg" style="margin-top:10px">${msg}</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cerrar</button></div>`);
  const say = m => document.getElementById('uMsg').innerHTML = m;
  document.getElementById('nuAdd').onclick = async () => {
    const username = document.getElementById('nuUser').value.trim(), password = document.getElementById('nuPass').value;
    if (!username || !password) return say('<span class="err">Completa usuario y contraseña.</span>');
    try { await api('/api/users', { method: 'POST', body: JSON.stringify({ username, password, role: document.getElementById('nuRole').value }) }); openUsers(`Usuario <b>${esc(username)}</b> creado.`); }
    catch (e) { say(`<span class="err">${esc(e.message)}</span>`); }
  };
  document.querySelectorAll('#modalBody [data-del]').forEach(b => b.onclick = async () => {
    if (!confirm(`¿Eliminar al usuario ${b.dataset.n}?`)) return;
    try { await api('/api/users/' + b.dataset.del, { method: 'DELETE' }); openUsers('Usuario eliminado.'); }
    catch (e) { say(`<span class="err">${esc(e.message)}</span>`); }
  });
  document.querySelectorAll('#modalBody [data-pw]').forEach(b => b.onclick = async () => {
    const password = prompt('Nueva contraseña:');
    if (!password) return;
    try { await api(`/api/users/${b.dataset.pw}/password`, { method: 'PUT', body: JSON.stringify({ password }) }); say('Contraseña actualizada.'); }
    catch (e) { say(`<span class="err">${esc(e.message)}</span>`); }
  });
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOGO · Vehículo 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D;--bg2:#141414;--bg3:#1A1A1A;--bg4:#222;
  --border:#2A2A2A;--border2:#333;
  --amber:#F5A623;--amber2:#FFBE47;--amber-dim:#F5A6231a;
  --text:#E8E8E8;--text2:#999;--text3:#666;--red:#FF4444;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;}
button,select{font-family:inherit;}
.header{display:flex;align-items:center;gap:16px;padding:0 24px;height:52px;flex:none;background:var(--bg2);border-bottom:1px solid var(--border);}
.logo{background:var(--amber);color:#000;font-weight:700;font-size:13px;padding:4px 10px;border-radius:4px;letter-spacing:1px;font-family:var(--mono);text-decoration:none;}
.header-title{font-size:13px;color:var(--text2);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;}
.sep{flex:1;}
.btn{padding:6px 14px;font-size:11px;font-family:var(--mono);font-weight:500;border:1px solid var(--border2);background:transparent;color:var(--text2);border-radius:4px;cursor:pointer;transition:all .15s;letter-spacing:.5px;text-transform:uppercase;text-decoration:none;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;flex:none;border-bottom:1px solid var(--border);background:var(--bg2);}
.f-label{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.8px;}
.f-group{display:flex;align-items:center;gap:6px;}
.sel{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:4px;padding:6px 10px;font-size:12px;font-family:var(--mono);cursor:pointer;}
.sel:focus{outline:1px solid var(--amber);}

.main{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0;}
.viewer{position:relative;min-width:0;min-height:0;overflow:hidden;}
.viewer canvas{display:block;width:100%;height:100%;cursor:grab;}
.viewer canvas:active{cursor:grabbing;}
.hud{position:absolute;pointer-events:none;}
.hud-tl{top:18px;left:22px;}
.hud-placa{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:1px;}
.hud-modelo{font-size:12px;color:var(--text2);margin-top:2px;}
.hud-total{font-family:var(--mono);font-size:13px;color:var(--amber);margin-top:10px;}
.hud-total span{color:var(--text3);}
.hud-bl{left:22px;bottom:18px;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;}
.hud-bl .btn{background:#141414cc;backdrop-filter:blur(4px);}
.hud-br{right:22px;bottom:20px;font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;}
.legend{width:180px;height:6px;border-radius:3px;margin:6px 0 4px auto;background:linear-gradient(90deg,#245ea8,#3987e5 35%,#F5A623 70%,#FF4444);}
.legend-l{display:flex;justify-content:space-between;width:180px;margin-left:auto;}
.tip{position:absolute;pointer-events:none;background:#0d0d0de6;border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:12px;display:none;white-space:nowrap;z-index:5;}
.tip b{display:block;font-weight:600;margin-bottom:2px;}
.tip span{font-family:var(--mono);color:var(--amber);font-size:11px;}
.estado{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text2);font-size:13px;line-height:1.6;padding:24px;}

.panel{border-left:1px solid var(--border);background:var(--bg2);overflow-y:auto;min-height:0;}
.p-sec{padding:18px 20px;border-bottom:1px solid var(--border);}
.p-h{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;}
.pt-row{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:background .12s;}
.pt-row:hover{background:var(--bg3);}
.pt-row.on{background:var(--amber-dim);border-color:#F5A62355;}
.sw{width:12px;height:12px;border-radius:3px;}
.pt-n{font-size:13px;}
.pt-m{font-family:var(--mono);font-size:12px;text-align:right;}
.pt-bar{grid-column:2/4;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.pt-bar i{display:block;height:100%;border-radius:2px;transition:width .4s;}
.pt-c{grid-column:2/4;font-size:10px;color:var(--text3);font-family:var(--mono);}
.det-h{font-size:16px;font-weight:600;}
.det-sub{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.5;}
.det-kpi{display:flex;gap:18px;margin-top:12px;font-family:var(--mono);}
.det-kpi div{font-size:16px;color:var(--amber);}
.det-kpi small{display:block;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}
.g-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;}
.g-row:last-child{border-bottom:none;}
.g-top{display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:11px;color:var(--text2);}
.g-top .g-m{margin-left:auto;color:var(--text);}
.g-desc{margin-top:4px;color:var(--text);line-height:1.45;word-break:break-word;}
.g-tags{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;}
.tag{font-size:9px;font-family:var(--mono);padding:2px 6px;border-radius:8px;background:var(--bg4);color:var(--text2);text-transform:uppercase;letter-spacing:.4px;}
.nota{font-size:11px;color:var(--text3);line-height:1.5;}
.link{color:var(--amber);cursor:pointer;background:none;border:none;font-size:11px;text-decoration:underline;}

.ficha{position:absolute;top:14px;right:14px;width:360px;max-height:calc(100% - 84px);overflow-y:auto;display:none;z-index:6;
  background:#0f0f10eb;backdrop-filter:blur(6px);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;box-shadow:0 10px 30px #0008;}
.f-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;}
.f-tit{font-size:16px;font-weight:600;}
.f-sub{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.45;}
.f-x{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:6px;width:26px;height:26px;font-size:16px;line-height:1;cursor:pointer;flex:none;}
.f-x:hover{border-color:var(--amber);color:var(--amber);}
.f-sec{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;}
.f-fila{display:grid;grid-template-columns:92px 1fr auto 34px;gap:8px;align-items:center;font-size:12px;margin-bottom:6px;}
.f-k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);font-family:var(--mono);font-size:11px;}
.f-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.f-bar i{display:block;height:100%;border-radius:3px;}
.f-v{font-family:var(--mono);font-size:11px;text-align:right;}
.f-p{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;}
.f-rep{font-size:10px;color:var(--text3);margin-right:2px;align-self:center;}
.tag.on{background:var(--amber-dim);color:var(--amber);}
.f-err{margin-top:5px;font-size:11px;color:#fbbf24;background:#f59e0b14;border:1px solid #f59e0b40;border-radius:5px;padding:4px 7px;line-height:1.45;}
.f-err b{font-family:var(--mono);font-weight:600;}
@media (max-width:900px){
  .ficha{top:auto;bottom:62px;left:10px;right:10px;width:auto;max-height:55%;}
  body{overflow:auto;}
  .main{grid-template-columns:1fr;grid-template-rows:60vh auto;}
  .panel{border-left:none;border-top:1px solid var(--border);overflow:visible;}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<body>

<div class="header">
  <a class="logo" href="/">TOGO</a>
  <span class="header-title">Vehículo 3D · gasto por pieza</span>
  <span class="sep"></span>
  <a class="btn" href="/">← Gastos</a>
</div>

<div class="toolbar">
  <div class="f-group"><span class="f-label">Vehículo</span><select class="sel" id="fVeh"></select></div>
  <div class="f-group"><span class="f-label">Año</span><select class="sel" id="fAnio"></select></div>
  <span class="nota" id="flotaNota"></span>
</div>

<div class="main">
  <div class="viewer" id="viewer">
    <div class="hud hud-tl">
      <div class="hud-placa" id="hPlaca"></div>
      <div class="hud-modelo" id="hModelo"></div>
      <div class="hud-total" id="hTotal"></div>
    </div>
    <div class="hud hud-bl">
      <button class="btn" id="bDesarmar">Desarmar</button>
      <button class="btn active" id="bCalor">Mapa de calor</button>
      <button class="btn active" id="bGirar">Girar</button>
    </div>
    <div class="hud hud-br" id="leyenda">
      Gasto de mantenimiento por pieza
      <div class="legend"></div>
      <div class="legend-l"><span>menos</span><span>más</span></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="ficha" id="ficha"></div>
    <div class="estado" id="estado">Cargando gastos…</div>
  </div>
  <div class="panel" id="panel"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ══ PIEZAS ══════════════════════════════════════════════════════════════════
// Cada gasto se asigna a las piezas que nombra su descripción (sin tildes, en mayúsculas).
// Si nombra varias, el monto se reparte en partes iguales entre ellas.
const PARTES = [
  { id: 'carroceria', nombre: 'Carrocería', incluye: 'puertas, parrilla, parador, asiento, tanque, soldaduras',
    re: /PUERTA|PARRILLA|PARILLA|CHAPA(?! DE ENCENDIDO)|SOLDADUR|SOLDAR|LATERAL|PARADOR|\bPATA\b|CARROCER|PINTURA|PARACHOQUE|GUARDABARRO|GUARDAFANGO|ASIENTO|VIDRIO|PARABRISA|PLUMILLA|TANQUE|CAJON|MALETERO/ },
  { id: 'mandos', nombre: 'Mandos y cables', incluye: 'chicotillos, acelerador, palancas, puños, espejos',
    re: /CHICOTILLO|ACELERADOR|ACELERACI|PALANCA|PUNO|\bCABLES?\b|MANILLAR|MANUBRIO|ESPEJO|PEDAL|VOLANTE(?! (DE )?INERCIA)/ },
  { id: 'electrico', nombre: 'Sistema eléctrico', incluye: 'focos, faroles, batería, bobina, arranque, aire acondicionado',
    re: /FOCO|\bFOTOS?\b|FAROL|BATERIA|BOBINA|ALTERNADOR|ARRANQUE|BENDIX|\bSTOP\b|SENSOR|ELECTRIC|REGULADOR(?! DE BALANCIN)|HALOGENO|\bLUC|\bLUZ\b|CORRIENTE|(?<!BUJIAS? DE? ?)ENCENDIDO|FUSIBLE|BOCINA|DESTILADA|AIRE ACONDICIONADO|INTERMITENTE|DIRECCIONAL|GUINADOR|TABLERO|VELOCIMETRO|\bCDI\b|\bRELAY\b/ },
  { id: 'motor', nombre: 'Motor y aceite', incluye: 'aceite, arandela y tapón, filtros, carburador, bujías, culata, distribución',
    re: /(?<!BOBINAS? DE )MOTOR|ACEITE|ACIETE|ARANDELA(?!S? PARA SOPORTE)|TAPON|FILTRO|CULATA|BALANCIN|(?<!TRANSMISION O )DISTRIBUCI|CORREA|VALVULA|CIGUENAL|CARBURA|BUJIA|INYECTOR|EMPAQUETADURA|CARTER|(?<!C.)O-?RING|ANILLO|EMBOLO|PISTON|RECTIFICAD(?!O DE (TAMBOR|DISCO|CORRIENTE))|CADENILLA|INERCIA|PICOS(?! DE LLANTA)|REFRIGERANTE|COMBUSTIBLE|RADIADOR|ESCAPE|SILENCIADOR/ },
  { id: 'transmision', nombre: 'Transmisión', incluye: 'kit de transmisión, cadena, piñón, corona, embrague, caja',
    re: /TRANSMISI|TRANSIMICI|TRASMISI|EMBRAGUE|EMRAGUE|\bCADENA\b|PINON|CORONA|\bCAJA\b|SELECTOR|NEUTRO|TE?N?SADOR DE CADENA|CARDAN|DIFERENCIAL|PALIER|SEMIEJE|CRUCETA|ARRASTRE|ROSETA/ },
  { id: 'suspension', nombre: 'Suspensión y dirección', incluye: 'telescopios, amortiguadores, bujes, dirección, muelles',
    re: /TELESCOPIO|TEELESCOPIO|AMORTIGUA|\bBUJES?\b(?! DE ROSETA)|SUSPENSI|HIDR(AU|UA)LIC|DIRECCION\b|ROTULA|TERMINAL|MUELLE|BALLESTA|ESPIRAL|ESTABILIZ|HORQUILLA|BASCULANTE/ },
  { id: 'frenos', nombre: 'Frenos', incluye: 'pastillas, balatas, discos, zapatas',
    re: /FRENO|BALATA|BALTA|PASTILLA|POASTILLA|\bDISCOS?\b(?! DE EMB?RAGUE)|ZAPATA|TAMBOR/ },
  { id: 'ruedas', nombre: 'Llantas y ruedas', incluye: 'llantas, cámaras, parchados, rodamientos, rotación',
    re: /LLANTA|CAMARA|PARCHAD|RUEDA|RODAMIENTOS?(?! (DE )?(CORREA|DIRECCION))|\bAROS?\b|\bRINES?\b|ROTACION|ALINEA|BALANCEO|NEUMATICO|RINALDI|MAC?S?ERO/ },
];
PARTES.forEach((p, i) => p.orden = i);
const GENERAL = { id: 'general', nombre: 'Servicio general', incluye: 'mantenimientos y mano de obra que no nombran una pieza' };
const PARTE = Object.fromEntries([...PARTES, GENERAL].map(p => [p.id, p]));
const MANT = ['PREVENTIVO', 'CORRECTIVO', 'REPUESTOS'];

const norm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
// Errores de escritura encontrados en el Excel: se corrigen antes de clasificar
// y la ficha avisa en cada gasto qué palabra hay que arreglar en el Excel.
const CORRECCIONES = [
  [/\bACIETE\b/, 'ACEITE'], [/\bARA?NA?DELA(S?)\b/, 'ARANDELA$1'], [/\bASI?PI?RADO\b/, 'ASPIRADO'],
  [/\bBALTA(S?)\b/, 'BALATA$1'], [/\bBARRILLA\b/, 'VARILLA'], [/\bBLOK\b/, 'BLOCK'],
  [/\bCARBURADR\b/, 'CARBURADOR'], [/\bCARYY\b/, 'CARRY'], [/\bCOMR[PR]A\b/, 'COMPRA'],
  [/\bDESMONTAGE\b/, 'DESMONTAJE'], [/MONTAGUE\b/, 'MONTAJE'], [/\bEMB?REAGU[ER]\b|\bEMRAGUE\b/, 'EMBRAGUE'],
  [/\bFOTO\b/, 'FOCO'], [/\bHIDRUALIC/, 'HIDRAULIC'], [/\bLIUMPIEZA\b/, 'LIMPIEZA'],
  [/\bMANTENIEMIENTO\b/, 'MANTENIMIENTO'], [/MANTENIMIENTO PREVENTIVA\b/, 'MANTENIMIENTO PREVENTIVO'],
  [/\bPACHADO\b/, 'PARCHADO'], [/\bPARRILA(S?)\b|\bPARILLA(S?)\b/, 'PARRILLA$1$2'], [/\bPOASTILLA(S?)\b/, 'PASTILLA$1'],
  [/\bREEEMPLAZO\b/, 'REEMPLAZO'], [/\bREVICION\b/, 'REVISION'], [/\bSUSPENCION\b/, 'SUSPENSION'],
  [/\bTEELESCOPIO(S?)\b/, 'TELESCOPIO$1'], [/\bTRABAJAO?\b|\bTRABJAO\b/, 'TRABAJO'],
  [/\bTRANSIMICION\b|\bTRANSMICION\b|\bTRASN?MISION\b/, 'TRANSMISION'], [/\bVALANCINES\b/, 'BALANCINES'],
  [/\bM OTO\b/, 'MOTO'],
];
function corregir(desc) {
  let d = norm(desc); const errores = [];
  CORRECCIONES.forEach(([re, ok]) => {
    d = d.replace(new RegExp(re.source, 'g'), (m, ...g) => {
      const bien = ok.replace(/\$(\d)/g, (_, i) => g[i - 1] || '');
      if (m !== bien && !errores.some(e => e[0] === m)) errores.push([m, bien]);
      return bien;
    });
  });
  return { d, errores };
}
function clasificar(d) {
  const ids = PARTES.filter(p => p.re.test(d)).map(p => p.id);
  return ids.length ? ids : ['general'];
}

// ══ DATOS ═══════════════════════════════════════════════════════════════════
const fmt0 = new Intl.NumberFormat('es-BO', { maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const bs = v => 'Bs ' + fmt0.format(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = () => localStorage.getItem('togo_token');
const goLogin = () => { ['togo_token', 'togo_user', 'togo_role'].forEach(k => localStorage.removeItem(k)); location.href = '/login.html'; };

let ROWS = [];               // gastos de mantenimiento con .partes
let FLOTA = new Map();       // placa → {tipo, marca, modelo, proxi}
let VEH = new Map();         // placa → {placa, tipo:'moto'|'furgon', etiqueta, total, n}
const S = { veh: '', anio: 0, parte: '', hover: '', desarmar: false, calor: true, girar: true, shown: 60 };

function tipoVehiculo(placa, descs) {
  const f = FLOTA.get(placa);
  const t = f ? norm(`${f.tipo} ${f.marca} ${f.modelo}`) : '';
  if (/MOTO|CB ?1|HONDA|YAMAHA|BAJAJ/.test(t)) return 'moto';
  if (/CARRY|APV|FURG|CAMION|VAN\b|RAM\b|SUZUKI|CAMIONETA|AUTO/.test(t)) return 'furgon';
  let m = 0, c = 0;
  descs.forEach(d => { d = norm(d); if (/\bMOTOS?\b|MOTOCICLETA|CB ?160/.test(d)) m++; if (/CARRY|FURGON|\bAPV\b|\bRAM\b|CAMION/.test(d)) c++; });
  return m > c ? 'moto' : 'furgon';
}
// La flota de TOGO: furgones Suzuki APV (en los Excel a veces figuran como "Carry"),
// una RAM 700 modificada a furgón (5264PUB) y motos Honda CB160.
const PLACAS_RAM = new Set(['5264PUB']);
function modeloVehiculo(placa, tipo, descs) {
  if (tipo === 'moto') return 'moto';
  const f = FLOTA.get(placa);
  const t = norm(`${f ? f.marca + ' ' + f.modelo : ''} ${descs.join(' ')}`);
  return PLACAS_RAM.has(placa) || /\bRAM\b|RAPID/.test(t) ? 'ram' : 'apv';
}
const ETIQUETA = { moto: 'Honda CB160 Hornet', apv: 'Suzuki APV', ram: 'RAM 700 · furgón modificado' };

async function cargar() {
  if (!token()) return goLogin();
  let d;
  try {
    const r = await fetch('/api/gastos', { headers: { 'x-auth-token': token() } });
    if (r.status === 401) return goLogin();
    d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
  } catch (e) {
    estado(`No se pudieron cargar los gastos.<br>${esc(e.message)}`);
    return;
  }
  (d.flota?.placas || []).forEach(p => FLOTA.set(p.placa, p));
  ROWS = d.rows.filter(r => MANT.includes(r.tipo) && r.placa && r.placa !== 'SIN PLACA')
    .map(r => { const { d, errores } = corregir(r.descripcion); return { ...r, partes: clasificar(d), errores }; });
  if (!ROWS.length) { estado('Todavía no hay gastos de mantenimiento cargados.'); return; }

  const porPlaca = new Map();
  ROWS.forEach(r => { if (!porPlaca.has(r.placa)) porPlaca.set(r.placa, []); porPlaca.get(r.placa).push(r); });
  porPlaca.forEach((rs, placa) => {
    const descs = rs.map(r => r.descripcion);
    const tipo = PLACAS_RAM.has(placa) ? 'furgon' : tipoVehiculo(placa, descs);
    const modelo = modeloVehiculo(placa, tipo, descs);
    VEH.set(placa, { placa, tipo, modelo, etiqueta: ETIQUETA[modelo], total: rs.reduce((s, r) => s + r.monto, 0), n: rs.length });
  });
  ROWS.forEach(r => r.vtipo = VEH.get(r.placa).tipo);

  // Vehículo inicial: ?placa=XXX, o el furgón con más gasto
  const q = new URLSearchParams(location.search).get('placa');
  const lista = [...VEH.values()].sort((a, b) => b.total - a.total);
  S.veh = q && VEH.has(q) ? q : (lista.find(v => v.tipo === 'furgon') || lista[0]).placa;

  armarFiltros(lista);
  // Las calcomanías se dibujan con la fuente Inter: esperar a que cargue
  await document.fonts.load('italic 700 64px Inter').catch(() => {});
  document.getElementById('estado').style.display = 'none';
  actualizar();
}

function estado(html) { const e = document.getElementById('estado'); e.innerHTML = html; e.style.display = 'flex'; }

function armarFiltros(lista) {
  const sV = document.getElementById('fVeh');
  const grupo = (tipo, titulo) => {
    const vs = lista.filter(v => v.tipo === tipo);
    if (!vs.length) return '';

// ── Ayudas para modelar ──
let root = null, piezas = [], modeloActual = '';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.25, ...o });
const METAL = { metalness: 0.85, roughness: 0.3 };
const VIDRIO = { metalness: 0.6, roughness: 0.04 };
const GOMA = { metalness: 0, roughness: 0.92 };
function mesh(geo, color, pos = [0, 0, 0], rot = [0, 0, 0], o) {

  m.position.set(...pos); m.rotation.set(...rot);

}
const caja = (sx, sy, sz, color, pos, rot, o) => mesh(new THREE.BoxGeometry(sx, sy, sz), color, pos, rot, o);
const cil = (r, h, color, pos, rot, o, seg = 24) => mesh(new THREE.CylinderGeometry(r, r, h, seg), color, pos, rot, o);
const EJE_Z = [Math.PI / 2, 0, 0], EJE_X = [0, 0, Math.PI / 2];
function barra(a, b, r, color, o) {
  const A = V(...a), B = V(...b);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 12), mat(color, o));
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), B.clone().sub(A).normalize());
  return m;
}
function tubo(puntos, r, color, cerrado = false, o) {

}
class Helice extends THREE.Curve {
  constructor(r, h, vueltas) { super(); this.r = r; this.h = h; this.v = vueltas; }
  getPoint(t, o = new THREE.Vector3()) { const a = t * Math.PI * 2 * this.v; return o.set(Math.cos(a) * this.r, t * this.h - this.h / 2, Math.sin(a) * this.r); }
}
// Resorte con amortiguador entre dos puntos
function resorte(a, b, r, vueltas, color) {

const grupo = (...objs) => { const g = new THREE.Group(); objs.flat(Infinity).forEach(o => g.add(o)); return g; };

// Registra una pieza: a qué parte pertenece y hacia dónde sale al desarmar
const mats = m => Array.isArray(m.material) ? m.material : [m.material];
function pz(parte, obj, ex = [0, 0, 0]) {
  obj.userData = { parte, base: obj.position.clone(), ex: V(...ex) };
  obj.traverse(m => {
    if (!m.isMesh) return;
    m.castShadow = m.receiveShadow = true;
    m.userData.parte = parte;
    // Una pieza puede tener varios materiales (carrocería: pintura, vidrio, plástico)
    mats(m).forEach(mt => {
      if (mt.userData.c0) return;
      Object.assign(mt.userData, { c0: mt.color.clone(), e0: mt.emissive.clone(), ei0: mt.emissiveIntensity, t0: mt.transparent, o0: mt.opacity });
    });
  });
  root.add(obj); piezas.push(obj);
  return obj;
}

// ── Ayudas de modelado: eje X = largo (frente +X), Z = ancho ──
// Carrocería a partir del perfil lateral, extruido a lo ancho
// Las esquinas del perfil se redondean, los bordes laterales se biselan y la trompa
// se angosta hacia adelante, como en la carrocería real. Pintura con laca.
function perfil(pts, ancho, color, { radio = 0.1, trompa = 0.07 } = {}) {
  pts = pts.filter((p, i) => { const q = pts[(i + 1) % pts.length]; return Math.hypot(p[0] - q[0], p[1] - q[1]) > 1e-4; });
  const n = pts.length, sh = new THREE.Shape();
  pts.forEach((p, i) => {
    const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const r = Math.min(radio, la / 2.2, lb / 2.2);
    const p1 = [p[0] + (a[0] - p[0]) / la * r, p[1] + (a[1] - p[1]) / la * r];
    const p2 = [p[0] + (b[0] - p[0]) / lb * r, p[1] + (b[1] - p[1]) / lb * r];
    if (i === 0) sh.moveTo(...p1); else sh.lineTo(...p1);
    sh.quadraticCurveTo(p[0], p[1], ...p2);
  });
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: ancho - 0.1, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05, bevelSegments: 5, curveSegments: 6 });
  g.translate(0, 0, -(ancho - 0.1) / 2);
  const pos = g.attributes.position, xMax = Math.max(...pts.map(p => p[0])), x0 = xMax - 0.65;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    if (x > x0) { const f = (x - x0) / (xMax - x0); pos.setZ(i, pos.getZ(i) * (1 - trompa * f * f)); }
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color, roughness: 0.32, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.08 }));
}
// Pieza plana pegada al costado (ventanas), a los dos lados
function lamina(pts, z, color, o) {
  const sh = new THREE.Shape(); sh.moveTo(...pts[0]); pts.slice(1).forEach(p => sh.lineTo(...p));
  const geo = new THREE.ShapeGeometry(sh);
  return [1, -1].map(s => { const m = new THREE.Mesh(geo, mat(color, { side: THREE.DoubleSide, ...o })); m.position.z = s * z; return m; });
}
// Línea fina sobre la carrocería (juntas de puertas)
const junta = (x0, y0, x1, y1, z) => [1, -1].map(s => barra([x0, y0, s * z], [x1, y1, s * z], 0.004, '#8f949b'));

// ── Calcomanías de Farmacorp, dibujadas en un canvas ──
const AZUL_FC = '#22306e';
const PETALOS = ['#1d4f9c', '#3fa9dd', '#f6c400', '#f39200', '#e2352b', '#3fa9dd', '#f6c400', '#f39200'];
function flor(ctx, cx, cy, r) {
  PETALOS.forEach((c, i) => {
    const a = i * Math.PI / 4 - Math.PI / 2;
    ctx.save(); ctx.translate(cx + Math.cos(a) * r * 0.56, cy + Math.sin(a) * r * 0.56); ctx.rotate(a);
    ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.42, r * 0.15, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
}
function marca(ctx, w, h, color = AZUL_FC) {
  const fs = h * 0.78;
  ctx.font = `italic 700 ${fs}px Inter, Arial, sans-serif`; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color;
  const tw = ctx.measureText('Farmacorp').width, esc = Math.min(1, (w - fs * 0.7) / tw);
  ctx.save(); ctx.translate(0, h * 0.86); ctx.scale(esc, 1); ctx.fillText('Farmacorp', 0, 0); ctx.restore();
  flor(ctx, tw * esc + fs * 0.32, h * 0.3, fs * 0.3);
}
function texto(txt, color, peso = 700, italica = true) {
  return (ctx, w, h) => {
    const fs = h * 0.8;
    ctx.font = `${italica ? 'italic ' : ''}${peso} ${fs}px Inter, Arial, sans-serif`; ctx.fillStyle = color; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(txt).width, esc = Math.min(1, w / tw);
    ctx.save(); ctx.translate(0, h / 2); ctx.scale(esc, 1); ctx.fillText(txt, 0, 0); ctx.restore();
  };
}
// Calcomanía en los dos costados; x, y = centro
function calco(ancho, alto, dibujar, x, y, z) {
  const W = 1024, H = Math.max(16, Math.round(W * alto / ancho));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  dibujar(cv.getContext('2d'), W, H);
  const tex = new THREE.CanvasTexture(cv);

    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.35, roughness: 0.4, polygonOffset: true, polygonOffsetFactor: -2 }));

}

// ══ CARROCERÍA POR SECCIONES ═════════════════════════════════════════════════
// Interpolación lineal por tramos y suavizado, para describir el vehículo a lo largo de X
const lin = pts => x => {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }
  return pts.at(-1)[1];
};
const suavizar = (f, d = 0.03) => x => (f(x - d) + 2 * f(x) + f(x + d)) / 4;
// Parte de abajo con los pasaruedas: sube en arco sobre cada rueda
const bajoArcos = (base, ruedas, yR, r) => x => {
  let y = base(x);
  ruedas.forEach(xc => { const d = x - xc; if (Math.abs(d) < r) y = Math.max(y, yR + Math.sqrt(r * r - d * d)); });
  return y;
};

// Materiales de la carrocería: cada cara toma uno según su zona. Las ópticas (faro, ámbar,
// stop, cristal) salen como piezas aparte, al ras de la carrocería, para el sistema eléctrico.
const MAT_CASCO = {
  pintura: () => new THREE.MeshPhysicalMaterial({ color: '#f3f4f5', roughness: 0.28, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.06 }),
  vidrio: () => new THREE.MeshPhysicalMaterial({ color: '#0c1420', roughness: 0.18, metalness: 0.2, clearcoat: 0.4, clearcoatRoughness: 0.2, flatShading: true }),
  plastico: () => new THREE.MeshStandardMaterial({ color: '#1b1b1b', roughness: 0.75, metalness: 0 }),
  parrilla: () => new THREE.MeshStandardMaterial({ color: '#0e0e0e', roughness: 0.5, metalness: 0.2 }),
  faro: () => new THREE.MeshPhysicalMaterial({ color: '#e9eef4', roughness: 0.08, metalness: 0.6, clearcoat: 1, emissive: '#fff4c2', emissiveIntensity: 0.25 }),
  ambar: () => new THREE.MeshPhysicalMaterial({ color: '#f59e0b', roughness: 0.15, clearcoat: 1, emissive: '#f59e0b', emissiveIntensity: 0.35 }),
  stop: () => new THREE.MeshPhysicalMaterial({ color: '#b91c1c', roughness: 0.12, clearcoat: 1, emissive: '#ff3b30', emissiveIntensity: 0.4 }),
  cristal: () => new THREE.MeshPhysicalMaterial({ color: '#e5e7ea', roughness: 0.08, metalness: 0.4, clearcoat: 1 }),
};
const ORDEN_MAT = ['pintura', 'vidrio', 'plastico', 'parrilla'];
const ORDEN_LUZ = ['faro', 'ambar', 'stop', 'cristal'];

// Genera la carrocería uniendo secciones transversales (superelipses) a lo largo de X.
// En cada sección: alto/bajo, ancho en la cintura y en el techo (los costados se inclinan
// hacia adentro sobre la cintura) y qué tan cuadrada es (n). zona() decide el material.
function casco({ x0, x1, bajo, alto, ancho, anchoTecho, cintura, n, zona, paso = 0.01, N = 180 }) {
  const xs = []; for (let x = x0; x < x1 - 1e-6; x += paso) xs.push(x); xs.push(x1);
  const pos = [], info = [];
  const anchoEn = (x, y) => {
    const ht = alto(x), ci = Math.min(cintura(x), ht - 0.02);
    const t = Math.min(1, Math.max(0, (y - ci) / Math.max(0.01, ht - ci)));
    return ancho(x) + (anchoTecho(x) - ancho(x)) * t * t;
  };
  xs.forEach(x => {
    const hb = bajo(x), ht = alto(x), cy = (hb + ht) / 2, hh = (ht - hb) / 2, ne = typeof n === 'function' ? n(x) : n;
    for (let j = 0; j < N; j++) {
      const th = j / N * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
      const fz = Math.sign(c) * Math.abs(c) ** (2 / ne), fy = Math.sign(s) * Math.abs(s) ** (2 / ne);
      const y = cy + hh * fy;
      pos.push(x, y, fz * anchoEn(x, y)); info.push([x, y, fz, fy]);
    }
  });
  const R = xs.length;
  const vacio = () => Object.fromEntries([...ORDEN_MAT, ...ORDEN_LUZ].map(k => [k, []]));
  const tris = vacio(), luzAdelante = vacio(), luzAtras = vacio();
  const agregar = (ids, ...t) => {
    const m = ids.reduce((a, i) => a.map((v, k) => v + info[i][k] / ids.length), [0, 0, 0, 0]);
    const z = zona(...m) || 'pintura';
    { const l = (ORDEN_LUZ.includes(z) ? (m[0] > 0 ? luzAdelante : luzAtras) : tris)[z]; for (const v of t) l.push(v); }
  };
  for (let i = 0; i < R - 1; i++) for (let j = 0; j < N; j++) {
    const a = i * N + j, b = i * N + (j + 1) % N, c = (i + 1) * N + j, d = (i + 1) * N + (j + 1) % N;
    agregar([a, b, c, d], a, c, b, b, c, d);
  }
  // Tapas delantera y trasera
  [[0, -1], [R - 1, 1]].forEach(([i, dir]) => {
    const x = xs[i], ci = pos.length / 3;
    pos.push(x + dir * 0.002, (bajo(x) + alto(x)) / 2, 0); info.push([x, (bajo(x) + alto(x)) / 2, 0, 0]);
    for (let j = 0; j < N; j++) {
      const p = i * N + j, q = i * N + (j + 1) % N;
      if (dir > 0) agregar([p, q], ci, q, p); else agregar([p, q], ci, p, q);
    }
  });
  const posAttr = new THREE.Float32BufferAttribute(pos, 3);
  const armar = (lista, orden, fabrica) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', posAttr);
    const idx = []; let ini = 0;
    orden.forEach((k, mi) => { g.addGroup(ini, lista[k].length, mi); for (const v of lista[k]) idx.push(v); ini += lista[k].length; });
    g.setIndex(idx); g.computeVertexNormals();
    return new THREE.Mesh(g, orden.map(k => fabrica[k]()));
  };
  return {
    mesh: armar(tris, ORDEN_MAT, MAT_CASCO),
    lucesAdelante: armar(luzAdelante, ORDEN_LUZ, MAT_CASCO),
    lucesAtras: armar(luzAtras, ORDEN_LUZ, MAT_CASCO),
    zEn: anchoEn,
  };
}

// Elementos pegados al costado de la carrocería (a los dos lados), según el ancho en ese punto
const alCostado = (zEn, x, y, crear, sep = 0.004) => [1, -1].map(s => {
  const o = crear(s); o.position.set(x, y, s * (zEn(x, y) + sep)); return o;
});
const juntaV = (zEn, x, y0, y1) => [1, -1].map(s => barra([x, y0, s * (zEn(x, y0) + 0.003)], [x, y1, s * (zEn(x, y1) + 0.003)], 0.0035, '#7d838a'));

// ══ RUEDAS ═══════════════════════════════════════════════════════════════════
// Neumático con perfil real (torneado), llanta de acero con agujeros o de aleación con rayos
function rueda(x, y, z, s, llanta) {
  const g = new THREE.Group();
  const perfilN = [[0.19, -0.1], [0.24, -0.106], [0.276, -0.1], [0.296, -0.075], [0.303, -0.035], [0.304, 0], [0.303, 0.035], [0.296, 0.075], [0.276, 0.1], [0.24, 0.106], [0.19, 0.1]].map(([r, h]) => new THREE.Vector2(r, h));
  const neum = new THREE.Mesh(new THREE.LatheGeometry(perfilN, 64), mat('#161616', { roughness: 0.92, metalness: 0, side: THREE.DoubleSide }));
  neum.rotation.x = Math.PI / 2; g.add(neum);
  [-0.05, 0, 0.05].map(h => g.add(mesh(new THREE.TorusGeometry(0.303, 0.004, 4, 64), '#0b0b0b', [0, 0, h], undefined, GOMA)));
  const cara = s * 0.075;
  if (llanta === 'aleacion') {
    g.add(cil(0.19, 0.16, '#2a2c2f', [0, 0, 0], EJE_Z, METAL, 40));
    g.add(mesh(new THREE.TorusGeometry(0.18, 0.012, 8, 48), '#d9dce0', [0, 0, cara], undefined, METAL));
    for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; g.add(caja(0.13, 0.05, 0.02, '#d6d9dd', [Math.cos(a) * 0.105, Math.sin(a) * 0.105, cara], [0, 0, a], METAL)); }
    g.add(cil(0.05, 0.03, '#d6d9dd', [0, 0, cara], EJE_Z, METAL));
  } else {
    g.add(cil(0.19, 0.16, '#b9bec4', [0, 0, 0], EJE_Z, METAL, 40));
    g.add(mesh(new THREE.TorusGeometry(0.17, 0.014, 8, 48), '#c9cdd2', [0, 0, cara], undefined, METAL));
    g.add(cil(0.155, 0.012, '#c3c7cc', [0, 0, cara - s * 0.01], EJE_Z, METAL, 40));
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; g.add(cil(0.014, 0.016, '#2a2a2a', [Math.cos(a) * 0.12, Math.sin(a) * 0.12, cara], EJE_Z)); }
    g.add(cil(0.055, 0.03, '#d4d7db', [0, 0, cara + s * 0.008], EJE_Z, METAL));
  }
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + 0.4; g.add(cil(0.011, 0.025, '#e5e7ea', [Math.cos(a) * 0.04, Math.sin(a) * 0.04, cara + s * 0.015], EJE_Z, METAL, 6)); }
  g.position.set(x, y, z);
  return g;
}

// ── Suzuki APV furgón: trompa corta, puerta corrediza, sin ventanas atrás, motor bajo los
//    asientos delanteros y tracción trasera ──
function construirAPV() {
  const XF = 1.3, XT = -1.33, YR = 0.31, zR = 0.69;
  const xParab = y => 1.56 - (y - 1.14) / (1.83 - 1.14) * (1.56 - 0.99);
  const { mesh: carroceria, zEn, lucesAdelante, lucesAtras } = casco({
    x0: -2.08, x1: 2.08,
    alto: suavizar(lin([[-2.08, 1.56], [-2.06, 1.76], [-2.01, 1.84], [-1.9, 1.865], [0.86, 1.865], [0.99, 1.83], [1.58, 1.14], [1.9, 1.03], [2.03, 0.96], [2.075, 0.84], [2.08, 0.6]])),
    bajo: bajoArcos(lin([[-2.08, 0.52], [-2.04, 0.36], [-1.92, 0.33], [1.92, 0.33], [2.04, 0.37], [2.08, 0.52]]), [XT, XF], YR, 0.38),
    ancho: suavizar(lin([[-2.08, 0.72], [-2.04, 0.8], [-1.92, 0.825], [1.7, 0.83], [1.95, 0.8], [2.05, 0.75], [2.08, 0.66]])),
    anchoTecho: lin([[-2.08, 0.66], [-1.95, 0.72], [0.9, 0.72], [1.0, 0.735], [1.58, 0.79], [2.08, 0.66]]),
    cintura: lin([[-2.08, 1.2], [0.95, 1.2], [1.55, 1.12], [1.65, 1.0], [2.08, 0.75]]),
    n: x => x > 1.6 ? 4.2 : 7,
    zona: (x, y, fz) => {
      const lado = Math.abs(fz) > 0.88;
      if (x > 1.0 && x < 1.55 && y > 1.17 && Math.abs(fz) < 0.9) return 'vidrio';
      if (lado && y > 1.25 && y < 1.79 && x > 0.2 && x < xParab(y) - 0.08) return 'vidrio';
      if (lado && y > 1.21 && y < 1.82 && x > 0.16 && x < xParab(y) - 0.04) return 'plastico';
      if (Math.abs(fz) > 0.72 && y > 1.16 && y < 1.84 && x > xParab(y) - 0.06 && x < xParab(y) + 0.05) return 'plastico';
      if (x > 1.97 && y > 0.86 && y < 1.0 && Math.abs(fz) > 0.42) return Math.abs(fz) > 0.8 ? 'ambar' : 'faro';
      if (lado && x > 1.75 && x < 1.82 && y > 0.84 && y < 0.88) return 'ambar';
      if (x < -2.0 && Math.abs(fz) > 0.72 && y > 1.0 && y < 1.42) return y < 1.08 ? 'cristal' : 'stop';
      if (x > 2.02 && Math.abs(fz) < 0.52 && y > 0.66 && y < 0.85) return 'parrilla';
      if ((x > 1.8 && y < 0.6) || (x < -1.94 && y < 0.56)) return 'plastico';
      return null;
    },
  });

  pz('chasis', grupo(
    [1, -1].map(s => caja(3.8, 0.1, 0.07, '#26292d', [-0.05, 0.38, s * 0.44], undefined, METAL)),
    [1.75, 0.75, -0.3, -1.3, -1.92].map(x => caja(0.06, 0.07, 0.88, '#26292d', [x, 0.38, 0], undefined, METAL)),
  ));

  pz('carroceria', grupo(
    carroceria,
    interior(1.42, 1.05, 1.4, 0.85, 1.0),
    // Juntas de puertas, manijas, tapa de combustible y canaletas del techo
    juntaV(zEn, 1.3, 0.74, 1.2), juntaV(zEn, 0.14, 0.5, 1.8), juntaV(zEn, -1.06, 0.5, 1.8),
    [[0.32, 1.1], [-0.86, 1.1]].map(([x, y]) => alCostado(zEn, x, y, () => caja(0.13, 0.035, 0.025, '#1b1b1b'))),
    alCostado(zEn, -1.5, 1.02, s => cil(0.06, 0.008, '#e9eaec', [0, 0, 0], EJE_Z)),
    // Espejos con brazo, limpiaparabrisas, emblema y patente
    [1, -1].map(s => { const z = zEn(1.56, 1.2); return [barra([1.56, 1.2, s * z], [1.51, 1.28, s * (z + 0.08)], 0.02, '#111'), caja(0.07, 0.2, 0.15, '#111', [1.5, 1.32, s * (z + 0.12)], [0, s * 0.2, 0])]; }),
    [0.55, -0.15].map(z => barra([1.555, 1.2, z], [1.4, 1.385, z - 0.36], 0.008, '#111')),
    caja(0.02, 0.08, 0.07, '#d4d7db', [2.085, 0.76, 0], undefined, METAL),
    caja(0.01, 0.13, 0.36, '#f4f4f4', [2.09, 0.48, 0]), caja(0.01, 0.13, 0.36, '#f4f4f4', [-2.1, 0.66, 0]),
    // Decoración Farmacorp
    calco(0.78, 0.2, marca, -0.47, 1.68, zEn(-0.47, 1.68) + 0.004),
    calco(1.95, 0.17, texto('¡Que estés muy bien!', AZUL_FC), 0.12, 0.97, zEn(0.12, 0.97) + 0.004),
    calco(0.75, 0.07, texto('www.farmacorp.com', AZUL_FC), -1.55, 0.76, zEn(-1.55, 0.76) + 0.004),
    calco(0.95, 0.95, (ctx, w, h) => {

  pz('motor', grupo(

  ), [0, 0, -1.9]);
  // Caja de cambios detrás del motor, cardán con crucetas y diferencial trasero
  pz('transmision', grupo(

  [1, -1].forEach(s => {

  pz('frenos', grupo(bombaFreno(1.62, 0.95, 0.35), cañerias([1.78, 0.95, 0.35], [[XF, YR, zR - 0.13], [XF, YR, -(zR - 0.13)], [XT, YR, zR - 0.13], [XT, YR, -(zR - 0.13)]])), [0.4, 0.6, 0]);

// ── RAM 700 Rapid furgón (5264PUB): frente de auto chico, cajón de fibra alto con joroba
//    sobre la cabina, puertas traseras dobles, motor transversal y tracción delantera ──
function construirRAM() {
  const XF = 1.2, XT = -1.18, YR = 0.31, zR = 0.68;
  const xParab = y => 1.1 - (y - 1.04) / (1.48 - 1.04) * (1.1 - 0.67);
  const { mesh: carroceria, zEn, lucesAdelante, lucesAtras } = casco({
    x0: -1.985, x1: 1.985,
    alto: suavizar(lin([[-1.985, 1.6], [-1.96, 1.82], [-1.9, 1.89], [-1.8, 1.9], [-0.05, 1.9], [0.08, 1.87], [0.22, 1.66], [0.34, 1.54], [0.55, 1.51], [0.66, 1.48], [1.12, 1.04], [1.6, 0.93], [1.9, 0.86], [1.97, 0.78], [1.985, 0.6]])),
    bajo: bajoArcos(lin([[-1.985, 0.5], [-1.95, 0.37], [-1.82, 0.34], [1.82, 0.34], [1.95, 0.38], [1.985, 0.5]]), [XT, XF], YR, 0.37),
    ancho: suavizar(lin([[-1.985, 0.74], [-1.95, 0.8], [-1.82, 0.815], [1.55, 0.81], [1.85, 0.76], [1.96, 0.68], [1.985, 0.6]])),
    anchoTecho: lin([[-1.985, 0.7], [-1.85, 0.765], [-0.05, 0.765], [0.2, 0.72], [0.5, 0.66], [0.66, 0.67], [1.12, 0.74], [1.985, 0.6]]),
    cintura: lin([[-1.985, 1.78], [-0.05, 1.78], [0.25, 1.06], [1.12, 1.02], [1.3, 0.92], [1.985, 0.75]]),
    n: x => x < 0 ? 8 : x > 1.4 ? 4.2 : 6,
    zona: (x, y, fz) => {
      const lado = Math.abs(fz) > 0.88;
      if (x > 0.68 && x < 1.09 && y > 1.06 && Math.abs(fz) < 0.9) return 'vidrio';
      if (lado && y > 1.08 && y < 1.45 && x > 0.22 && x < xParab(y) - 0.07) return 'vidrio';
      if (lado && y > 1.05 && y < 1.48 && x > 0.18 && x < xParab(y) - 0.03) return 'plastico';
      if (Math.abs(fz) > 0.72 && y > 1.04 && y < 1.5 && x > xParab(y) - 0.05 && x < xParab(y) + 0.05) return 'plastico';
      if (lado && y > 0.44 && y < 0.56 && x > -0.7 && x < 0.78) return 'plastico';
      if (x > 1.8 && x < 1.975 && y > 0.74 && y < 0.88 && Math.abs(fz) > 0.45) return Math.abs(fz) > 0.86 ? 'ambar' : 'faro';
      if (x < -1.94 && Math.abs(fz) > 0.74 && y > 0.86 && y < 1.36) return y < 0.96 ? 'cristal' : 'stop';
      if (x > 1.96 && Math.abs(fz) < 0.36 && y > 0.62 && y < 0.74) return 'parrilla';
      if ((x > 1.84 && y < 0.52) || (x < -1.92 && y < 0.5)) return 'plastico';
      return null;
    },
  });

  pz('chasis', grupo(
    [1, -1].map(s => caja(3.7, 0.09, 0.07, '#26292d', [0.0, 0.39, s * 0.44], undefined, METAL)),
    [1.55, 0.6, -0.4, -1.3, -1.85].map(x => caja(0.06, 0.07, 0.88, '#26292d', [x, 0.39, 0], undefined, METAL)),
  ));

  pz('carroceria', grupo(
    carroceria,
    interior(0.92, 0.93, 1.36, 0.4, 0.72, 0.6),
    juntaV(zEn, 1.13, 0.6, 1.03), juntaV(zEn, 0.17, 0.5, 1.46),
    alCostado(zEn, 0.3, 0.95, () => caja(0.12, 0.035, 0.025, '#1b1b1b')),
    alCostado(zEn, -1.35, 0.78, () => cil(0.055, 0.008, '#eceef0', [0, 0, 0], EJE_Z)),
    calco(1.62, 0.8, (ctx, w, h) => { ctx.strokeStyle = '#c4c8cd'; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(4, 4, w - 8, h - 8, h * 0.18); ctx.stroke(); }, -0.98, 1.36, zEn(-0.98, 1.36) + 0.003),
    calco(1.3, 0.3, marca, -0.98, 1.38, zEn(-0.98, 1.38) + 0.005),
    calco(0.22, 0.22, (ctx, w, h) => flor(ctx, w / 2, h / 2, w * 0.45), 0.72, 0.84, zEn(0.72, 0.84) + 0.004),
    calco(0.2, 0.05, texto('Farmacorp', AZUL_FC, 600, false), 0.72, 0.7, zEn(0.72, 0.7) + 0.004),
    calco(0.3, 0.05, texto('RAPID', '#9aa0a6', 700, false), 0.6, 0.5, zEn(0.6, 0.5) + 0.006),
    [1, -1].map(s => { const z = zEn(1.08, 1.06); return [barra([1.08, 1.06, s * z], [1.04, 1.12, s * (z + 0.07)], 0.02, '#111'), caja(0.07, 0.17, 0.14, '#111', [1.03, 1.15, s * (z + 0.11)], [0, s * 0.2, 0])]; }),
    [0.5, -0.12].map(z => barra([1.105, 1.075, z], [0.97, 1.205, z - 0.33], 0.008, '#111')),
    cil(0.045, 0.02, '#d4d7db', [1.985, 0.68, -0.14], EJE_X, METAL),
    caja(0.01, 0.12, 0.34, '#f4f4f4', [1.99, 0.45, 0]),
    // Puertas traseras dobles: junta, manija, placa con soporte negro, tercera luz de freno
    caja(0.004, 1.32, 0.008, '#7d838a', [-1.99, 1.16, 0]),
    caja(0.03, 0.12, 0.05, '#111', [-2.0, 1.0, 0.16]),
    caja(0.02, 0.26, 0.22, '#111', [-1.995, 1.12, -0.38]),
    caja(0.01, 0.12, 0.34, '#f4f4f4', [-1.995, 0.68, 0.1]),
    caja(0.03, 0.04, 0.4, '#8a1414', [-1.95, 1.88, 0], undefined, { emissive: '#ff3b30', emissiveIntensity: 0.2 }),
  ), [0, 1.9, 0]);

  pz('electrico', lucesAdelante, [0.8, 0, 0]);
  pz('electrico', lucesAtras, [-0.8, 0, 0]);
  // Motor transversal bajo el capó (cigüeñal a lo ancho)
  const m = motorCuatro({ filtroY: 0.12 });
  pz('electrico', grupo(
    conjunto(m.elec, [1.5, 0.5, -0.02], Math.PI / 2),
    caja(0.22, 0.18, 0.16, '#1f1f1f', [1.7, 0.6, 0.52]),
    [[1.64, '#c41e1e'], [1.76, '#111']].map(([x, c]) => cil(0.018, 0.04, c, [x, 0.71, 0.52])),
    tubo([[1.64, 0.73, 0.52], [1.55, 0.72, 0.3], [1.5, 0.55, 0.15]], 0.01, '#c41e1e'),
    caja(0.12, 0.08, 0.16, '#262a2e', [1.25, 0.72, -0.5]),
    tubo([[1.25, 0.7, -0.45], [0.5, 0.48, -0.4], [-1.2, 0.46, -0.45], [-1.95, 0.9, -0.66]], 0.012, '#111'),
  ), [0.6, 0.8, 1.2]);
  pz('motor', grupo(
    conjunto(m.motor, [1.5, 0.5, -0.02], Math.PI / 2),
    conjunto(radiador(0.6, 0.3), [1.88, 0.56, 0]),
    tubo([[1.86, 0.69, -0.2], [1.75, 0.75, -0.15], [1.6, 0.74, -0.05]], 0.02, '#111'),
    tubo([[1.86, 0.43, 0.2], [1.75, 0.38, 0.15], [1.6, 0.4, 0.05]], 0.02, '#111'),
    tanqueCombustible(-0.62, 0.44, [-1.35, 0.78, zEn(-1.35, 0.78)]),
    escape([[1.25, 0.52, 0.0], [1.15, 0.35, 0.05], [0.8, 0.3, 0.2], [0.4, 0.3, 0.28]], 0.15, -1.55, -2.0, 0.28),
  ), [0.2, 0, -1.9]);
  // Caja transeje al costado del motor y palieres con fuelles a las ruedas delanteras
  const fuelle = (x, y, z) => new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.09, 14), mat('#111', { roughness: 0.9 })).translateX(x).translateY(y).translateZ(z).rotateX(Math.PI / 2);
  pz('transmision', grupo(
    caja(0.3, 0.24, 0.28, '#4b5563', [1.42, 0.45, 0.4], undefined, { metalness: 0.6 }),
    cil(0.14, 0.08, '#6b7280', [1.48, 0.5, 0.27], EJE_Z, METAL),
    barra([1.32, 0.38, 0.52], [XF, YR, zR - 0.2], 0.022, '#9ca3af', METAL),
    barra([1.32, 0.38, 0.26], [XF, YR, -(zR - 0.2)], 0.022, '#9ca3af', METAL),
    fuelle(1.3, 0.37, 0.56), fuelle(1.22, 0.32, zR - 0.24), fuelle(1.3, 0.37, -0.22), fuelle(1.22, 0.32, -(zR - 0.24)),
  ), [0, -0.05, 1.8]);
  [1, -1].forEach(s => {
    pz('suspension', grupo(mcpherson(XF, YR, zR - 0.17, s)), [0, 0.5, s * 0.35]);

  pz('suspension', grupo(
    barra([XT, YR, -0.62], [XT, YR, 0.62], 0.04, '#3a3f45', METAL),
    direccion(XF - 0.16, YR + 0.05, zR), estabilizadora(XF - 0.05, YR + 0.02),
  ), [0, 0.25, 0]);
  [[XF, 1], [XF, -1], [XT, 1], [XT, -1]].forEach(([x, s]) => {
    pz('frenos', x === XF ? frenoDisco(x, YR, s * (zR - 0.13), s) : frenoTambor(x, YR, s * (zR - 0.13), s), [0, 0, s * 0.55]);
    pz('ruedas', rueda(x, YR, s * zR, s, 'aleacion'), [0, 0, s * 1.15]);
  });
  pz('frenos', grupo(bombaFreno(1.08, 0.78, 0.38), cañerias([1.24, 0.78, 0.38], [[XF, YR, zR - 0.13], [XF, YR, -(zR - 0.13)], [XT, YR, zR - 0.13], [XT, YR, -(zR - 0.13)]])), [0.4, 0.6, 0]);
  pz('mandos', grupo(mandosAuto(0.7, 1.04, 0.35, 1.0, 0.5, 0.62, 0.62)), [0, 1.05, 0]);

  return { centro: V(0, 0.9, 0), camara: V(4.6, 2.4, 4.6) };
}

// ── Moto Honda CB160 Hornet de reparto (según foto): naked negra con detalles plateados,
//    monoshock, discos adelante y atrás, llantas de aleación negras; parrilla con cajón amarillo ──
function construirMoto() {
  const negro = '#151515', marco = '#1f1f1f', plata = '#b9bdc3', cromo = '#d4d4d4';
  const F = [0.72, 0.3], T = [-0.72, 0.3];
  const ZC = -0.11;   // lado de la cadena; el escape va del otro lado

  pz('chasis', grupo(
    barra([0.43, 0.9, 0], [0.475, 0.69, 0], 0.032, marco),
    [1, -1].map(s => [
      barra([0.45, 0.84, s * 0.05], [0.05, 0.76, s * 0.1], 0.02, marco),
      barra([0.05, 0.76, s * 0.1], [-0.3, 0.62, s * 0.1], 0.02, marco),
      barra([-0.3, 0.62, s * 0.1], [-0.36, 0.5, s * 0.1], 0.02, marco),
      barra([-0.25, 0.68, s * 0.07], [-0.85, 0.9, s * 0.06], 0.013, marco),
      barra([-0.34, 0.52, s * 0.07], [-0.7, 0.85, s * 0.06], 0.011, marco),
    ]),
    barra([0.47, 0.74, 0], [0.24, 0.32, 0], 0.02, marco),
    barra([0.24, 0.32, 0], [-0.16, 0.26, 0], 0.018, marco),
  ));

  // Ruedas de aleación negras, 5 pares de rayos finos
  [[F, 1, 0.055], [T, -1, 0.068]].forEach(([[x, y], s, t]) => {
    const tire = mesh(new THREE.TorusGeometry(0.3 - t, t, 18, 64), '#121212', [x, y, 0], undefined, GOMA);
    tire.scale.z = 1.1;
    const rayos = [];
    for (let i = 0; i < 5; i++) [-0.13, 0.13].forEach(d => {
      const a = i * Math.PI * 2 / 5 + d;
      rayos.push(barra([x + Math.cos(a) * 0.04, y + Math.sin(a) * 0.04, 0], [x + Math.cos(a + d) * 0.2, y + Math.sin(a + d) * 0.2, 0], 0.007, '#111', METAL));
    });
    pz('ruedas', grupo(
      tire,
      mesh(new THREE.TorusGeometry(0.205, 0.013, 8, 56), '#111', [x, y, 0], undefined, METAL),
      cil(0.04, 0.12, '#2a2a2a', [x, y, 0], EJE_Z, METAL),
      rayos,
    ), [s * 0.5, 0, 0]);
  });

  // Discos de pétalos y cálipers
  const disco = (x, y, r, z) => {
    const g = new THREE.Group();
    g.add(cil(r, 0.005, '#c3c7cc', [x, y, z], EJE_Z, METAL, 18));
    g.add(cil(r * 0.55, 0.008, '#3a3a3a', [x, y, z], EJE_Z, METAL));
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; g.add(cil(0.009, 0.008, '#2a2a2a', [x + Math.cos(a) * r * 0.75, y + Math.sin(a) * r * 0.75, z], EJE_Z)); }
    return g;
  };
  pz('frenos', grupo(
    disco(F[0], F[1], 0.135, 0.075),
    caja(0.07, 0.11, 0.04, '#b8862b', [F[0] - 0.08, F[1] + 0.1, 0.085], [0, 0, 0.7], METAL),
  ), [0.5, 0, 0.45]);
  pz('frenos', grupo(
    disco(T[0], T[1], 0.11, 0.08),
    caja(0.08, 0.06, 0.04, '#2a2a2a', [T[0] + 0.02, T[1] - 0.1, 0.09]),
  ), [-0.5, 0, 0.45]);

  // Horquilla telescópica, monoshock y basculante
  pz('suspension', grupo([1, -1].map(s => [
    barra([0.43, 0.9, s * 0.08], [0.6, 0.555, s * 0.08], 0.019, '#cfd3d8', METAL),
    barra([0.6, 0.555, s * 0.08], [F[0], F[1] + 0.02, s * 0.08], 0.03, '#1a1a1a', METAL),
  ]),
    caja(0.08, 0.03, 0.22, '#222', [0.43, 0.9, 0], [0, 0, 0.45]),
    caja(0.08, 0.03, 0.22, '#222', [0.465, 0.8, 0], [0, 0, 0.45]),
  ), [0.4, 0.3, 0]);
  pz('suspension', resorte([-0.28, 0.5, 0], [-0.12, 0.78, 0], 0.035, 8, '#d42020'), [0, 0.45, 0.35]);
  pz('suspension', grupo([1, -1].map(s => barra([-0.36, 0.5, s * 0.1], [T[0], T[1], s * 0.1], 0.024, '#1a1a1a', METAL)),
    barra([-0.36, 0.5, -0.1], [-0.36, 0.5, 0.1], 0.02, '#1a1a1a')), [0, -0.05, -0.3]);

  // Motor monocilíndrico: cárter negro con tapa plateada, cilindro con aletas, escape corto
  const aletas = [];
  for (let i = 0; i < 6; i++) aletas.push(caja(0.17, 0.015, 0.2, '#2f2f2f', [0.12 + i * 0.028 * Math.sin(0.25), 0.47 + i * 0.028 * Math.cos(0.25), 0], [0, 0, -0.25], { metalness: 0.6 }));
  pz('motor', grupo(
    caja(0.36, 0.26, 0.24, '#232323', [-0.02, 0.36, 0], undefined, { metalness: 0.5 }),
    cil(0.11, 0.04, plata, [-0.02, 0.36, 0.13], EJE_Z, METAL),
    cil(0.05, 0.02, '#c41e1e', [-0.02, 0.36, 0.155], EJE_Z),
    aletas,
    caja(0.17, 0.06, 0.2, '#3a3a3a', [0.17, 0.66, 0], [0, 0, -0.25], METAL),
    cil(0.03, 0.09, '#a3a3a3', [-0.08, 0.58, 0], EJE_X, METAL),
    caja(0.16, 0.14, 0.18, '#1a1a1a', [-0.22, 0.6, 0]),

// En pantallas angostas la cámara se aleja para que entre el vehículo completo
let ENCUADRE = null;
function encuadrar() {
  if (!ENCUADRE) return;
  const { centro, camara } = ENCUADRE;
  controls.target.copy(centro);
  camera.position.copy(centro).addScaledVector(camara.clone().sub(centro), Math.max(1, 1.5 / (camera.aspect || 1.5)));
}
function construir(modelo) {
  if (modeloActual === modelo) return;
  if (root) { scene.remove(root); root.traverse(o => { if (o.isMesh) { o.geometry.dispose(); mats(o).forEach(mt => { mt.map?.dispose(); mt.dispose(); }); } }); }
  root = new THREE.Group(); piezas = [];
  scene.add(root);
  const { centro, camara } = { moto: construirMoto, apv: construirAPV, ram: construirRAM }[modelo]();
  ENCUADRE = { centro, camara };
  encuadrar();
  const lejos = camara.distanceTo(centro);
  controls.minDistance = lejos * 0.35; controls.maxDistance = lejos * 2.2;
  modeloActual = modelo;
  DES.t = S.desarmar ? 1 : 0;
}

// ── Colores: mapa de calor, resaltado y piezas fantasma ──
const RAMPA = [[0, '#245ea8'], [0.35, '#3987e5'], [0.7, '#F5A623'], [1, '#FF4444']].map(([t, c]) => [t, new THREE.Color(c)]);
const SIN_GASTO = new THREE.Color('#2f3640');
function rampa(t) {
  for (let i = 1; i < RAMPA.length; i++) if (t <= RAMPA[i][0]) {
    const [t0, c0] = RAMPA[i - 1], [t1, c1] = RAMPA[i];
    return c0.clone().lerp(c1, (t - t0) / (t1 - t0));
  }
  return RAMPA.at(-1)[1].clone();
}
function colorParte(id) {
  const max = Math.max(...PARTES.map(p => AGG[p.id]?.monto || 0));
  const m = AGG[id]?.monto || 0;
  return m > 0 && max > 0 ? rampa(Math.sqrt(m / max)) : SIN_GASTO.clone();
}
const AMBAR = new THREE.Color('#F5A623');
function pintar() {
  const cols = Object.fromEntries(PARTES.map(p => [p.id, colorParte(p.id)]));
  root?.traverse(m => {
    if (!m.isMesh) return;
    const p = m.userData.parte;
    const marcado = p === S.parte || (p === S.hover && p !== 'chasis');
    const fantasma = S.parte && S.parte !== 'general' && p !== S.parte;
    mats(m).forEach(mt => {
      const u = mt.userData;
      if (S.calor && cols[p]) {
        const lum = u.c0.r * 0.3 + u.c0.g * 0.59 + u.c0.b * 0.11;
        mt.color.copy(cols[p]).multiplyScalar(0.45 + 0.55 * Math.min(1, lum * 1.6));
      } else mt.color.copy(u.c0);
      if (marcado) { mt.emissive.copy(AMBAR); mt.emissiveIntensity = p === S.parte ? 0.35 : 0.2; }
      else { mt.emissive.copy(u.e0); mt.emissiveIntensity = u.ei0; }
      const tr = !!(fantasma || u.t0);
      if (mt.transparent !== tr) { mt.transparent = tr; mt.needsUpdate = true; }   // cambia el shader: hay que recompilar
      mt.opacity = fantasma ? 0.1 : u.o0; mt.depthWrite = !fantasma && !u.t0;
    });
  });
}

// ── Desarmar: cada parte sale en su turno, con suavizado ──
const DES = { t: 0 };
const suave = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function moverPiezas() {
  piezas.forEach(o => {
    const orden = PARTE[o.userData.parte]?.orden ?? 0;
    const k = Math.min(1, Math.max(0, DES.t * 1.6 - orden * 0.075));
    o.position.copy(o.userData.base).addScaledVector(o.userData.ex, suave(k));
  });
}

// ── Interacción ──
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), tip = document.getElementById('tip');
function parteBajo(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  // Con una pieza elegida, las demás quedan transparentes: se prioriza lo que se ve sólido
  const hits = ray.intersectObjects(piezas, true).filter(h => h.object.userData.parte && h.object.userData.parte !== 'chasis');
  const matDe = h => Array.isArray(h.object.material) ? h.object.material[h.face?.materialIndex ?? 0] : h.object.material;
  const solido = hits.find(h => matDe(h).opacity > 0.5);
  return (solido || hits[0])?.object.userData.parte || '';
}
renderer.domElement.addEventListener('pointermove', ev => {
  if (ev.buttons) { tip.style.display = 'none'; return; }
  const p = parteBajo(ev);
  if (p !== S.hover) { S.hover = p; pintar(); }
  if (p) {
    const a = AGG[p], r = wrap.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(PARTE[p].nombre)}</b><span>${bs(a.monto)} · ${a.n} gasto${a.n === 1 ? '' : 's'}</span>`;
    tip.style.display = 'block';
    tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - tip.offsetWidth - 8) + 'px';
    tip.style.top = (ev.clientY - r.top + 14) + 'px';
    renderer.domElement.style.cursor = 'pointer';
  } else { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; }
});
renderer.domElement.addEventListener('pointerleave', () => { S.hover = ''; tip.style.display = 'none'; pintar(); });
let abajo = null;
renderer.domElement.addEventListener('pointerdown', ev => abajo = [ev.clientX, ev.clientY]);
renderer.domElement.addEventListener('pointerup', ev => {
  if (!abajo || Math.hypot(ev.clientX - abajo[0], ev.clientY - abajo[1]) > 5) return;
  const p = parteBajo(ev);
  elegir(p && p !== S.parte ? p : '');
});

function elegir(p) {
  S.parte = p; S.shown = 60;
  if (p) { S.girar = false; controls.autoRotate = false; document.getElementById('bGirar').classList.remove('active'); }
  pintar(); panel();
}
const boton = (id, fn) => document.getElementById(id).onclick = fn;
boton('bDesarmar', () => {
  S.desarmar = !S.desarmar;
  document.getElementById('bDesarmar').textContent = S.desarmar ? 'Armar' : 'Desarmar';
  document.getElementById('bDesarmar').classList.toggle('active', S.desarmar);
});
boton('bCalor', () => { S.calor = !S.calor; document.getElementById('bCalor').classList.toggle('active', S.calor); document.getElementById('leyenda').style.visibility = S.calor ? '' : 'hidden'; pintar(); });
boton('bGirar', () => { S.girar = !S.girar; controls.autoRotate = S.girar; document.getElementById('bGirar').classList.toggle('active', S.girar); });

// ── Bucle de render ──
function ajustar() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  encuadrar();
}
new ResizeObserver(ajustar).observe(wrap);
const reloj = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.05);
  const meta = S.desarmar ? 1 : 0;
  if (DES.t !== meta) { DES.t = meta > DES.t ? Math.min(1, DES.t + dt / 1.6) : Math.max(0, DES.t - dt / 1.6); moverPiezas(); }
  controls.update();
  renderer.render(scene, camera);
});

// ══ PANEL ═══════════════════════════════════════════════════════════════════
function actualizar() {
  const tipo = tipoSel();
  construir(modeloSel());
  const rows = filasSel();
  AGG = agregar(rows);
  const total = rows.reduce((s, r) => s + r.monto, 0);
  const grupoSel = S.veh.startsWith('@');
  document.getElementById('hPlaca').textContent = grupoSel ? (tipo === 'moto' ? 'Todas las motos' : 'Todos los furgones') : S.veh;
  document.getElementById('hModelo').textContent = grupoSel
    ? `${[...VEH.values()].filter(v => v.tipo === tipo).length} vehículos`
    : `${VEH.get(S.veh).etiqueta}${FLOTA.get(S.veh)?.proxi ? ' · ' + FLOTA.get(S.veh).proxi : ''}`;
  document.getElementById('hTotal').innerHTML = `${bs(total)} <span>en mantenimiento · ${rows.length} gastos${S.anio ? ' · ' + S.anio : ''}</span>`;
  moverPiezas(); pintar(); panel();
}

function panel() {
  const lista = [...PARTES, GENERAL].map(p => ({ p, a: AGG[p.id] })).sort((x, y) => y.a.monto - x.a.monto);
  const max = Math.max(1, ...lista.map(x => x.a.monto));
  const hex = id => id === 'general' ? '#8a8a8a' : '#' + colorParte(id).getHexString();
  let html = `<div class="p-sec"><div class="p-h"><span>Gasto por pieza</span><span>clic para ver</span></div>` +
    lista.map(({ p, a }) => `<div class="pt-row${S.parte === p.id ? ' on' : ''}" data-p="${p.id}">
      <span class="sw" style="background:${hex(p.id)}"></span><span class="pt-n">${esc(p.nombre)}</span><span class="pt-m">${bs(a.monto)}</span>
      <div class="pt-bar"><i style="width:${(a.monto / max * 100).toFixed(1)}%;background:${hex(p.id)}"></i></div>
      <span class="pt-c">${a.n} gasto${a.n === 1 ? '' : 's'}</span></div>`).join('') + '</div>';

  html += `<div class="p-sec nota">Toca una pieza en el vehículo o en esta lista para ver el desglose de sus gastos. Cada gasto se asigna a las piezas que nombra su descripción; si nombra varias (por ejemplo, aceite y pastillas de freno), el monto se reparte en partes iguales. Solo cuenta mantenimiento: preventivo, correctivo y repuestos.</div>`;
  const el = document.getElementById('panel');
  el.innerHTML = html;
  el.querySelectorAll('.pt-row').forEach(r => r.onclick = () => elegir(S.parte === r.dataset.p ? '' : r.dataset.p));
  ficha();
}

// ── Ficha flotante: desglose de los gastos de la pieza elegida ──
const COLOR_TIPO = { PREVENTIVO: '#245ea8', CORRECTIVO: '#3987e5', REPUESTOS: '#7db3f2' };
function ficha() {
  const el = document.getElementById('ficha');
  if (!S.parte) { el.style.display = 'none'; return; }
  const p = PARTE[S.parte], a = AGG[S.parte], grupoSel = S.veh.startsWith('@');
  const parteDe = r => r.monto / r.partes.length;          // lo que le toca a esta pieza
  const rows = [...a.rows].sort((x, y) => y.fecha.localeCompare(x.fecha) || y.id - x.id);
  const sumarPor = clave => {
    const m = new Map();
    rows.forEach(r => { const k = clave(r); const v = m.get(k) || { monto: 0, n: 0 }; v.monto += parteDe(r); v.n++; m.set(k, v); });
    return [...m.entries()].sort((x, y) => y[1].monto - x[1].monto);
  };
  const barras = (lista, color) => {
    const max = Math.max(1, ...lista.map(([, v]) => v.monto));
    return lista.map(([k, v]) => `<div class="f-fila">
      <span class="f-k">${esc(k)}</span>
      <span class="f-bar"><i style="width:${(v.monto / max * 100).toFixed(1)}%;background:${color(k)}"></i></span>
      <span class="f-v">${bs(v.monto)}</span><span class="f-p">${a.monto ? Math.round(v.monto / a.monto * 100) : 0}%</span>
    </div>`).join('');
  };
  const porTipo = sumarPor(r => r.tipo);
  const segunda = grupoSel ? ['Por placa', sumarPor(r => r.placa).slice(0, 8)] : !S.anio ? ['Por año', sumarPor(r => String(r.anio)).sort((x, y) => y[0] - x[0])] : null;
  const ultimo = rows[0]?.fecha;
  el.innerHTML = `
    <div class="f-head">
      <div><div class="f-tit">${esc(p.nombre)}</div><div class="f-sub">Incluye ${esc(p.incluye)}.</div></div>
      <button class="f-x" id="fCerrar" title="Cerrar">×</button>
    </div>
    <div class="det-kpi"><div><small>Gasto</small>${bs(a.monto)}</div><div><small>Gastos</small>${a.n}</div>${ultimo ? `<div><small>Último</small>${ultimo}</div>` : ''}</div>
    ${rows.some(r => r.errores.length) ? `<div class="f-err" style="margin-top:10px">⚠ ${rows.filter(r => r.errores.length).length} gasto(s) con palabras mal escritas en el Excel; se marcan abajo.</div>` : ''}
    ${rows.length ? `
    <div class="f-sec">Por tipo de gasto</div>${barras(porTipo, k => COLOR_TIPO[k] || '#8a8a8a')}
    ${segunda ? `<div class="f-sec">${segunda[0]}</div>${barras(segunda[1], () => '#F5A623')}` : ''}
    <div class="f-sec">Detalle de gastos</div>
    ${rows.slice(0, S.shown).map(r => `<div class="g-row">
      <div class="g-top"><span>${r.fecha}</span>${grupoSel ? `<span>${esc(r.placa)}</span>` : ''}<span style="color:${COLOR_TIPO[r.tipo] || 'inherit'}">${esc(r.tipo)}</span><span class="g-m">${bs(parteDe(r))}</span></div>
      <div class="g-desc">${esc(r.descripcion) || '<span style="color:var(--text3)">sin descripción</span>'}</div>
      ${r.partes.length > 1 ? `<div class="g-tags"><span class="f-rep">Bs ${fmt2.format(r.monto)} repartido entre</span>${r.partes.map(id => `<span class="tag${id === S.parte ? ' on' : ''}">${esc(PARTE[id].nombre)}</span>`).join('')}</div>` : ''}
      ${r.errores.length ? `<div class="f-err">⚠ Mal escrito en el Excel: ${r.errores.map(([mal, bien]) => `<b>${esc(mal.toLowerCase())}</b> → ${esc(bien.toLowerCase())}`).join(', ')}</div>` : ''}
    </div>`).join('')}
    ${rows.length > S.shown ? `<button class="link" id="mas">Mostrar ${Math.min(100, rows.length - S.shown)} más de ${rows.length - S.shown}</button>` : ''}
    ` : '<div class="nota" style="margin-top:12px">Sin gastos para esta pieza con estos filtros.</div>'}`;
  el.style.display = 'block';
  el.scrollTop = 0;
  document.getElementById('fCerrar').onclick = () => elegir('');
  const mas = document.getElementById('mas');
  if (mas) mas.onclick = () => { S.shown += 100; ficha(); };
}

cargar();
</script>
</body>
</html>
